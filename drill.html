<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Killer Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&family=Gaegu:wght@300;400;700&family=Gowun+Dodum&family=Jua&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FAF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="모두의 통사">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/favicon.png">
<link rel="stylesheet" href="css/base.css?v=873fa070">
<link rel="stylesheet" href="css/coach.css?v=57f0f96e">
<script>try{var _s=localStorage.getItem("terra.skin");if(_s===null||_s==="")_s="jelly";if(_s==="night")_s="";if(_s==="diary")_s="jelly";if(_s)document.documentElement.dataset.skin=_s;}catch(e){}</script>
<style>
  .page{max-width:var(--wrap);margin:0 auto;padding:0 var(--s3) var(--s6)}

  .kgrid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:var(--s3);
    align-items:start;margin-top:var(--s4)}
  @media(max-width:1080px){.kgrid{grid-template-columns:1fr}}
  .stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .qbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:16px 20px;border-bottom:1px solid var(--line)}
  .qbar .q{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.025em}
  .body{padding:20px}


  /* ── 지도 ── */
  /* 폰에서 지도가 납작해 도시가 안 보였다 — 세로를 확보한다 */
  @media(max-width:760px){
    .mapwrap{min-height:290px}
    .mapwrap svg{min-height:290px}
  }
  .mapwrap{position:relative;background:#05070A;border-radius:12px;overflow:hidden;
    border:1px solid var(--line)}
  .mapwrap svg{display:block;width:100%;height:auto}
  .land{fill:#151D27;stroke:#31445A;stroke-width:.4;vector-effect:non-scaling-stroke}
  .city{fill:var(--mint)}
  .city.dim{fill:#20313C}
  .pulse{fill:none;stroke:var(--mint);stroke-width:.9;vector-effect:non-scaling-stroke}
  .clab{font-family:"Noto Sans KR",sans-serif;font-weight:700;fill:#EAF6F8;paint-order:stroke;
    stroke:#05070A;stroke-width:3.5;stroke-linejoin:round}

  :root{--citydim:#20313C;--axis:#333C47;--axis-ink:#545B64}
  .clabt{fill:#EAF6F8}
  :root[data-skin="paper"]{--citydim:#B9C4D0;--axis:#C9C3B5;--axis-ink:#8A8F9C}
  :root[data-skin="paper"] .clabt{fill:#1F2430}
  :root[data-skin="paper"] .passage:before{color:#C9C3B5}
  .mapbg{fill:#05070A}
  .city.off{fill:#18222C}
  /* ── 종이 스킨: 어두운 판을 밝게 (2026-09-16) ── */
  :root[data-skin="paper"] .mapwrap{background:#EDF1F5}
  :root[data-skin="paper"] .mapbg{fill:#EDF1F5}
  :root[data-skin="paper"] .land{fill:#D7DEE6;stroke:#B5C0CC}
  :root[data-skin="paper"] .city.dim{fill:#B9C4D0}
  :root[data-skin="paper"] .city.off{fill:#C9D2DB}
  :root[data-skin="paper"] .clab{fill:#1F2430;stroke:#EDF1F5}
  :root[data-skin="paper"] .passage{background:var(--surface-2);border-color:var(--line-2);color:var(--ink)}
  :root[data-skin="paper"] .qimg{background:var(--surface-2)}
  :root[data-skin="paper"] .ppc{background:var(--surface-2)}
  .maplegend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:14.5px;color:var(--ink-4)}
  .maplegend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;
    vertical-align:-1px}

  .mapwrap{position:relative}
  .count{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;background:rgba(5,7,10,.55);backdrop-filter:blur(1.5px);
    z-index:2;pointer-events:none}
  .count .n{font-family:var(--mono);font-size:clamp(74px,11vw,128px);font-weight:800;
    color:var(--ink);letter-spacing:-.06em;line-height:1;
    animation:cpop .92s cubic-bezier(.16,.84,.3,1) both}
  .count .cap{font-size:16px;color:var(--ink-3);letter-spacing:.02em}
  .count .rg{font-family:var(--kr);font-weight:700;font-size:14.5px;color:var(--mint);letter-spacing:-.01em;}
  @keyframes cpop{0%{opacity:0;transform:scale(1.5)}42%{opacity:1;transform:scale(1)}
    100%{opacity:.25;transform:scale(.94)}}
  .opts.wait{opacity:.4;pointer-events:none}

  .review{margin:30px auto 0;max-width:860px;text-align:left;border:1px solid var(--line);
    border-radius:14px;background:var(--bg-2);padding:22px}
  .review .rvhd h3{font-size:19px;margin-top:8px;letter-spacing:-.03em}
  .review .rvhd p{font-size:15px;color:var(--ink-4);margin-top:5px;font-family:var(--mono);font-weight:800}
  .review .mapwrap{margin-top:16px}
  .rvcity{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .rc{display:inline-flex;align-items:center;gap:7px;font-size:15px;color:var(--ink-2);
    border:1px solid var(--line-2);border-radius:8px;padding:6px 11px}
  .rc i{width:9px;height:9px;border-radius:2px;display:block}
  .rc b{font-family:var(--mono);font-size:14.5px;color:var(--ink);font-weight:800}
  .rvq{margin-top:14px;font-size:15.5px;line-height:1.75;color:var(--ink-3);
    border-left:2px solid var(--line-3);padding-left:14px}
  .rvnote{margin-top:12px;font-size:14.5px;color:var(--ink-4)}

  /* ── 선택지 ── */
  .opts{display:grid;gap:9px;margin-top:18px}
  .opts.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
  .opts.c5 .opt{min-height:62px}
  @media(max-width:1100px){.opts.c5{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .opts.c2{grid-template-columns:1fr 1fr}
  /* 0919 대표님 폰 — 긴 선지가 반쪽 칸에 한 낱말씩 끊겼다. 폰은 한 줄에 하나 */
  @media(max-width:560px){.opts.c2{grid-template-columns:1fr}}
  .opt{display:flex;gap:11px;align-items:center;padding:14px 16px;border-radius:11px;
    border:1px solid var(--line-2);background:var(--surface-2);cursor:pointer;text-align:left;
    font-family:inherit;font-size:16px;color:var(--ink-2);transition:.14s}
  .opt:hover{border-color:var(--line-3);color:var(--ink)}
  .opt .k{flex:0 0 22px;height:22px;border-radius:6px;background:var(--surface-3);
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);
    font-size:14.5px;font-weight:800;color:var(--ink-4)}
  .opt b{color:var(--ink);font-weight:700}
  .opt[data-s="ok"]{border-color:var(--mint);background:var(--mint-soft);color:var(--ink)}
  .opt[data-s="no"]{border-color:var(--red);background:var(--red-soft)}
  .opts.c2 .opt{justify-content:center;font-size:17px;font-weight:800;padding:20px}

  .gorow{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
  .btn.big{font-size:16px;padding:14px 30px;border-radius:11px}
  .gohint{font-family:var(--mono);font-size:14.5px;color:var(--ink-4);font-weight:800}
  /* 시험 범위 밖 훈련 */
  .mode.out{display:none}   /* 범위 밖 유형은 아예 안 보인다(2026-09-19) — 흐리게 두니 목록만 길었다 */
  .mode.out:after{content:"이번 범위 아님";display:block;margin-top:5px;
    font-family:var(--mono);font-size:14.5px;color:var(--ink-4);font-weight:800}
  .scopebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r1);
    padding:11px 14px;margin-bottom:var(--s3);font-size:15px;color:var(--ink-3)}
  .scopebar b{color:var(--ink)}
  .scopebar a{margin-left:auto;font-size:14.5px;color:var(--red-2)}
  /* 조문 */
  .arti{margin:14px 0 4px;border:1px solid var(--line-2);border-radius:var(--r1);
    background:var(--surface-2);overflow:hidden}
  .arti .ah{display:flex;align-items:center;gap:8px;padding:9px 13px;
    background:var(--surface);border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:14.5px;color:var(--ink-3);letter-spacing:.04em;font-weight:800}
  .arti .ah b{color:var(--ink);font-size:14.5px}
  .arti pre{margin:0;padding:12px 14px;font-family:var(--sans);font-size:15.5px;
    line-height:1.85;color:var(--ink-2);white-space:pre-wrap;word-break:keep-all}
  .sitbox{padding:15px 16px;border-radius:var(--r1);background:var(--surface);
    border:1px solid var(--line-2);font-size:15.5px;line-height:1.8;color:var(--ink-2)}
  .trapline{margin-top:12px;font-size:15px;color:var(--ink-3);line-height:1.7;
    padding:11px 13px;border-radius:var(--r1);background:var(--red-soft);
    border:1px solid var(--red-line)}
  .econone{display:block}
  .ehint{margin-top:12px;padding:11px 13px;border-radius:var(--r1);
    border:1px dashed var(--line-3);background:var(--surface-2);
    font-size:15px;color:var(--ink-3);line-height:1.6}
  .ehint b{color:var(--ink-2);font-family:var(--kr);font-weight:700;font-size:14.5px;
    letter-spacing:-.01em;display:block;margin-bottom:4px}
  /* 결론 — 세 단계를 푼 보람 */
  .edone{text-align:center;padding:8px 0 4px}
  .edone h3{font-family:var(--title);font-size:24px;font-weight:900;letter-spacing:-.02em}
  .edone .lead{font-size:15.5px;color:var(--ink-3);margin-top:8px;line-height:1.7}
  .edone .lead b{color:var(--ink-1)}
  .ecomp{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;
    margin-top:20px;text-align:left}
  .ecol{border:1px solid var(--line);border-radius:var(--r1);padding:13px 14px;
    background:var(--surface-2)}
  .ecol.win{border-color:var(--mint);background:rgba(47,224,206,.07)}
  .ecol .cap3{font-family:var(--kr);font-weight:700;font-size:14.5px;color:var(--ink-4);letter-spacing:-.01em;}
  .ecol .big2{font-family:var(--mono);font-size:21px;font-weight:800;margin-top:5px}
  .ecol.win .big2{color:var(--mint)}
  .ecol .sub3{font-size:14.5px;color:var(--ink-4);margin-top:4px;line-height:1.5}
  .earrow{font-family:var(--mono);font-size:19px;color:var(--ink-4);font-weight:800}
  @media(max-width:560px){ .ecomp{grid-template-columns:1fr;gap:9px}
    .earrow{text-align:center;transform:rotate(90deg)} }
  .verdict-line{display:inline-block;font-family:var(--kr);font-size:14.5px;font-weight:700;
    letter-spacing:-.01em;padding:4px 9px;border-radius:6px;margin-right:8px}
  .verdict-line.ok{color:var(--mint);background:rgba(47,224,206,.12);border:1px solid rgba(47,224,206,.4)}
  .verdict-line.no{color:var(--red-2);background:var(--red-soft);border:1px solid var(--red-line)}

  /* ── 노동 사례 판단 (조합형) ── */
  .lcflag{display:inline-block;font-size:14.5px;letter-spacing:.02em;
    padding:3px 9px;border-radius:999px;margin-bottom:10px;
    background:var(--mint-soft);color:var(--mint);border:1px solid var(--mint)}
  .lcflag.realcase{background:var(--mint-soft);color:var(--mint);border-color:var(--mint)}
  .lcflag.praccase{background:var(--surface-2);color:var(--ink-4);border-color:var(--line-2)}
  .lcresult{margin-top:10px;padding:9px 12px;border-radius:var(--r1);
    border:1px solid var(--mint);background:var(--mint-soft);
    font-size:13.4px;color:var(--ink-2)}
  .lcresult b{color:var(--mint)}
  .lcitems{margin:14px 0 0;padding:0;list-style:none;
    border:1px solid var(--line-2);border-radius:var(--r1);overflow:hidden}
  .lcitems li{display:flex;gap:10px;padding:11px 13px;font-size:15.5px;line-height:1.6}
  .lcitems li+li{border-top:1px solid var(--line-2)}
  .lcitems .m{flex:0 0 auto;font-weight:700;color:var(--ink-3)}
  /* 채점 뒤에만 색을 준다 — 풀기 전에 색이 있으면 답이 샌다 */
  .lcitems li[data-s="ok"]{background:var(--mint-soft)}
  .lcitems li[data-s="ok"] .m{color:var(--mint)}
  .lcitems li[data-s="no"] .m{color:var(--accent)}
  .ectab{border-collapse:collapse;margin:12px 0 2px;font-size:16px}
  .ectab th,.ectab td{border:1px solid var(--line-2);padding:7px 14px;text-align:center}
  .ectab thead th{background:var(--surface-2);color:var(--ink-2);font-weight:700}
  .ectab tbody th{background:var(--surface-2);color:var(--ink-2)}
  .lcwhy{margin-top:14px;display:grid;gap:9px}
  .lcrow{display:flex;gap:10px;padding:11px 13px;border-radius:var(--r1);
    border:1px solid var(--line-2);background:var(--surface-2);font-size:13.6px;line-height:1.62}
  .lcrow .m{flex:0 0 auto;font-weight:700}
  .lcrow[data-ok="1"] .m{color:var(--mint)}
  .lcrow[data-ok="0"] .m{color:var(--accent)}
  .lcrow .cite{display:block;margin-top:5px;font-size:14.5px;color:var(--ink-4)}
  .lclaw{margin-top:12px;border:1px dashed var(--line-2);border-radius:var(--r1);
    padding:11px 13px;background:var(--surface-2)}
  .lclaw summary{cursor:pointer;font-size:15px;color:var(--ink-3);font-weight:600}
  .lclaw dl{margin:9px 0 0}
  .lclaw dt{font-size:14.5px;font-weight:700;color:var(--ink-2);margin-top:8px}
  .lclaw dd{margin:3px 0 0;font-size:12.6px;line-height:1.62;color:var(--ink-3)}
  /* ── 해설 ── */
  .why{margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--surface-2);
    border:1px solid var(--line);font-size:15.5px;line-height:1.72;color:var(--ink-2)}
  .why b{color:var(--ink)}
  .why .src{display:block;margin-top:11px;font-family:var(--mono);font-size:14.5px;color:var(--ink-4);font-weight:800}
  .hits{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:14.5px;
    padding:5px 10px;border-radius:6px;border:1px solid var(--red-line);color:var(--red-2);
    background:var(--red-soft);font-weight:800}

  .ev{margin-top:14px;border-left:2px solid var(--line-3);padding:2px 0 2px 14px}
  .ev .evhd{font-family:var(--mono);font-size:14.5px;color:var(--ink-4);letter-spacing:.04em;font-weight:800}
  .ev p{margin-top:6px;font-size:15.5px;line-height:1.7;color:var(--ink-3)}
  .amb{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--red-soft);
    border:1px solid var(--red-line);font-size:15.5px;line-height:1.7;color:var(--ink-2)}
  .amb b{color:var(--red-2)}
  .gnote{margin-top:10px;font-size:14.5px;line-height:1.65;color:var(--ink-4);
    border:1px dashed var(--line-2);border-radius:8px;padding:9px 12px}

  /* ── 문항 이미지 ── */
  /* 제시문 — 기출 크롭(흰 바탕)을 쓰지 않는다. 사이트 색으로 다시 짠다. */
  .passage{position:relative;border-radius:14px;padding:30px 32px 28px;
    background:linear-gradient(180deg,#121A26,#0D131C);
    border:1px solid #223046;border-left:3px solid var(--mint);
    font-size:17.5px;line-height:2.02;color:#DCE7F5;letter-spacing:-.012em;
    word-break:keep-all;text-wrap:pretty}
  .passage:before{content:"\201C";position:absolute;left:18px;top:6px;font-size:52px;
    color:#2A3B54;line-height:1;font-family:Georgia,serif}
  .passage .src{display:block;margin-top:16px;font-family:var(--mono);font-size:14.5px;
    color:var(--ink-4);letter-spacing:.04em;font-weight:800}
  .hintrow{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px;align-items:center}
  .hintrow .lab{font-family:var(--kr);font-weight:700;font-size:14.5px;letter-spacing:-.01em;color:var(--ink-4)}
  .hint{appearance:none;border:1px dashed var(--line-3);background:transparent;cursor:pointer;
    font-family:inherit;font-size:15px;color:var(--ink-3);padding:7px 13px;border-radius:9px;
    transition:.15s}
  .hint:hover{color:var(--ink);border-color:var(--mint)}
  .hint[data-open="1"]{border-style:solid;border-color:var(--mint);color:var(--mint);
    background:rgba(47,224,206,.07);cursor:default}
  .whocard{display:flex;gap:14px;align-items:flex-start;margin-top:4px}
  .whocard .av{flex:0 0 46px;height:46px;border-radius:12px;display:grid;place-items:center;
    font-weight:900;font-size:17px;background:var(--surface-3);color:var(--ink-2)}
  .whocard .tx b{font-size:17px;color:var(--ink)}
  .whocard .tx p{margin:5px 0 0;font-size:16px;color:var(--ink-3);line-height:1.66}
  .vs{display:flex;gap:10px;align-items:stretch;margin-top:14px}
  .vs .col{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:13px 15px;
    background:var(--surface-2)}
  .vs .col.me{border-color:var(--mint)}
  .vs .col h5{margin:0 0 6px;font-size:15.5px;color:var(--ink-2)}
  .vs .col p{margin:0;font-size:15px;color:var(--ink-3);line-height:1.62}

  /* 준킬러 — 판례·사례·자료 */
  .mgrp{font-family:var(--kr);font-weight:700;font-size:14.5px;letter-spacing:-.01em;color:var(--ink-4);
    align-self:center;margin:0 2px 0 8px}
  .mgrp:first-child{margin-left:0}
  .caseflag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);
    font-size:14.5px;padding:5px 11px;border-radius:7px;margin-bottom:12px;letter-spacing:.02em;font-weight:800}
  .caseflag:before{content:"";width:7px;height:7px;border-radius:50%}
  .caseflag.real{background:rgba(47,224,206,.10);color:var(--mint);
    border:1px solid rgba(47,224,206,.32)}
  .caseflag.real:before{background:var(--mint)}
  .caseflag.prac{background:var(--surface-2);color:var(--ink-4);border:1px dashed var(--line-2)}
  .caseflag.prac:before{background:var(--ink-4)}
  .casetitle{font-size:20px;font-weight:800;color:var(--ink);margin:0 0 12px;
    letter-spacing:-.035em}
  .dtable{border:1px solid var(--line);border-radius:var(--r1);overflow:hidden;
    background:var(--surface-2)}
  .dtable table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:16px;font-weight:800}
  .dtable th,.dtable td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:center}
  .dtable th{background:var(--surface-3);color:var(--ink-2);font-weight:700;font-size:16px}
  .dtable td:first-child,.dtable th:first-child{text-align:left;color:var(--ink-3);
    font-family:var(--kr);font-size:16px}
  .dtable tbody tr:last-child td{border-bottom:0}
  .dnote{font-size:14.5px;color:var(--ink-4);padding:10px 14px;margin:0;
    border-top:1px solid var(--line);background:var(--surface)}

  /* 시작 화면 — 들어가자마자 시계가 돌면 안 된다 */
  .startcard{text-align:center;padding:52px 20px 46px}
  .startcard h3{font-size:27px;margin:0 0 10px;letter-spacing:-.045em}
  .startcard p{font-size:16px;color:var(--ink-3);max-width:46ch;margin:0 auto 8px;line-height:1.7}
  .startcard .rule{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 26px}
  .startcard .rule span{font-family:var(--mono);font-size:14.5px;color:var(--ink-3);
    border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:var(--surface-2);font-weight:800}

  .side{display:flex;flex-direction:column;gap:var(--s3)}

  .streak i.ok{background:var(--mint)} .streak i.no{background:var(--red)}
  .pushrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 0;border-bottom:1px solid var(--line)}
  .pushrow:last-child{border-bottom:none}
  .pushrow .tx b{display:block;color:var(--ink);font-size:16px;font-weight:700}

    cursor:pointer;flex:0 0 44px;transition:background .18s;border:none}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
    background:var(--ink-3);transition:.18s}
  .sw[aria-checked="true"]{background:var(--red)}
  .sw[aria-checked="true"]::after{left:23px;background:#fff}
  /* 기출 제시문 상자 — 조문 상자와 달리 줄글로 읽힌다 */
  .quotebox{padding:16px 17px;font-size:16px;line-height:1.85;color:var(--ink);

<script>
(function(){
  var T=TERRA, A=ATLAS;
  T.mountNav("drill.html");
  var P=new URLSearchParams(location.search);
  /* 훈련 목록은 js/drills.js 하나뿐이다 — 홈도 같은 것을 읽는다 */
  var MODES=window.DRILLS;
  var mode=P.get("type")||"climate";
  /* 범위 띠 — 지금 무엇을 겨누고 있는지 늘 보이게 */
  function 범위띠(){
    var host=document.getElementById("scopehost");
    if(!host) return;
    if(!T.scopeOn()){
      host.innerHTML='<div class="scopebar">이번 시험 범위를 정하면 '+
        '<b>그 범위만</b> 훈련해 드려요.<a href="settings.html">범위 정하기 →</a></div>';
      return;
    }
    var 안=MODES.filter(function(m){ return !범위밖(m); }).length;
    host.innerHTML='<div class="scopebar">이번 시험 범위 <b>'+T.scopeName()+'</b>'+
      '<a href="settings.html">범위 고치기 →</a></div>';
  }
  if(!MODES.some(function(m){return m.id===mode;})) mode="climate";
  var cur=null, session=[], answered=false, pset=null, qset=null, rset=null;

  /* 시험 범위 밖 훈련은 흐리게 — 감추지는 않는다.
     학생이 "이건 이번 시험이 아니구나" 를 알고 스스로 고르게 한다. */
  function 범위밖(m){
    if(m.id==="thinker") return !(window.THINKER&&THINKER.items||[]).some(사상가범위);   // 범위 안 사상가 제시문이 하나도 없으면 범위 밖
    if(m.mid && T.scopeOn() && T.inScopeMid) return !T.inScopeMid(m.mid);   /* 노동 훈련은 인권 단원(F) 안이지만 노동권(F5)이 범위일 때만 */
    return m.root && !T.inScope(m.root);
  }
  function 단추(m){
    return '<button data-m="'+m.id+'" class="mode'+(범위밖(m)?" out":"")+'" '+
      'aria-selected="'+(m.id===mode)+'">'+m.name+'</button>';
  }
  /* 범위를 정했으면 그 안의 훈련부터 연다 */
  (function(){
    if(!T.scopeOn()) return;
    if(P.get("type")) return;                 // 주소로 콕 집어 왔으면 그대로
    var 안=MODES.filter(function(m){ return !범위밖(m); });
    if(안.length) mode=안[0].id;
  })();

  (function(){ var g=(T.state().student||{}).grade||"고1"; if(g!=="고1"||!T.scopeOn()) return;
    var ph=document.querySelector(".phead"); if(!ph) return;
    ph.insertAdjacentHTML("afterend",'<a class="naeshin" href="naeshin.html"><b>내신 Killer Drill</b><span>헷갈리는 문항만 집중 연습할 수 있어요.</span><i>→</i></a>');
  })();
  /* ★ 내신 대비(고1)에서는 킬러·준킬러로 가르지 않는다 — 수능 말이라 어색하다(2026-09-19 대표님) */
  var _고1=((T.state().student||{}).grade||"고1")==="고1";
  document.getElementById("modes").innerHTML= _고1 ? MODES.map(단추).join("") :
    '<span class="mgrp">킬러</span>'+
    MODES.filter(function(m){ return !m.tier; }).map(단추).join("")+
    '<span class="mgrp">준킬러</span>'+
    MODES.filter(function(m){ return m.tier; }).map(단추).join("");
  document.querySelectorAll("[data-m]").forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll("[data-m]").forEach(function(x){x.setAttribute("aria-selected","false");});
      b.setAttribute("aria-selected","true"); mode=b.dataset.m; session=[];
      set=null; eset=null; cset=null; lset=null; dset=null; pset=null; qset=null; rset=null;
      stopTimer(); clearIntro(); head(); showStart(); side();
    };
  });
  function def(){ return MODES.filter(function(m){return m.id===mode;})[0]; }
  function head(){
    var m=def();
    document.getElementById("kdesc").textContent=m.desc;   /* 단원 알파벳은 학생에게 안 보인다(2026-09-16) */
    document.getElementById("basis").innerHTML="<b>"+m.name+"</b><br>"+m.basis;
  }
  function grade(ok){
    answered=true; session.push(ok); T.drill(mode,ok); side();
    /* ★ 기후 말고 다른 훈련은 세트 경계가 없다(사례 3단계짜리). 열 문항마다 결산을 띄운다 */
    if(mode!=="climate" && window.COACH && session.length && session.length%10===0){
      var 열=session.slice(-10), 맞=열.filter(Boolean).length;
      COACH.wrap({got:맞, total:10, kind:"drill"});
    }
  }
  function side(){
    var n=session.length, ok=session.filter(Boolean).length;
    document.getElementById("s-n").textContent=n;
    document.getElementById("s-pct").textContent=n?Math.round(ok/n*100)+"%":"—";
    var cells=session.slice(-15).map(function(v){return '<i class="'+(v?"ok":"no")+'"></i>';});
    while(cells.length<15) cells.push('<i></i>');
    document.getElementById("s-bar").innerHTML=cells.join("");
  }
  function nextBtn(){
    return '<div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">'+
      '<button class="btn" id="next">다음 문제</button>'+
      '<a class="btn ghost" href="index.html">학습 홈</a></div>';
  }
  function bindNext(){ var b=document.getElementById("next"); if(b) b.onclick=next; }
  function leafHits(code){ var l=T.BY[code]; return l?l.n:0; }
  function kc(k){ return k; }   // 기후 기호는 데이터가 그대로 쓴다(AH 포함)
  /* 재화·나라 이름이 매번 새로 뽑히니 조사도 받침을 보고 골라야 한다.
     "옷를" "쌀는" 같은 것이 화면에 그대로 나갔다(2026-08-30). */
  function bat(w){
    w=String(w||""); var c=w.charCodeAt(w.length-1);
    return (c>=0xAC00&&c<=0xD7A3) ? ((c-0xAC00)%28)!==0
         : /[013678lmnr]$/i.test(w);          // 숫자·영문도 소리대로
  }
  function esc(t){ return String(t==null?"":t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;"); }
  function EL(w){ return w+(bat(w)?"을":"를"); }
  function NEUN(w){ return w+(bat(w)?"은":"는"); }
  function IGA(w){ return w+(bat(w)?"이":"가"); }
  function GWA(w){ return w+(bat(w)?"과":"와"); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;} return a; }

  /* ══════════════ 1. 기후 판정 ══════════════ */
  /* 10문항이 한 세트다. 한 문항에 10초, 넘기면 오답 처리.
     오답 선지는 atlas 의 혼동표 안에서만 뽑는다 — 엉뚱한 기후를 섞으면 훈련이 안 된다. */
  var SET_N=5, SET_SEC=10, SET_NOW=5;   // SET_NOW 는 지금 도는 세트의 길이(재도전 때 줄어든다)
  var set=null, timer=null;

  var byName={}; A.cities.forEach(function(c){ byName[c.n]=c; });
  function newSet(){
    // 한 기출 문항에 함께 나왔던 도시들을 축으로 삼는다. 서로 견주라고 낸 짝이기 때문이다.
    var qs=(A.qsets||[]).filter(function(q){ return q.cities.length>=2; });
    var anchor=qs.length? pick(qs) : null;
    var pool=[], seen={};
    if(anchor) shuffle(anchor.cities).forEach(function(n){
      if(byName[n] && !seen[n] && pool.length<SET_N){ seen[n]=1; pool.push(byName[n]); }
    });
    // 모자란 자리는 많이 나온 도시로 채운다.
    // ★ 2026-09 모평 반영 — 마이너 기후형은 덜 낸다.
    //   도시를 주고 기후를 찾는 것은 여전히 유효하지만,
    //   Cw·Dw 처럼 잘게 나눈 기후의 꼼꼼한 구분은 크게 요구되지 않는다
    //   (통합사회 교과를 반영한 것으로 보인다 — 대표님 판단 2026-09-02).
    //   기후형을 빼지는 않는다. 나올 때를 대비는 하되 무게만 줄인다.
    var 기후무게 = window.CLIMATE_WEIGHT || {};
    /* ★ 개수(정수)로 담으면 **1보다 작은 무게가 전부 1로 뭉개진다.**
         round(1 × 0.4) = 0 → max(1,0) = 1 이 되어 Cw(0.4)가 Af(1)와 같아졌다
         (실측 둘 다 10.1%). 무게를 준 뜻이 사라지고, 대신 도시 수가 많은
         기후형이 더 나오는 엉뚱한 편향이 생겼다.
       그래서 **실수 무게 그대로** 누적 추첨한다 — 0.4 는 0.4 만큼만 뽑힌다. */
    function 도시무게(c){
      var w = 1 + Math.min(3, c.hit || 0);        // 틀린 적이 있으면 더 자주
      var k = (기후무게[c.k] == null ? 1 : 기후무게[c.k]);
      return Math.max(0.02, w * k);               // 0 이 되면 영영 안 나온다
    }
    var 남은 = A.cities.filter(function(c){ return !seen[c.n]; });
    while(pool.length < SET_N && 남은.length){
      var 합 = 0, i2;
      for(i2=0;i2<남은.length;i2++) 합 += 도시무게(남은[i2]);
      var r = Math.random() * 합, acc = 0, 고른 = 남은.length - 1;
      for(i2=0;i2<남은.length;i2++){
        acc += 도시무게(남은[i2]);
        if(acc >= r){ 고른 = i2; break; }
      }
      var c2 = 남은.splice(고른, 1)[0];
      seen[c2.n] = 1; pool.push(c2);
    }
    set={i:0,items:shuffle(pool),marks:[],miss:[],anchor:anchor};
    SET_NOW=SET_N;
  }
  function setHead(){
    var sb=document.getElementById("setbar");
    var cur_set = mode==="climate" ? set
                : mode==="econ" ? eset
                : mode==="consti" ? cset
                : mode==="labor" ? lset
                : mode==="demo" ? dset : null;
    if(!cur_set){ sb.innerHTML=""; sb.className=""; return; }
    sb.className="setbar";
    var n = mode==="climate" ? SET_NOW : cur_set.steps.length;
    var pips=[];
    for(var k=0;k<n;k++){
      var c=k<cur_set.marks.length ? (cur_set.marks[k]?"ok":"no") : (k===cur_set.i?"now":"");
      pips.push('<i class="'+c+'"></i>');
    }
    var got=cur_set.marks.filter(Boolean).length;
    sb.innerHTML='<div class="pips">'+pips.join("")+'</div>'+
      '<div class="setscore"><b id="sc">'+got+'</b> / '+n+' 맞음</div>'+
      (mode==="climate"
        ? '<div class="timer" id="tm"><span class="tbar"><i id="tf" style="width:100%"></i></span>'+

  var zoomRaf=null, cdT=[];

  function setVB(box){
    var svg=document.getElementById("wmap");
    if(!svg) return;
    svg.setAttribute("viewBox", box.join(" "));
    var k=WORLD[2]/box[2], big=narrow()?1.5:1;   // 폰에서는 점과 이름을 한 급 키운다
    svg.querySelectorAll("circle[data-r]").forEach(function(el){
      el.setAttribute("r", (+el.dataset.r)/k*big);
    });
    svg.querySelectorAll("text[data-fs]").forEach(function(el){
      el.setAttribute("font-size", (+el.dataset.fs)/k*big);
      el.setAttribute("stroke-width", 3.5/k*big);
      if(el.dataset.cy!==undefined)
        el.setAttribute("y", (+el.dataset.cy)+(+el.dataset.dy)/k);
    });
  }
  function zoomTo(box, ms, done){
    var from=WORLD.slice(), t0=null;
    function frame(t){
      if(t0===null) t0=t;
      var p=Math.min(1,(t-t0)/ms), e=1-Math.pow(1-p,5);   // 빠르게 들어와 천천히 앉는다
      setVB(from.map(function(v,i){ return v+(box[i]-v)*e; }));
      if(p<1) zoomRaf=requestAnimationFrame(frame);
      else { zoomRaf=null; if(done) done(); }
    }
    zoomRaf=requestAnimationFrame(frame);
  }

              '" dur="2.2s" repeatCount="indefinite"/>'+

  function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }

        tm=document.getElementById("tm");

  function timeUp(){
    if(answered||cur.kind!=="climate") return;
    var op=document.querySelector(".opts"); if(op) op.classList.remove("wait");

  function makeClimate(){
    var t=set.items[set.i];
    var conf=(A.confuse&&A.confuse[t.k])||Object.keys(A.koppen);
    var wrong=shuffle(conf.filter(function(k){return k!==t.k;})).slice(0,4);
    var rest=shuffle(Object.keys(A.koppen).filter(function(k){
      return k!==t.k && wrong.indexOf(k)<0; }));
    while(wrong.length<4 && rest.length) wrong.push(rest.shift());
    var opts=shuffle([t.k].concat(wrong));
    return {kind:"climate", city:t, options:opts, answer:opts.indexOf(t.k)};
  }
  var WORLD=[-189,-84,378,146];
  /* 폰은 화면이 세로로 길다. 지도 칸도 세로로 잡아야 도시가 커 보인다.
     그리고 대륙 전체를 다 담을 필요가 없으니 더 바짝 당긴다. */
  function narrow(){ return window.innerWidth<=760; }
  function mapRatio(){ return narrow() ? 1.12 : WORLD[2]/WORLD[3]; }
  function boxOf(rg){
    var r=(A.regions||{})[rg];
    if(!r) return WORLD.slice();
    var pad=narrow()?2:6, x0=r[0]-pad, x1=r[1]+pad, y0=-(r[3]+pad), y1=-(r[2]-pad);
    var w=x1-x0, h=y1-y0, R=mapRatio();
    if(narrow()){ w*=.62; h*=.62;                    // 폰에서는 한 번 더 당긴다
      x0=(r[0]+r[1])/2-w/2; y0=-((r[2]+r[3])/2)-h/2; }
    if(w/h < R){ var nw=h*R; x0-=(nw-w)/2; w=nw; }      // 지도 칸 비율에 맞춰 넓힌다
    else { var nh=w/R; y0-=(nh-h)/2; h=nh; }
    return [x0,y0,w,h];
  }
  function boxAt(city){
    var b=boxOf(city.rg||"");
    return [city.x-b[2]/2, -city.y-b[3]/2, b[2], b[3]];
  }

    var paths=A.paths.map(function(d){return '<path class="land" d="'+d+'"/>';}).join("");

    var dots=A.cities.map(function(c,i){
      var isT=(target && c.n===target.n);
      var kin=false;   // 같은 기후형 도시 이름은 띄우지 않는다 — 화면만 어지럽다
      var col=reveal? A.koppen[c.k].color : (isT? "var(--mint)" : "var(--citydim)");
      var r=(isT?2.8:(reveal?1.8:1.5))/k;
      var lab="";
      if(isT&&reveal){
        var up=true;
        var fs=(isT?6.6:4.6)/k;
        lab='<text class="clab" data-fs="'+(isT?6.6:4.6)+'" data-cy="'+(-c.y)+
            '" data-dy="'+(up?-4.6:7.6)+'" x="'+c.x+'" y="'+(-c.y+(up?-4.6:7.6)/k)+
            '" text-anchor="middle" font-size="'+fs+'" stroke-width="'+(3.5/k)+
            '" fill="'+(isT?"#EAF6F8":A.koppen[c.k].color)+'">'+c.n+'</text>';
      }
      return '<g><circle data-r="'+(isT?2.8:(reveal?1.8:1.5))+'" cx="'+c.x+'" cy="'+(-c.y)+
        '" r="'+r+'" fill="'+col+'"'+(isT?' filter="url(#glow)"':'')+'/>'+
        (isT&&reveal?'<circle class="pulse" cx="'+c.x+'" cy="'+(-c.y)+'" r="'+(5/k)+
          '"><animate attributeName="r" values="'+(3.4/k)+';'+(9/k)+';'+(3.4/k)+
          '" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".85;0;.85" dur="2.2s" repeatCount="indefinite"/></circle>':'')+
        lab+'</g>';
    }).join("");
    var vb=(box||WORLD);
    return '<div class="mapwrap"><svg id="wmap" viewBox="'+vb.join(" ")+'" preserveAspectRatio="xMidYMid meet">'+
      '<defs><filter id="glow" x="-300%" y="-300%" width="700%" height="700%">'+
      '<feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/>'+

      '<rect class="mapbg" x="-189" y="-84" width="378" height="146"/>'+paths+dots+'</svg></div>';

  /* 해설 한 줄 — 기후형마다 다른 말을 한다. 같은 문장을 다섯 번 보면 안 읽는다. */
  var HINT={

  /* ══════════════ 2. 경제 분석 ══════════════ */
  /* 생산가능곡선은 통합사회 범위가 아니다(개념트리 H2.3 기출 0건). 표와 기회비용까지만 쓴다.
     한 자료를 놓고 판단을 단계로 쪼개 묻는다 — 마지막 답만 맞히는 것은 훈련이 아니다. */
  var FRAC=[[1,2],[1,3],[2,3],[3,2],[2,1],[3,1],[1,4],[3,4],[4,3],[5,2]];
  var eset=null;

  function makeEcon(){
    var C=pick([["갑국","을국"],["A국","B국"]]);
    var G=pick([["쌀","옷"],["자동차","밀"],["반도체","의류"],["커피","휴대전화"]]);
    var ax,ay,bx,by,oa,ob,aHasX,g=0;
    /* 완전특화가 두 재화를 다 늘리는 숫자만 쓴다 —
       그러지 않으면 결론 화면이 "무역하면 한 재화는 줄어든다" 를 보여 준다. */
    do{
      var fa=pick(FRAC), fb=pick(FRAC);
      var ka=pick([10,15,20]), kb=pick([10,15,20]);
      ax=fa[1]*ka; ay=fa[0]*ka; bx=fb[1]*kb; by=fb[0]*kb;
      oa=ay/ax; ob=by/bx; aHasX=(oa<ob);
      g++;
      if(oa===ob) continue;                       // 기회비용이 같으면 무역할 까닭이 없다
      var xMax=aHasX?ax:bx, yMax=aHasX?by:ay;
      if(xMax>(ax+bx)/2 && yMax>(ay+by)/2) break; // 둘 다 늘어나는 조합
    } while(g<400);
    return {kind:"econ", C:C, G:G, t:{ax:ax,ay:ay,bx:bx,by:by}, oa:oa, ob:ob,
            lo:Math.min(oa,ob), hi:Math.max(oa,ob), aHasX:aHasX};
  }
  function r2(v){ return Math.round(v*100)/100; }

  function makeEconSet(){
    var q=makeEcon(), t=q.t, X=q.G[0], Y=q.G[1], A=q.C[0], B=q.C[1];
    var st=[];

    /* 1) 기회비용 — 식을 보여 주면 고르기가 된다. 값만 놓는다. */
    st.push({k:"oc", show:"table",
      q:IGA(A)+' '+X+' 1개를 더 만들려면 '+EL(Y)+' 몇 개 포기해야 할까요?',
      o:[r2(q.oa)+'개', r2(1/q.oa)+'개'], a:0,
      hint:EL(X)+' 다 만들면 '+NEUN(Y)+' 0개, '+EL(Y)+' 다 만들면 '+NEUN(X)+' 0개예요.',
      why:'포기하는 것이 <b>기회비용</b>이에요. '+A+'은 '+X+' '+t.ax+'개 아니면 '+
          Y+' '+t.ay+'개를 만들 수 있으니, '+X+' 1개의 값은 '+
          '<b>'+t.ay+' ÷ '+t.ax+' = '+r2(q.oa)+'</b>개예요.'});

    /* 2) 비교우위 — 두 나라 기회비용을 나란히 놓고 고른다 */
    st.push({k:"comp", show:"line",
      q:'그럼 '+NEUN(X)+' 어느 나라가 맡는 게 나을까요?',
      o:[A,B], a:q.aHasX?0:1,
      hint:'포기하는 게 적은 쪽이 더 싸게 만드는 거예요.',
      why:X+' 1개를 만들려고 포기하는 양이 '+A+' <b>'+r2(q.oa)+'</b>, '+
          B+' <b>'+r2(q.ob)+'</b>예요. <b>적게 포기하는 쪽</b>이 '+
          '<b>비교우위</b>가 있고, 그 나라가 '+X+'를 맡습니다. '+
          (t.ax>t.bx&&!q.aHasX ? '더 많이 만드는 나라가 맡는 게 아니라는 점이 핵심이에요 — '+
             A+'이 '+X+'를 더 많이 만들지만('+t.ax+'개 대 '+t.bx+'개), 맡는 쪽은 '+B+'예요. '
           : '')});

    /* 3) 교역조건 — 한 번만 묻는다. 범위 안이면 이득, 밖이면 손해. */
    var lo=q.lo, hi=q.hi;
    var inb=Math.random()<0.5;
    var val = inb ? r2(lo+(hi-lo)*(0.3+Math.random()*0.4))
                  : r2(Math.random()<0.5 ? Math.max(0.05,lo*0.6) : hi*1.5);
    st.push({k:"term", show:"both", term:val,
      q:X+' 1개를 '+Y+' <b>'+val+'</b>개와 바꾸자고 합니다. 두 나라 다 이득일까요?',
      o:["둘 다 이득이에요","한쪽은 손해라 안 해요"], a:inb?0:1,
      hint:'각 나라가 혼자 만들 때 드는 값과 견줘 보세요.',
      why:'바꾸는 값이 두 나라의 기회비용 <b>'+r2(lo)+' ~ '+r2(hi)+'</b> 사이에 있어야 '+
          '둘 다 이득이에요. '+NEUN(val)+' '+
          (inb?'그 안에 있으니 서로 남는 장사예요.'
              :'그 밖이라, 그 값이면 한 나라는 차라리 혼자 만드는 게 나아요.')});
    return {q:q, steps:st, i:0, marks:[]};
  }

  function lineSvg(q,term,showTerm){
    var W=440,H=118,PL=30,PR=30, y=64;
    var max=q.hi*1.7, sx=function(v){return PL+Math.min(v,max)/max*(W-PL-PR);};
    var loX=sx(q.lo), hiX=sx(q.hi);
    var band='<rect x="'+loX+'" y="'+(y-13)+'" width="'+(hiX-loX)+'" height="26" rx="4" '+
      'fill="rgba(47,224,206,.13)" stroke="rgba(47,224,206,.45)"/>';
    function mark(v,col,lab,below){
      var x=sx(v);
      return '<line x1="'+x+'" y1="'+(y-14)+'" x2="'+x+'" y2="'+(y+14)+'" stroke="'+col+'" stroke-width="2.4"/>'+
        '<text x="'+x+'" y="'+(below?y+31:y-21)+'" text-anchor="middle" fill="'+col+
        '" font-size="12" font-family="IBM Plex Mono">'+lab+'</text>';
    }
    var now='';
    if(showTerm && term!=null){
      var x=sx(term), inb=(term>q.lo&&term<q.hi);
      now='<polygon points="'+x+','+(y-18)+' '+(x-7)+','+(y-30)+' '+(x+7)+','+(y-30)+'" fill="'+
        (inb?"var(--mint)":"#E5484D")+'"/>'+
        '<text x="'+x+'" y="'+(y-34)+'" text-anchor="middle" fill="'+(inb?"var(--mint)":"#FF6369")+
        '" font-size="11.5" font-family="IBM Plex Mono">'+r2(term)+'</text>';
    }
    return '<div class="ppc"><svg viewBox="0 0 '+W+' '+H+'">'+
      '<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="var(--axis)" stroke-width="1.5"/>'+
      band+now+mark(q.oa,"#E5484D",q.C[0]+" "+r2(q.oa),true)+
      mark(q.ob,"#8A929C",q.C[1]+" "+r2(q.ob),false)+
      '<text x="'+PL+'" y="'+(H-6)+'" fill="var(--axis-ink)" font-size="11" font-family="IBM Plex Mono">'+
      q.G[0]+' 1개의 기회비용 ('+q.G[1]+') →</text></svg></div>';
  }
  function gainSvg(q,term){
    var xc=q.aHasX? q.t.ax : q.t.bx, yc=q.aHasX? q.t.by : q.t.ay;
    var xn=q.aHasX? q.C[0] : q.C[1], yn=q.aHasX? q.C[1] : q.C[0];
    var xSelf=q.aHasX? q.t.ay : q.t.by, ySelf=q.aHasX? q.t.bx : q.t.ax;
    var gx=xc*term-xSelf, gy=yc/term-ySelf;
    var px=gx/xSelf*100, py=gy/ySelf*100;
    function row(nm,v,pc,unit){
      var w=Math.min(100,Math.abs(pc)), pos=v>0.0001;
      return '<div class="grow"><span class="n">'+nm+'</span>'+
        '<span class="bwrap"><i class="'+(pos?"up":"dn")+'" style="width:'+w+'%"></i></span>'+
        '<span class="v '+(pos?"up":"dn")+'">'+(pos?"+":"")+Math.round(pc)+'%</span>'+
        '<span class="u">'+(pos?"+":"")+r2(v)+' '+unit+'</span></div>';
    }
    return '<div class="gains"><div class="gcap">자급할 때와 견주어 얼마나 더 갖는가</div>'+
      row(xn,gx,px,q.G[1])+row(yn,gy,py,q.G[0])+'</div>';
  }
  function tableHtml(q){
    var t=q.t;
    return '<table class="dtable"><tr><th></th><th>'+q.G[0]+'</th><th>'+q.G[1]+'</th></tr>'+
      '<tr><td class="lab">'+q.C[0]+'</td><td>'+t.ax+'</td><td>'+t.ay+'</td></tr>'+
      '<tr><td class="lab">'+q.C[1]+'</td><td>'+t.bx+'</td><td>'+t.by+'</td></tr></table>'+
      '<p class="tnote">두 나라가 <b>똑같은 양의 생산요소</b>를 한 재화에만 모두 '+
      '투입했을 때의 최대 생산량입니다.</p>';
  }
  function renderEcon(){
    var q=eset.q, st=eset.steps[eset.i];
    document.getElementById("qtext").innerHTML=st.q;
    document.getElementById("qmeta").textContent=(eset.i+1)+" / "+eset.steps.length;
    var side='';
    if(st.show==="line") side=lineSvg(q,null,false);
    else if(st.show==="both") side=lineSvg(q,st.term,true)+
      '<div style="margin-top:16px">'+gainSvg(q,st.term)+'</div>';
    var left='<div>'+tableHtml(q)+
      (st.hint?'<div class="ehint"><b>이렇게 생각해요</b>'+st.hint+'</div>':'')+'</div>';
    /* 그림이 없는 단계는 한 칸으로 쓴다 — 빈 상자가 선지를 화면 밖으로 밀어낸다 */
    return (side ? '<div class="econgrid">'+left+'<div id="side">'+side+'</div></div>'
                 : '<div class="econone">'+left+'<div id="side" hidden></div></div>')+
      '<div class="opts c2" style="margin-top:20px">'+st.o.map(function(x,i){
        return '<button class="opt" data-v="'+i+'">'+x+'</button>';
      }).join("")+'</div><div id="v"></div>';
  }
  function judgeEcon(btn){
    if(answered) return;
    var st=eset.steps[eset.i], i=+btn.dataset.v, ok=(i===st.a);
    document.querySelectorAll(".opts.c2 .opt").forEach(function(b,k){
      b.disabled=true;
      if(k===st.a) b.dataset.s="ok"; else if(b===btn) b.dataset.s="no";
    });
    grade(ok);
    eset.marks.push(ok);
    setHead();
    // 답을 연 뒤에는 근거를 그림으로도 보여 준다
    var q=eset.q, sd=document.getElementById("side");
    if(sd && st.show!=="both") sd.innerHTML=lineSvg(q,st.term,!!st.term);
    var last=(eset.i+1>=eset.steps.length);
    document.getElementById("v").innerHTML=
      '<div class="gorow"><button class="btn big" id="next">'+
      (last?"그래서 어떻게 되나 보기":"다음 단계")+'</button>'+
      '<span class="gohint">'+(eset.i+1)+' / '+eset.steps.length+' 단계</span></div>'+
      '<div class="why"><b>'+(ok?"맞았습니다.":"틀렸습니다.")+'</b> '+st.why+
      '<span class="src">숫자는 매번 새로 생성, 개념트리 H4.1 절대우위와 비교우위</span></div>';
    document.getElementById("next").onclick=function(){
      if(last){ econEnd(); return; }
      eset.i++;
      next();
    };
  }

  /* 세 단계를 다 푼 뒤 — 그래서 무역을 하면 어떻게 되는가.
     혼자 만들 때와 나눠 만들고 바꿀 때를 견줘 **늘어난 양**을 숫자로 보여 준다.
     이 화면이 이 단원의 결론이다. */
  function econEnd(){
    var q=eset.q, t=q.t, X=q.G[0], Y=q.G[1], A=q.C[0], B=q.C[1];
    /* X 를 맡는 나라와 Y 를 맡는 나라 */
    var xN=q.aHasX?A:B, yN=q.aHasX?B:A;
    var xMax=q.aHasX?t.ax:t.bx, yMax=q.aHasX?t.by:t.ay;
    /* 각자 반씩 만들면(자급) 얼마나 나오나 — 견줄 기준 */
    function r1(v){ return Math.round(v*10)/10; }
    var selfX=r1((t.ax+t.bx)/2), selfY=r1((t.ay+t.by)/2);
    var gainX=r1(xMax-selfX), gainY=r1(yMax-selfY);
    var okm=eset.marks.filter(Boolean).length;

    document.getElementById("qtext").textContent="세 번 다 물었습니다";
    document.getElementById("qmeta").textContent="결론";
    var st0=document.getElementById("stage");
    st0.innerHTML=
      '<div class="edone"><h3>' +
      (gainX>0&&gainY>0 ? '무역을 하면 둘 다 늘어납니다' : '나눠 맡는 편이 낫습니다') + '</h3>'+
      '<p class="lead">'+IGA(xN)+' <b>'+X+'</b>에, '+IGA(yN)+' <b>'+Y+'</b>에 특화해서 '+
      '서로 바꾸면, 각자 절반씩 만들 때보다 '+
      '<b>'+X+' '+(gainX>0?'+'+gainX:gainX)+'개</b>, '+
      '<b>'+Y+' '+(gainY>0?'+'+gainY:gainY)+'개</b>가 더 생깁니다.</p>'+
      '<div class="ecomp">'+
        '<div class="ecol"><span class="cap3">각자 절반씩 만들면</span>'+
        '<div class="big2">'+X+' '+selfX+', '+Y+' '+selfY+'</div>'+
        '<div class="sub3">두 나라가 각각 두 가지를 다 만드는 경우</div></div>'+
        '<div class="earrow">→</div>'+
        '<div class="ecol win"><span class="cap3">나눠 맡고 바꾸면</span>'+
        '<div class="big2">'+X+' '+xMax+', '+Y+' '+yMax+'</div>'+
        '<div class="sub3">'+NEUN(xN)+' '+X+'만, '+NEUN(yN)+' '+Y+'만 만든 뒤 교환</div></div>'+
      '</div>'+
      '<p class="lead" style="margin-top:18px;font-size:13.5px">'+
      '이게 <b>비교우위에 따른 국제 분업</b>이에요. 더 잘 만드는 나라가 다 만드는 게 아니라, '+
      '<b>포기하는 게 적은 쪽</b>이 맡을 때 전체가 커집니다.</p>'+
      '<div class="gorow" style="justify-content:center;margin-top:22px">'+
      '<button class="btn big" id="enew">새 자료로 한 번 더</button>'+
      '<a class="btn ghost" href="study.html?leaf=H4.1">이 단원 문제 풀기</a></div>'+
      '<p class="gohint" style="margin-top:12px">세 단계 가운데 '+okm+'개 맞혔어요</p>'+
      '</div>';
    document.getElementById("enew").onclick=function(){ eset=null; next(); };
  }

  /* ══════════════ 권력분립 ══════════════
     조문을 화면에 원문 그대로 띄운다. 답의 근거가 화면에 있어야
     학생이 외우지 않고 **읽어서** 푼다. */
  var PW = window.POWER || {cases:[]};
  var pseen = [];
  function makePowerSet(){
    var pool=PW.cases.filter(function(c){ return pseen.indexOf(c.id)<0; });
    if(!pool.length){ pseen=[]; pool=PW.cases; }
    var c=pick(pool); pseen.push(c.id);
    return {c:c, i:0, marks:[]};
  }
  function 조문블록(제목, 본문){
    return '<div class="arti"><div class="ah">근거 <b>'+esc(제목)+'</b>'+
      '<span style="margin-left:auto">국가법령정보센터 원문</span></div>'+
      '<pre>'+esc(본문)+'</pre></div>';
  }
  function renderPower(){
    var S2=pset, c=S2.c, st=c.steps[S2.i];
    document.getElementById("qtext").innerHTML=st.q;
    document.getElementById("qmeta").textContent="단계 "+(S2.i+1)+" / "+c.steps.length;
    return '<h4 class="casetitle">'+esc(c.title)+'</h4>'+
      '<div class="sitbox">'+c.sit+'</div>'+
      조문블록(c.art, c.text)+
      (st.text2 ? 조문블록(st.art2, st.text2) : '')+
      '<div class="opts c2" style="margin-top:18px">'+st.o.map(function(o,i){
        return '<button class="opt" data-v="'+i+'">'+o+'</button>';
      }).join("")+'</div><div id="v"></div>';
  }
  function judgePower(btn){
    if(answered) return;
    var c=pset.c, st=c.steps[pset.i], i=+btn.dataset.v, ok=(i===st.a);
    document.querySelectorAll(".opts.c2 .opt").forEach(function(b,k){
      b.disabled=true;
      if(k===st.a) b.dataset.s="ok"; else if(b===btn) b.dataset.s="no";
    });
    grade(ok); pset.marks.push(ok); setHead();
    var last=(pset.i+1>=c.steps.length);
    document.getElementById("v").innerHTML=
      '<div class="gorow"><button class="btn big" id="next">'+
      (last?"새 사례로":"다음 단계")+'</button>'+
      '<span class="gohint">'+(pset.i+1)+' / '+c.steps.length+' 단계</span></div>'+
      '<div class="why"><b>'+(ok?"맞았습니다.":"틀렸습니다.")+'</b> '+st.why+
      (last&&c.trap?'<div class="trapline">'+c.trap+'</div>':'')+
      '<span class="src">'+esc(c.art)+' 원문, 국가법령정보센터</span></div>';
    document.getElementById("next").onclick=function(){
      pset.i++;
      if(pset.i>=c.steps.length) pset=null;
      next();
    };
  }

  /* ══════════════ 기본권 판단 ══════════════
     상황을 주고 네 걸음으로 판단하게 한다.
     ★ 실재 헌재 결정인지 연습 사례인지를 늘 밝힌다 —
       지어낸 사례를 판례처럼 내면 학생이 틀린 것을 외운다. */
  var RG = window.RIGHTS || {cases:[], kinds:[], steps4:[], law:{}};
  var rseen = [];
  function makeRightsSet(){
    var pool=RG.cases.filter(function(c){ return rseen.indexOf(c.id)<0; });
    if(!pool.length){ rseen=[]; pool=RG.cases; }
    if(!pool.length) return null;
    var c=pick(pool); rseen.push(c.id);
    /* 걸리는 단계가 없는 사례(다 넘는 것)도 있다 — 그것도 물어야 한다 */
    return {c:c, i:0, marks:[]};
  }
  function 권리단계(c){
    var st=[];
    /* ① 어떤 기본권인가 */
    var 갈래=[c.rightKind].concat(c.rightAlt||[]);
    st.push({
      q:"이 사례에서 문제 되는 것은 어떤 기본권입니까?",
      o:shuffle(갈래.slice()),
      ans:c.rightKind,
      why:"<b>"+esc(c.right)+"</b> — "+c.rightWhy});
    /* ② 제한할 수 있는 목적인가 */
    st.push({
      q:"제37조 제2항이 든 목적(국가안전보장·질서유지·공공복리)에 드는 제한입니까?",
      o:["그렇다 — 목적 자체는 정당하다", "아니다 — 목적부터 헌법이 허용하지 않는다"],
      ans:(c.purposeOk ? "그렇다 — 목적 자체는 정당하다"
                       : "아니다 — 목적부터 헌법이 허용하지 않는다"),
      why:c.purposeWhy});
    /* ③ 어느 단계에서 걸리는가 */
    var 단계이름=(RG.steps4||[]).map(function(x){ return x.k; });
    st.push({
      q:"과잉금지 네 단계 가운데 <b>어디에서 걸립니까?</b>",
      o:단계이름.concat(["걸리지 않는다 — 네 단계를 다 넘는다"]),
      ans:(c.failAt || "걸리지 않는다 — 네 단계를 다 넘는다"),
      why:c.failWhy});
    /* ④ 결론 */
    st.push({
      q:"그래서 이 제한은 기본권을 침해합니까?",
      o:["침해한다", "침해하지 않는다"],
      ans:(c.failAt ? "침해한다" : "침해하지 않는다"),
      why:(c.failAt
        ? "네 단계 가운데 <b>"+esc(c.failAt)+"</b>에서 걸렸으므로 침해입니다. "+

  /* ══════════════ 제시문 사례 훈련 (평화론 · 정의관) ══════════════
     자료 꼴이 서로 같다 — {quote, who, src, steps[{q,o,a,why,src}], trap}.
     그래서 렌더러 하나로 둘 다 돌린다. mode 로 자료만 갈아 끼운다.

     권력분립과 다른 점은 근거가 **법 조문이 아니라 기출 제시문**이라는 것뿐이다.
     제시문을 원문 그대로 띄우는 이유는 같다 — 학생이 읽어서 풀게 하려고. */
  var CASEDATA = {

  var qseen = {peace:[], justice:[]};
  function makeCaseSet(kind){
    var all=(CASEDATA[kind]||{cases:[]}).cases;
    var seen=qseen[kind]||(qseen[kind]=[]);
    var pool=all.filter(function(c){ return seen.indexOf(c.id)<0; });
    if(!pool.length){ seen.length=0; pool=all; }
    if(!pool.length) return null;
    var c=pick(pool); seen.push(c.id);
    return {kind:kind, c:c, i:0, marks:[]};
  }

  /* ══════════════ 3. 사상가 ══════════════ */
  /* 기출 크롭 이미지를 쓰지 않는다. 흰 바탕이라 화면과 겉돌고, 원 문항의 발문과
     선지 ①~⑤ 가 통째로 들어가 답이 새어 나갔다(2026-08-30). 문항마스터에 있는
     제시문 텍스트만 싣고, 선지는 리프 이름이 아니라 사람 이름으로 낸다. */
  var TK = window.THINKER || {people:{},rival:{},items:[]};
  var ORI={W:"서양",E:"동양"};
  var tseen=[];
  /* ★ 사상가도 시험 범위로 거른다 — 에피쿠로스(B 행복)가 2학기 중간(F·G·I) 범위 학생에게 나갔다(2026-09-18 대표님 폰).
     사상가 축(K) 리프는 실제로 배우는 단원으로 바꿔 본다: K1→B, K2→C, K3→G, K4→F4.2(시민 불복종), K5→I, K6→H */
  function 사상가범위(x){
    if(!T.scopeOn || !T.scopeOn()) return true;
    var l=String(x.leaf||"");
    if(!/^K/.test(l)) return T.inScopeLeaf ? T.inScopeLeaf(l) : true;
    var m={K1:"B",K2:"C",K3:"G",K4:"F4.2",K5:"I",K6:"H"}[l.slice(0,2)];
    if(!m) return false;
    return m.length===1 ? T.inScope(m) : T.inScopeLeaf(m);
  }
  function makeThinker(){
    var 안=TK.items.filter(사상가범위); if(!안.length) 안=TK.items;
    var pool=안.filter(function(x){ return tseen.indexOf(x.id)<0; });
    if(!pool.length){ tseen=[]; pool=안; }
    var it=pick(pool); tseen.push(it.id);
    /* 오답 후보도 범위 안 사람으로 — 「칸트 vs 벤담」처럼 이번 범위에 없는 이름은 안 낸다 */
    var 안이름={}; 안.forEach(function(x){ 안이름[x.w]=1; });
    var rv=(TK.rival[it.w]||[]).filter(function(w){ return w!==it.w && 안이름[w]; });
    if(!rv.length) rv=Object.keys(안이름).filter(function(w){ return w!==it.w; });
    if(!rv.length) rv=(TK.rival[it.w]||[]).filter(function(w){ return w!==it.w; });
    var other=rv.length?pick(rv):Object.keys(TK.people).filter(function(w){return w!==it.w;})[0];
    var opts=shuffle([it.w, other]);
    return {kind:"thinker", it:it, right:it.w, other:other,
            options:opts, answer:opts.indexOf(it.w), hints:0};
  }
  function renderThinker(t){

  /* ══════════════ 4. 헌법재판 (준킬러) ══════════════ */
  /* 사실관계를 주고 기본권 → 심판 종류 → 목적 → 침해의 최소성 → 결론을
     차례로 묻는다. 마지막 답만 맞히는 것은 훈련이 아니다. */
  var SK=window.SUBK||{consti:{real:[],drill:[]},labor:{law:{}}};
  var cset=null;
  function makeConstiSet(){
    var pool=(SK.consti.real||[]).concat(SK.consti.drill||[]);
    var c=pick(pool), real=(SK.consti.real||[]).indexOf(c)>=0;
    var st=[];
    /* ★ 통합사회는 기본권을 자유·평등·참정·청구·사회 5유형으로만 배운다 (대표님 2026-09-06).
       「집회의 자유 vs 결사의 자유」 처럼 세부 이름을 고르게 하면 정치와법 수준이 된다.
       ⇒ 1단계는 5유형을 고르고, 세부 이름은 설명에만 둔다. */
    var 유형5=["자유권","평등권","참정권","청구권","사회권"];
    var 답유형=c.rightKind||"자유권";
    st.push({q:"이 사건에서 문제 된 기본권은 어느 유형인가요? (자유·평등·참정·청구·사회)", show:"facts",
      o:shuffle([답유형].concat(shuffle(유형5.filter(function(k){return k!==답유형;})).slice(0,3))),
      a:답유형,
      why:"<b>"+c.right+"</b> → <b>"+답유형+"</b>. "+(c.rightWhy||"")});
    st.push({q:"이 사건은 어떤 심판인가요?", show:"facts",
      o:shuffle([c.kind, c.kind==="위헌법률심판"?"헌법소원심판":"위헌법률심판"]), a:c.kind,
      why:c.kindWhy});
    st.push({q:"이 제한의 목적은 정당한가요?", show:"facts",
      o:["정당하다","정당하지 않다"], a:c.purposeOk?"정당하다":"정당하지 않다",
      why:c.purpose});
    st.push({q:"덜 제한하는 수단이 있었나요? (침해의 최소성)", show:"facts",
      o:["있다 — 최소성에 걸린다","없다 — 최소성을 넘는다"],
      a:c.lessOk?"있다 — 최소성에 걸린다":"없다 — 최소성을 넘는다", why:c.less});
    st.push({q:"결론은?", show:"facts",
      o:shuffle([c.result].concat(c.resultAlt.slice(0,2))), a:c.result, why:c.resultWhy});
    return {c:c, real:real, steps:st, i:0, marks:[]};

  /* ══════════════ 5. 노동 사례 (준킬러) ══════════════ */
  /* 만 18세를 넘는지가 갈림길이다. 넘으면 일반 규정, 못 넘으면 연소자 특칙. */
  var NAMES=["민준","서연","지호","하윤","도윤","수아","시우","예린"];
  var JOBS=["편의점","카페","분식집","마트 진열","서점","패스트푸드점"];
  var lset=null;
  /* ── 노동 사례 판단 (킬러 · 조합형) ─────────────────
     상황을 주고 ㄱㄴㄷㄹ 가운데 옳은 것 **둘**을 고르게 한다.
     조문 하나만 알면 못 푼다 — 사업장 규모·나이·시간을 함께 봐야 갈린다.
     자료와 선지 생성은 js/laborcase.js 가 한다(검산기가 그 파일을 본다). */
  var lcset=null;
  function makeLcSet(){
    var L=lcSrc();
    if(!L) return null;
    /* 경제는 사례를 **매번 만든다** — 숫자가 달라지므로 외울 수 없다 */
    if(L.make){
      var c2=L.make(Math.random);
      if(!c2) return null;
      var b2=L.build(c2, Math.random);
      return b2 ? {c:c2, items:b2.items, choices:b2.choices,
                   a:b2.answer, done:false} : null;
    }
    if(!L.cases||!L.cases.length) return null;
    /* 안 본 사례를 먼저 낸다 — 같은 사례가 연달아 나오면 외운다 */
    var 본것=(T.state().lcSeen||{});
    var 안본=L.cases.filter(function(c){ return !본것[c.id]; });
    var c=pick(안본.length?안본:L.cases);
    var b=L.build(c, Math.random);
    if(!b) return null;
    /* build 가 **섞은 차례**의 항목을 돌려준다 — 그것으로 그려야 정답과 맞는다 */
    return {c:c, items:b.items, choices:b.choices, a:b.answer, done:false};
  }
  /* 노동 사례와 경제 사례는 **같은 지면**을 쓴다 — 따로 그리면 같은 꼴이 다르게 보인다.
     자료원(src)만 바꿔 넣는다. */
  function lcSrc(){
    if(mode==="econcase") return window.ECONCASE;
    if(mode==="consticase") return window.CONSTICASE;

  /* ══════════════ 6. 인구 부양비 (준킬러) ══════════════ */
  /* 세 지역 자료를 놓고 정의에서 계산으로 간다. 총부양비가 같아도
     노령화지수는 갈린다 — 그 자리가 함정이다. */
  var dset=null;
  function r1(v){ return Math.round(v*10)/10; }
  function makeDemoSet(){
    function region(nm){
      var y=pick([8,10,12,14,16,18]), o=pick([9,12,15,20,25,30]);
      var p=100-y-o;
      return {n:nm, y:y, p:p, o:o,
              yd:r1(y/p*100), od:r1(o/p*100), td:r1((y+o)/p*100), ai:r1(o/y*100)};
    }
    var R=[region("가"),region("나"),region("다")];
    var st=[];
    st.push({k:"table", q:"생산 연령 인구는 몇 세부터 몇 세까지입니까?",
      o:["15~64세","20~64세"], a:0,
      why:"유소년 <b>0~14세</b>, 생산 연령 <b>15~64세</b>, 노년 <b>65세 이상</b>입니다. "+
          "부양비는 모두 <b>생산 연령 인구를 분모</b>로 놓습니다."});
    var t=pick(R);
    st.push({k:"table", q:t.n+" 지역의 유소년 부양비는?",
      o:[t.yd+"", r1(t.y/(t.y+t.o)*100)+""], a:0,
      why:"유소년 부양비 = 유소년 ÷ <b>생산 연령</b> × 100 = "+t.y+" ÷ "+t.p+" × 100 = <b>"+
          t.yd+"</b>. 전체 인구로 나누면 안 됩니다 — 그게 가장 흔한 실수입니다."});
    var t2=pick(R);
    st.push({k:"table", q:t2.n+" 지역의 노령화지수는?",
      o:[t2.ai+"", t2.od+""], a:0,
      why:"노령화지수 = 노년 ÷ <b>유소년</b> × 100 = "+t2.o+" ÷ "+t2.y+" × 100 = <b>"+t2.ai+"</b>. "+
          "노년 부양비("+t2.od+")는 분모가 생산 연령이라 다릅니다. "+
          "<b>노령화지수만 분모가 유소년</b>입니다."});
    var top=R.slice().sort(function(a,b){ return b.td-a.td; })[0];
    var topAi=R.slice().sort(function(a,b){ return b.ai-a.ai; })[0];
    st.push({k:"table", q:"총부양비가 가장 높은 지역은?",
      o:shuffle(R.map(function(x){ return x.n; })), a:top.n, byName:true,
      why:"총부양비 = (유소년 + 노년) ÷ 생산 연령 × 100. "+
          R.map(function(x){ return x.n+" "+x.td; }).join(", ")+
          " 이므로 <b>"+top.n+"</b> 입니다."});
    st.push({k:"table", q:"노령화지수가 가장 높은 지역은?",
      o:shuffle(R.map(function(x){ return x.n; })), a:topAi.n, byName:true,
      why:R.map(function(x){ return x.n+" "+x.ai; }).join(", ")+
          " 이므로 <b>"+topAi.n+"</b> 입니다."+
          (top.n!==topAi.n
            ? " 총부양비가 가장 높은 곳("+top.n+")과 <b>다릅니다</b> — 분모가 다르기 때문입니다."
            : " 이번에는 총부양비가 가장 높은 곳과 같습니다. 늘 같지는 않습니다.")});
    st.push({k:"table", q:"세 지역 가운데 고령화가 가장 앞선 곳은 어디로 읽습니까?",
      o:["노령화지수가 가장 높은 곳","유소년 부양비가 가장 높은 곳"], a:0,
      why:"고령화의 정도는 <b>노년 대비 유소년</b>으로 봅니다. "+
          "유소년 부양비가 높다는 것은 오히려 <b>어린 인구가 많다</b>는 뜻입니다."});
    return {R:R, steps:st, i:0, marks:[]};
  }

  function next(){

      if(!rset) rset=makeRightsSet();

    else if(mode==="peace"||mode==="justice"){
      if(!qset||qset.kind!==mode) qset=makeCaseSet(mode);
      if(!qset){ st.innerHTML='<p class="note">자료를 아직 못 불러왔습니다.</p>'; return; }
      cur={kind:"case"}; st.innerHTML=renderCase(); setHead();
    }
    else if(mode==="power"){
      if(!pset) pset=makePowerSet();
      cur={kind:"power"}; st.innerHTML=renderPower(); setHead();
    }
    else if(mode==="climate"){
      if(!set||set.i>=SET_NOW) newSet();
      cur=makeClimate(); st.innerHTML=renderClimate(cur); setHead();
    }
    else if(mode==="econ"){
      if(!eset) eset=makeEconSet();
      cur={kind:"econ"}; st.innerHTML=renderEcon(); setHead();
    }
    else if(mode==="thinker"){ cur=makeThinker(); st.innerHTML=renderThinker(cur); bindHints(cur); }
    else if(mode==="consti"){
      if(!cset) cset=makeConstiSet();
      cur={kind:"consti"}; st.innerHTML=renderConsti(); setHead();
    }
    else if(mode==="labor"){
      if(!lset) lset=makeLaborSet();
      cur={kind:"labor"}; st.innerHTML=renderLabor(); setHead();
    }
    else if(mode==="laborcase"){
      if(!lcset) lcset=makeLcSet();
      cur={kind:"laborcase"}; st.innerHTML=renderLc(); setHead();
    }
    else if(mode==="econcase"){
      if(!lcset) lcset=makeLcSet();
      cur={kind:"econcase"}; st.innerHTML=renderLc(); setHead();
    }
    else if(mode==="consticase"){
      if(!lcset) lcset=makeLcSet();
      cur={kind:"consticase"}; st.innerHTML=renderLc(); setHead();
    }
    else if(mode==="demo"){
      if(!dset) dset=makeDemoSet();
      cur={kind:"demo"}; st.innerHTML=renderDemo(); setHead();
    }
    st.querySelectorAll(".opt").forEach(function(b){
      b.onclick=function(){
        if(answered) return;
        if(cur.kind==="rights") judgeRights(b);
        else if(cur.kind==="case") judgeCase(b);
        else if(cur.kind==="power") judgePower(b);
        else if(cur.kind==="climate") judgeClimate(cur,b);
        else if(cur.kind==="econ") judgeEcon(b);
        else if(cur.kind==="consti") judgeConsti(b);
        else if(cur.kind==="labor") judgeLabor(b);
        else if(cur.kind==="laborcase") judgeLc(b);
        else if(cur.kind==="econcase") judgeLc(b);
        else if(cur.kind==="consticase") judgeLc(b);
        else if(cur.kind==="demo") judgeDemo(b);
        else judgeThinker(cur,b);
      };
    });
    if(mode==="climate") intro(cur);
    var card=document.querySelector(".stage");
    if(card){
      var top=card.getBoundingClientRect().top+window.scrollY-76;
      if(Math.abs(window.scrollY-top)>40) window.scrollTo({top:top,behavior:"smooth"});
    }
  }

  /* 시작 화면 — 들어가자마자 타이머가 돌면 학생이 화면을 읽을 틈이 없다.
     누른 뒤에 3초를 세고, 그 3초 동안 지도가 대륙으로 들어간다. */
  var RULE={
    climate:["5문항 한 세트","한 문항 10초","틀린 것만 다시 가능"],
    econ:["한 자료, 여러 단계","시간 제한 없음","단계마다 둘 중 하나"],
    thinker:["제시문만 보고 판별","둘 중 하나","힌트 3개"],
    consti:["실재 판례 + 연습 사례","5단계 판단","단계마다 둘 중 하나"],
    labor:["사례는 매번 새로","만 18세가 갈림길","조문은 원문 그대로"],
    laborcase:["실제 있을 법한 상황","ㄱㄴㄷㄹ 중 둘이 옳다","근거 조문 원문 제공"],
    econcase:["숫자는 매번 새로","ㄱㄴㄷㄹ 중 둘이 옳다","다섯 갈래가 번갈아"],
    consticase:["연습 사례, 조문은 원문","ㄱㄴㄷㄹ 중 둘이 옳다","헌법 조문 원문 제공"],
    demo:["세 지역 자료","부양비·노령화지수","단계마다 계산"]
  };
  function showStart(){
    stopTimer(); clearIntro();
    var m=def();
    var sb=document.getElementById("setbar"); sb.innerHTML=""; sb.className="";
    document.getElementById("qtext").textContent=m.name;
    document.getElementById("qmeta").textContent=String(m.area||"").replace(/^[A-Z] /,"").replace(/ · [A-Z] /g,", ");
    document.getElementById("stage").innerHTML=
      '<div class="startcard"><h3>'+m.name+'</h3><p>'+m.desc+'</p>'+
      '<div class="rule">'+(RULE[mode]||[]).map(function(x){
        return '<span>'+x+'</span>'; }).join("")+'</div>'+
      '<button class="btn big" id="go">시작</button></div>';
    document.getElementById("go").onclick=function(){
      if(mode==="climate"){ newSet(); }
      else if(mode==="econ"){ eset=null; }
      else if(mode==="consti"){ cset=null; }
      else if(mode==="labor"){ lset=null; }
      else if(mode==="laborcase"){ lcset=null; }
      else if(mode==="econcase"){ lcset=null; }
      else if(mode==="consticase"){ lcset=null; }
      else if(mode==="demo"){ dset=null; }
      next();
    };
  }

  /* 매일 푸시 — 지금은 신청 상태만 저장한다(실제 발송은 백엔드 몫) */
  function renderPush(){
    var S=T.state();
    if(!S.push) S.push={climate:true,econ:false,thinker:false};
    var N=window.TERRA_NOTIFY;
    var host=document.getElementById("push");
    if(!host) return;                       /* 알림 설정은 설정 화면에만(2026-09-17) */
    if(!N){ host.innerHTML='<p style="font-size:12.5px;color:var(--ink-4)">'+
      '알림을 쓸 수 없는 브라우저예요.</p>'; return; }
    var st=N.status();
    host.innerHTML=
      '<div class="pushrow"><span class="tx"><b>매일 알려 주기</b>'+
      '<span>그날 할 것을 짧게 알려 드려요</span></span>'+
      '<button class="sw" role="switch" id="ntog" aria-checked="'+(st.on&&st.granted)+'"></button></div>'+
      '<div class="pushrow"><span class="tx"><b>알림 시각</b>'+
      '<span>학교 가기 전이나 자기 전이 좋아요</span></span>'+
      '<input type="time" id="ntime" value="'+st.at+'" style="font-family:var(--mono);'+
      'font-size:14px;padding:7px 10px;border-radius:9px;border:1px solid var(--line-2);'+
      'background:var(--surface);color:var(--ink)"></div>'+
      '<p style="font-size:11.5px;color:var(--ink-4);margin-top:12px;line-height:1.65">'+
      st.say+'</p>'+
      (st.granted?'<button class="btn ghost" id="ntest" style="margin-top:10px;'+
        'font-size:12.5px;padding:7px 12px">지금 한 번 보내 보기</button>':'');
    document.getElementById("ntog").onclick=function(){
      var b=this;
      if(b.getAttribute("aria-checked")==="true"){ N.disable(); renderPush(); return; }
      N.enable().then(function(r){
        if(r!=="granted") alert("브라우저에서 알림을 막고 있어요.\n"+
          "주소창 왼쪽 자물쇠를 눌러 알림을 허용해 주세요.");
        renderPush();
      });
    };
    document.getElementById("ntime").onchange=function(){ N.setAt(this.value); renderPush(); };
    var tb=document.getElementById("ntest");
    if(tb) tb.onclick=function(){ N.fire(true); };
  }

  head(); showStart(); side(); renderPush(); 범위띠();
})();
</script>
<script>
/* ★ 개발 중(localhost)에는 서비스워커를 **등록하지 않고, 이미 등록된 것은 푼다.**
   js·css 를 캐시 먼저 주는 전략이라 고치고 열면 늘 한 판 늦는다 —
   실제로 확장팩 화면이 열 개 전부 "준비 중" 으로 보여 한참 헤맸다(2026-09-03).
   개발서버는 no-store 인데 서비스워커는 서버 헤더와 무관하게 제 캐시를 준다.
   배포 주소에서는 그대로 등록한다 — 오프라인은 실사용에서 값어치가 있다. */
(function () {
  if (!("serviceWorker" in navigator)) return;
  var 개발 = location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if (개발) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { r.unregister(); });
    }).catch(function () {});
    if (window.caches) caches.keys().then(function (ks) {
      ks.forEach(function (k) { caches.delete(k); });
    }).catch(function () {});
    return;
  }
  addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
})();
</script>
</body>
