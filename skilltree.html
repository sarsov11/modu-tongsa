<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>개념트리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&family=Gaegu:wght@300;400;700&family=Gowun+Dodum&family=Jua&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FAF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="모두의 통사">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/favicon.png">
<link rel="stylesheet" href="css/base.css?v=838e6ebd">
<link rel="stylesheet" href="css/coach.css?v=fec8b445">
<script>try{var _s=localStorage.getItem("terra.skin");if(_s===null||_s==="")_s="paper";if(_s==="night")_s="";if(_s==="diary")_s="jelly";if(_s)document.documentElement.dataset.skin=_s;}catch(e){}</script>
<style>
  .wrapx{max-width:1360px;margin:0 auto;padding:0 var(--s3) var(--s6)}
  /* ── 범위 띠 — 지도가 줄어든 까닭을 적는다 ── */
  #scopeband{display:flex;align-items:center;gap:13px;flex-wrap:wrap;
    margin:var(--s2) 0 0;padding:12px 16px;border-radius:var(--r2);
    border:1px solid var(--line-2);background:var(--surface);font-size:16px}
  #scopeband .ic{flex:0 0 auto;width:24px;height:24px;border-radius:7px;display:grid;
    place-items:center;font-size:14.5px;font-weight:800;background:var(--red);color:#fff}
  #scopeband .tx{flex:1;min-width:220px;color:var(--ink-2);line-height:1.6}
  #scopeband .tx b{color:var(--ink)}
  #scopeband .tx em{font-style:normal;color:var(--ink-4);font-size:14.5px}
  #scopeband .act{display:flex;gap:8px;flex:0 0 auto}
  #scopeband .act a,#scopeband .act button{font-family:inherit;font-size:15px;
    font-weight:700;padding:8px 13px;border-radius:9px;border:1px solid var(--line-2);
    background:var(--surface-2);color:var(--ink-2);cursor:pointer;white-space:nowrap}
  #scopeband .act a:hover,#scopeband .act button:hover{color:var(--ink);
    border-color:var(--line-3)}
  h1,h2,.pk-title{font-family:var(--title);font-weight:var(--tw);letter-spacing:var(--tls)}

  /* ── 머리 — 층을 옮기면 제목이 따라 움직인다 ── */
  .phead h1{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .crumb{display:inline-flex;align-items:baseline;gap:14px}
  .crumb .up{appearance:none;border:0;background:transparent;cursor:pointer;
    font:inherit;color:var(--ink-4);padding:0;transition:color .18s;
    font-family:var(--title);font-weight:var(--tw);letter-spacing:var(--tls)}
  .crumb .up:hover{color:var(--ink-2)}
  .crumb .sep{color:var(--line-3);font-size:.6em;transform:translateY(-.12em)}
  .swapin{animation:swapin .5s cubic-bezier(.32,.72,0,1) both}
  @keyframes swapin{from{opacity:0;transform:translateY(.28em) scale(.94)}
                    to{opacity:1;transform:none}}
  .phead .sub{max-width:66ch;font-size:16px;font-weight:600;color:var(--ink-2);
    letter-spacing:-.02em;line-height:1.6}

  /* ── 갈래 탭 ── */
  .segbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .seg{appearance:none;border:1px solid var(--line);background:var(--surface);cursor:pointer;
    font-family:inherit;font-size:16px;font-weight:600;color:var(--ink-3);
    padding:10px 18px;border-radius:var(--r1);transition:.18s;display:flex;
    align-items:center;gap:9px}
  .seg:hover{color:var(--ink);border-color:var(--line-3)}
  .seg .dot{width:9px;height:9px;border-radius:50%;transition:transform .2s}
  .seg[aria-selected="true"]{color:#06110F;font-weight:700}
  .seg[aria-selected="true"] .dot{transform:scale(0)}
  .seg.back{font-weight:700;color:var(--ink-2);border-color:var(--line-2);
    background:var(--surface-2)}
  .seg.back:hover{color:var(--ink);border-color:var(--line-3);
    transform:translateX(-2px)}
  .seg.back[hidden]{display:none}
  .crumb .up{color:var(--ink-3);text-decoration:underline;
    text-decoration-color:var(--line-3);text-underline-offset:5px}
  .crumb .up:hover{color:var(--ink);text-decoration-color:var(--red)}

  /* ── 아트보드 ── */
  .board{position:relative;border-radius:var(--r3);overflow:hidden;border:1px solid var(--line);
    background:var(--stage);margin-top:var(--s3);box-shadow:var(--shadow)}
  .board .plate{display:flex;align-items:baseline;justify-content:space-between;gap:18px;
    flex-wrap:wrap;padding:22px 28px 10px}
  .board .plate h2{font-size:27px;color:var(--stage-ink)}
  .board .plate .sub{font-size:15.5px;color:var(--stage-ink-2);font-family:var(--kr);
    font-weight:600;letter-spacing:-.02em}
  .board .stage{position:relative;background:
    radial-gradient(ellipse 80% 60% at 50% 46%,var(--neb-1),transparent 66%),
    radial-gradient(ellipse 50% 40% at 18% 88%,var(--neb-2),transparent 70%),
    var(--stage)}
  /* 종이 스킨에서는 무대에도 무늬가 이어져야 한 장으로 보인다 */
  :root[data-skin="note"] .board .stage{
    background-image:
      repeating-linear-gradient(0deg,transparent 0 21px,rgba(120,110,85,.11) 21px 22px),
      repeating-linear-gradient(90deg,transparent 0 21px,rgba(120,110,85,.08) 21px 22px),
      radial-gradient(ellipse 80% 60% at 50% 46%,var(--neb-1),transparent 66%);
    background-color:var(--stage)}
  .board svg{display:block;width:100%;height:auto}
  .board .stage{min-height:420px}
  .layer{transform-box:view-box;will-change:transform,opacity}

  .node{cursor:pointer}
  .node:focus-visible{outline:none}
  /* 원이 커지는 것은 무리 전체가 함께 움직여야 눈에 든다 — 자바스크립트로 클래스를 건다 */
  .nb{transform-box:fill-box;transform-origin:center;
    transition:transform .26s cubic-bezier(.2,1.25,.35,1)}
  .node.hot .nb{transform:scale(1.16)}
  .node.hot circle:last-of-type{filter:brightness(1.25)}
  .lbl{transition:opacity .2s,transform .26s cubic-bezier(.2,1.25,.35,1)}
  .lbl.hot{transform-box:fill-box;transform-origin:center;transform:scale(1.06)}
  svg.dim .node:not(.hot){opacity:.3;transition:opacity .2s}
  svg.dim .lbl:not(.hot){opacity:.28}


  /* ── 강의 플레이어 ── */
  .vwrap{position:fixed;inset:0;z-index:120;display:none}
  .vwrap.on{display:block}
  .vbg{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(3px)}
  .vbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
        width:min(1080px,92vw);background:var(--bg-1,#12141a);border-radius:18px;
        border:1px solid var(--line,#2a2e38);overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5)}
  .vhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line,#2a2e38)}
  .vhead h3{margin:0;font-size:17px;flex:1}
  .vhead .vsub{font-size:14.5px;color:var(--ink-4,#8b93a5)}
  .vhead button{background:none;border:0;color:var(--ink-3,#aab2c2);font-size:22px;cursor:pointer;line-height:1}
  .vbox video{display:block;width:100%;background:#000;aspect-ratio:16/9}
.vbox iframe.yt{display:block;width:100%;border:0;background:#000;aspect-ratio:16/9}
  .vmiss{padding:34px 26px;font-size:16px;line-height:1.85;color:var(--ink-2,#c9d0dd)}
  .vmiss b{color:var(--ink-1,#eef1f6)}
  .vmiss code{background:rgba(255,255,255,.07);padding:2px 7px;border-radius:5px;font-size:15px}
  .btn.play{background:var(--accent,#e6203a);color:#fff;border-color:transparent;font-weight:700}
  /* ── 강의 시트 ── */
  .sheet{position:fixed;inset:0;z-index:90;display:flex;align-items:center;
    justify-content:center;padding:24px}
  .sheet[hidden]{display:none}
  .sheetbg{position:absolute;inset:0;background:rgba(4,6,10,.62);backdrop-filter:blur(6px);
    opacity:0;transition:opacity .34s}
  .sheet.on .sheetbg{opacity:1}
  .sheetcard{position:relative;width:min(780px,100%);max-height:86vh;overflow:auto;
    background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r3);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.8);
    opacity:0;transform:scale(.9) translateY(14px);
    transition:opacity .3s ease,transform .44s cubic-bezier(.32,.72,0,1)}
  .sheet.on .sheetcard{opacity:1;transform:none}
  .sh-top{position:sticky;top:0;z-index:2;background:var(--surface);
    padding:22px 26px 16px;border-bottom:1px solid var(--line)}
  .sh-eyebrow{font-family:var(--kr);font-weight:700;font-size:14.5px;letter-spacing:-.01em;color:var(--ink-4)}
  .sh-top h3{font-size:26px;margin:8px 0 0;letter-spacing:-.04em;
    font-family:var(--title);font-weight:var(--tw)}
  .sh-x{position:absolute;right:18px;top:18px;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-3);
    cursor:pointer;font-size:16px;line-height:1;transition:.16s}
  .sh-x:hover{color:var(--ink);border-color:var(--line-3)}
  .sh-facts{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
  .fact{font-family:var(--mono);font-size:14.5px;color:var(--ink-3);
    border:1px solid var(--line);background:var(--surface-2);
    padding:5px 10px;border-radius:7px;font-weight:800}
  .fact b{color:var(--ink);font-weight:600}
  .sh-body{padding:18px 26px 26px}
  .sh-note{font-size:14.5px;color:var(--ink-4);line-height:1.72;margin-bottom:16px;
    border-left:2px solid var(--line-2);padding-left:12px}
  .sh-note b{color:var(--ink-3)}

  .lec{display:flex;gap:14px;align-items:flex-start;padding:15px 16px;border-radius:var(--r1);
    border:1px solid var(--line);background:var(--surface-2);margin-bottom:9px;transition:.16s}
  .lec:hover{border-color:var(--line-3)}
  .lec .no{flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;
    font-family:var(--mono);font-size:16px;font-weight:800;background:var(--surface-3);
    color:var(--ink-3)}
  .lec .mid{flex:1;min-width:0}
  .lec h4{font-size:16px;margin:0 0 6px;letter-spacing:-.03em;color:var(--ink);
    font-family:var(--kr);font-weight:700}
  .lec .meta{font-family:var(--mono);font-size:14.5px;color:var(--ink-4);
    display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-weight:800}
  .lec .meta .g{color:var(--deep)}
  .lec .meta .g.core{color:var(--core)}
  .lec .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .lec .chips span{font-size:14.5px;padding:3px 9px;border-radius:6px;
    background:var(--surface-3);color:var(--ink-3)}
  .lec .go{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .lec .go .btn{font-size:15px;padding:9px 14px;white-space:nowrap}
  .lec .bar{height:4px;border-radius:2px;background:var(--line);margin-top:10px;overflow:hidden}
  .lec .bar i{display:block;height:100%;border-radius:2px}
  .btn.soon{opacity:.45;pointer-events:none}
  @media(max-width:640px){
    .lec{flex-wrap:wrap}.lec .go{flex-direction:row;width:100%}
    .lec .go .btn{flex:1;justify-content:center}
  }

  /* ── 범례 ── */
  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:15px;
    color:var(--ink-4);margin-top:16px;font-family:var(--mono);font-weight:800}
  .legend .k{display:flex;align-items:center;gap:7px}
  .legend .dot{width:13px;height:13px;border-radius:50%;display:inline-block}
  .legend .sz{display:flex;align-items:center;gap:6px;padding-left:16px;
    border-left:1px solid var(--line-2)}
  .legend .sz i{display:inline-block;border-radius:50%;background:var(--ink-4);opacity:.55}
  .note{font-size:15px;color:var(--ink-4);border-left:2px solid var(--line-2);
    padding-left:14px;margin-top:14px;line-height:1.75;max-width:92ch}
  .note b{color:var(--ink-3)}

  /* ── 폰용 목록 ── */
  .treelist{display:none}
  .grp{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;
    margin-bottom:12px;background:var(--surface)}
  .grp .gh{display:flex;align-items:center;gap:10px;padding:14px 16px;
    border-bottom:1px solid var(--line);background:var(--surface-2)}
  .grp .gh .cd{font-family:var(--mono);font-size:15px;font-weight:800}
  .grp .gh h3{font-size:16px;flex:1;min-width:0}
  .grp .gh .n{font-family:var(--mono);font-size:14.5px;color:var(--ink-4);font-weight:800}
  .mrow{display:flex;align-items:center;gap:11px;padding:13px 16px;cursor:pointer;
    border-bottom:1px solid var(--line);background:var(--surface)}
  .mrow:last-child{border-bottom:0}
  .mrow .bul{width:13px;height:13px;border-radius:50%;flex:0 0 13px}
  .mrow .nm{flex:1;min-width:0;font-size:16px;font-weight:700;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .pc{font-family:var(--mono);font-size:14.5px;color:var(--ink-4);flex:0 0 auto;font-weight:800}
  @media(max-width:760px){
    /* ★ 폰에서는 개념트리가 맨 위(2026-09-18 대표님 "저 아래 처박혀 있다") — 머리 다음에 바로 그림, 띠·오늘 카드는 그 아래 */
    .wrapx{display:flex;flex-direction:column}
    .phead{order:0} .board{order:1} .treelist{order:2} #scopeband{order:3;margin-top:var(--s3)} #deltahost{order:4} #pickhost{order:5} .legend{order:6} .note{order:7}
    .phead .sub{display:none}
    .board .stage{min-height:0}
    .treelist{display:block;margin-top:var(--s3)}
    .board .plate{padding:16px 18px 8px}
    .board .plate h2{font-size:22px}
    .sheet{padding:0;align-items:flex-end}
    .sheetcard{width:100%;max-height:90vh;border-radius:var(--r3) var(--r3) 0 0;
      transform:translateY(40px)}
  }

  /* ── hover 카드 ── */
  .peek{position:fixed;z-index:70;width:352px;pointer-events:none;
    border-radius:var(--r2);padding:17px 19px 15px;
    background:var(--stage-2);border:1px solid var(--stage-line);
    box-shadow:0 24px 60px -22px rgba(0,0,0,.55);
    opacity:0;transform:translateY(6px) scale(.98);
    transition:opacity .16s ease,transform .16s cubic-bezier(.2,1.2,.4,1)}
  .peek.on{opacity:1;transform:none}
  .peek[hidden]{display:none}
  .pk-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pk-eyebrow{font-family:var(--kr);font-weight:700;font-size:14.5px;letter-spacing:-.01em;
    color:var(--stage-ink-2)}
  .pk-tier{font-family:var(--kr);font-size:14.5px;font-weight:700;color:var(--stage);
    padding:3px 10px;border-radius:6px;letter-spacing:-.01em;}
  .pk-title{font-size:21px;color:var(--stage-ink);margin:9px 0 0;line-height:1.3}
  .pk-q{font-size:15.5px;line-height:1.6;color:var(--stage-ink-2);margin-top:9px;
    padding-left:11px;border-left:2px solid var(--stage-line)}
  .pk-sep{height:1px;background:var(--stage-line);margin:13px 0 11px}
  .pk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pk-stats b{display:block;font-family:var(--mono);font-size:21px;font-weight:800;
    color:var(--stage-ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pk-stats span{font-size:14.5px;color:var(--stage-ink-2)}
  .pk-bars{margin-top:12px;display:flex;align-items:flex-end;gap:4px;height:44px}
  .pk-bars .sp{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-end;height:100%}
  .pk-bars .sp i{display:block;width:100%;border-radius:3px 3px 1px 1px}
  .pk-cap{font-size:14.5px;color:var(--stage-ink-2);margin-top:8px;font-family:var(--mono);font-weight:800}
  .pk-keys{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
  .pk-key{font-size:14.5px;padding:4px 10px;border-radius:7px;background:var(--surface-2);
    color:var(--ink-2);border:1px solid var(--line-2)}
  .pk-foot{margin-top:11px;font-size:14.5px;color:var(--stage-ink-2);font-family:var(--mono);font-weight:800}

  /* ── 오늘 추천 띠 ── */
  .pick{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r2);
    padding:14px 16px;margin-bottom:var(--s3);position:relative;overflow:hidden}
  .pick::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
  .pick .dot2{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    background:var(--red);color:#fff;font-family:var(--mono);font-size:15px;font-weight:800}
  .pick .tx2{min-width:0}
  .pick .lbl{font-size:14.5px;font-family:var(--mono);color:var(--red-2);letter-spacing:.03em;font-weight:800}
  .pick h3{font-size:16.5px;font-weight:800;letter-spacing:-.015em;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pick p{font-size:14.5px;color:var(--ink-3);margin-top:3px;line-height:1.5}
  .pick .act{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
  .pick .act .btn{white-space:nowrap}
  .pick .skip{font-size:14.5px;color:var(--ink-4);background:none;border:0;cursor:pointer;
    text-decoration:underline;text-underline-offset:2px}
  .pick.done{opacity:.72}
  .pick.done::before{background:var(--mint)}
  .pick.done .dot2{background:var(--mint);color:#04150E}
  @media(max-width:560px){
    .pick{grid-template-columns:auto 1fr;gap:11px;padding:13px 14px}
    .pick .act{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
  }
  .lec.today{border-color:var(--red);background:color-mix(in srgb,var(--red) 7%,transparent)}
  .lec.today .no{background:var(--red);color:#fff}
  .todaytag{display:inline-block;font-size:14.5px;font-family:var(--mono);color:#fff;
    background:var(--red);border-radius:5px;padding:2px 6px;margin-left:7px;vertical-align:2px;font-weight:800}
  .mrow.out{opacity:.42}
  .mrow.out .nm::after{content:" (이번 범위 밖)";font-size:12.5px;color:var(--ink-3);font-weight:600}
</style>
</head>
<body>
<div class="wrapx">
  <div class="phead">
    <div>
      <span class="kicker"><i></i>개념트리</span>
      <h1><span class="crumb" id="crumb"></span></h1>
      <p class="sub" id="lede"></p>
    </div>
    <div class="pheadact">
      <div class="segbar"><button class="seg back" id="backbtn" hidden>← 전체</button>
        <span id="segs" style="display:contents"></span></div>
    </div>
  </div>

  <div id="scopeband" hidden></div>
  <div id="deltahost"></div>
  <div id="pickhost"></div>

  <section class="board">
    <div class="plate">
      <h2 id="plateTitle"></h2>
      <p class="sub" id="plateSub"></p>
    </div>
    <div class="stage"><svg id="orbit" viewBox="0 0 1280 880" role="img"
      aria-label="개념트리"></svg></div>
  </section>

  <div class="treelist" id="treelist"></div>
  <div class="legend" id="legend"></div>
  <p class="note" id="note"></p>
</div>

<div class="peek" id="peek" hidden aria-hidden="true">
  <div class="pk-top"><span class="pk-eyebrow" id="pkEyebrow"></span>
    <span class="pk-tier" id="pkTier"></span></div>
  <h4 class="pk-title" id="pkTitle"></h4>
  <p class="pk-q" id="pkQ"></p>
  <div class="pk-sep"></div>
  <div id="pkBody"></div>
</div>


<div class="vwrap" id="vwrap" hidden>
  <div class="vbg" id="vbg"></div>
  <div class="vbox">

<script>
(function(){
  var T=TERRA, L=window.LECT||{};
  T.mountNav("skilltree.html");

  /* 색은 전부 CSS 변수에서 읽는다 — 스킨을 갈아입으면 그림도 같이 갈아입는다 */
  function cv(k){ return getComputedStyle(document.documentElement)
                    .getPropertyValue(k).trim(); }
  function hsl(hex){
    var m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||"");
    if(!m) return [200,60,55];
    var r=parseInt(m[1],16)/255,g=parseInt(m[2],16)/255,b=parseInt(m[3],16)/255;
    var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0,l=(mx+mn)/2;
    var sa=d===0?0:d/(1-Math.abs(2*l-1));
    if(d){ h = mx===r?60*(((g-b)/d)%6) : mx===g?60*((b-r)/d+2) : 60*((r-g)/d+4); }
    if(h<0) h+=360;
    return [Math.round(h),Math.round(sa*100),Math.round(l*100)];
  }
  /* ── 묶는 축 ──
     통합사회는 통합 과목이라 지리·일반사회·윤리로 깨끗하게 안 갈린다.
     사회 정의와 불평등은 일반사회 55%·윤리 43% 로 반씩이고,
     통합적 관점은 문항이 전부 통합사회 학평이라 판정할 근거조차 없다.
     그래서 축을 학년에 맞춰 바꾼다 — 고1·2 는 교과서, 고3 은 수능. */
  var AXES={
    "교과서":{
      name:"교과서 차례", say:"학교에서 나가는 순서 그대로",
      keys:["통합사회1","통합사회2","횡단"],
      label:{"통합사회1":"통합사회 1","통합사회2":"통합사회 2","횡단":"사상가"},
      key:{"통합사회1":"--fam-geo","통합사회2":"--fam-soc","횡단":"--fam-eth"},
      sub:{"통합사회1":"통합적 관점, 행복, 자연환경, 문화, 생활공간",
           "통합사회2":"인권과 헌법, 정의, 시장경제, 세계화, 미래",

      of:function(r){ return r.book||"횡단"; }
    },
    "수능":{
      name:"수능 선택과목", say:"이 내용을 어느 과목에서 다시 만나는지",
      keys:["지리","일반사회","윤리"],
      label:{"지리":"지리","일반사회":"일반사회","윤리":"윤리"},
      key:{"지리":"--fam-geo","일반사회":"--fam-soc","윤리":"--fam-eth"},
      sub:{"지리":"세계지리·한국지리에서 다시 만나는 것",
           "일반사회":"정치와법·경제·사회문화에서 다시 만나는 것",
           "윤리":"생활과윤리·윤리와사상에서 다시 만나는 것"},

  function axisName(){

  (function 단원축(){

                                            .slice(0,4).join(", ");
    });
    AX={ name:"시험 범위", say:"이번 시험에 나오는 단원만",
         keys:keys, label:label, key:key, sub:sub,

  var FAM={};
  /* ★ 속이 빈 묶음은 빼고 시작한다 — 고1·고2 에서는 사상가(K)를 숨기므로
     "횡단" 자리에 대영역이 하나도 안 남는다. 그대로 두면 0강·0문항 원이 뜬다.
     고3은 K 가 보이므로 사상가 원이 그대로 남는다. */
  /* ★ [전체 보기] 는 **주소로** 넘긴다. 묶음(FAMS·MODEL)이 화면을 켤 때 한 번만
     계산되기 때문에 변수만 바꿔서는 지도가 다시 안 그려진다.
     ★ 이 선언은 반드시 `루트들()` **앞**에 있어야 한다 — 뒤에 두었더니 호이스팅으로
       undefined 가 되어 ?scope=all 이 통째로 안 먹었다. */
  var 범위풀기 = (new URLSearchParams(location.search)).get("scope") === "all";

  /* ★ 지도가 쓰는 대영역 한 곳. 시험 범위를 따르되,
     띠의 [전체 보기] 를 누른 동안에는 학년 필터만 걸어 전부 보여 준다. */
  function 루트들(){
    if(범위풀기) return (T.보이는대영역?T.보이는대영역():T.ROOTS);
    return T.스킬트리대영역 ? T.스킬트리대영역()
         : (T.보이는대영역 ? T.보이는대영역() : T.ROOTS);
  }
  var 보이는루트 = 루트들();
  var FAMS=AX.keys.filter(function(k){
    return 보이는루트.some(function(r){ return AX.of(r)===k; });
  });
  if(!FAMS.length) FAMS=AX.keys.slice();   // 한 묶음도 안 남으면 원래대로
  FAMS.forEach(function(k,i){
    FAM[k]={no:i+1, key:AX.key[k], sub:AX.sub[k], label:AX.label[k]};
  });
  var GOLD,STAR,SLINE,SINK,SINK2,SBG,SBG2,ACC,CORE;
  function paint(){
    FAMS.forEach(function(f){
      var hex=cv(FAM[f].key)||"#4FC3E8", c=hsl(hex);
      FAM[f].hex=hex; FAM[f].h=c[0]; FAM[f].s=c[1];
    });
    GOLD=cv("--fam-soc")||"#FFD86B"; STAR=cv("--star")||"#CFE0FF";
    CORE=cv("--core-glow")||"#4E7BD6";
    /* 영상이 한 편도 없으면 강의 수·시간을 말하지 않는다(2026-09-17 감사: 0편인데 '21강, 다 들었어요'). */
    HASV=Object.keys(window.VIDEO||{}).length>0;
    /* 영상이 한 편도 없으면 강의 수·시간을 말하지 않는다(2026-09-17 감사: 0편인데 '21강, 다 들었어요'). */
    HASV=Object.keys(window.VIDEO||{}).length>0;
    SLINE=cv("--stage-line")||"#2B3D5C"; SINK=cv("--stage-ink")||"#DEE8F8";
    SINK2=cv("--stage-ink-2")||"#A9BEDF"; SBG=cv("--stage")||"#070B14";
    SBG2=cv("--stage-2")||"#0C1424"; ACC=cv("--red")||"#E5484D";
  }
  /* 바탕이 밝은 스킨은 계단이 뒤집힌다 — 진할수록 잘한 것 */
  function paper(){ var k=document.documentElement.dataset.skin;
    return k==="jelly"||k==="note"||k==="white"; }
  /* 종이 위에서 번짐이 세면 뿌옇다. 결마다 세기를 달리한다. */
  function glowK(){ var k=document.documentElement.dataset.skin;
    return k==="white"?.35 : k==="note"?.5 : k==="jelly"?.8 : 1; }

  /* 밤에서는 밝을수록, 종이에서는 진할수록 잘한 것이다 */
  var TIER={
    S:{n:"S",l:80,pl:38,m:1.00,pm:1.00,label:"성취도 80 이상"},
    A:{n:"A",l:65,pl:52,m:1.00,pm:.98,label:"60 이상"},
    B:{n:"B",l:52,pl:66,m:.94,pm:.86,label:"30 이상"},
    C:{n:"C",l:40,pl:78,m:.86,pm:.70,label:"30 미만"},
    L:{n:"–",l:36,pl:87,m:.44,pm:.30,label:"아직 안 풂"}
  };
  function tone(f,t,dl){
    var F=FAM[f]||FAM["지리"], k=TIER[t], pp=paper(), d=(dl||0);
    return "hsl("+F.h+" "+Math.round(F.s*(pp?k.pm:k.m))+"% "+(pp?k.pl-d:k.l+d)+"%)";
  }
  function tierOf(a,played){ return !played?"L":a>=80?"S":a>=60?"A":a>=30?"B":"C"; }
  /* 학생에게 하는 말은 지적이 아니라 권유다. 판단은 학생이 한다. */
  function howFar(st){
    if(!st.play) return "문항을 준비하고 있어요";
    if(!st.solved) return "아직 시작 전이에요";
    if(st.achieve<30) return "이제 막 시작했어요";
    if(st.achieve<60) return "절반쯤 왔어요";
    if(st.achieve<80) return "감이 잡히고 있어요";
    return "여기는 탄탄해요";
  }
  function bat(w){ w=String(w||""); var c=w.charCodeAt(w.length-1);
    return (c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28)!==0:/[013678lmnr]$/i.test(w); }
  function nudge(n){
    if(!n.st.solved) return n.name+(bat(n.name)?"은":"는")+" 아직 시작 전이에요";
    if(n.st.achieve<40) return n.name+"부터 보면 어때요?";
    return n.name+(bat(n.name)?"을":"를")+" 한 번 더 풀어요.";
  }

  /* ══════ 모델 ══════ */
  function esc(t){ return String(t==null?"":t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;"); }

  /* 노드 밑에 쓸 한 줄 — 고1·고2 는 '지금 풀 수 있는 수', 고3 은 성취도 */
  function 노드꼬리(nd, lock){
    var g=(T.state().student||{}).grade||"고1";
    if(g!=="고3"){
      var mine=nd.mine||0;
      return mine ? ("지금 "+mine+"문항"+(HASV?", "+nd.lec.length+"강":""))
                  : ("아직 안 배운 곳"+(HASV?", "+nd.lec.length+"강":""));
    }
    return (HASV?nd.lec.length+"강, ":"")+(lock?"시작 전":"성취도 "+nd.st.achieve+"%");
  }

  var MODEL={};
  FAMS.forEach(function(f){
    var roots=루트들().filter(function(r){ return AX.of(r)===f; });
    var groups=roots.map(function(r){
      return {code:r.code,name:r.name,full:r.full,ref:r,
        items:r.mids.map(function(m){
          var st=T.midStat(m.code), lc=L[m.code]||{};
          // 이 학년이 **본 문항으로** 풀 수 있는 수(고1·고2 는 통합사회 학평)
          var mine=0;
          m.leaves.forEach(function(lf){ mine+=T.mainCount(lf); });
          return {code:m.code,name:m.name,full:m.full||m.name,ref:m,root:r,st:st,fam:f,mine:mine,
                  wt:lc.wt||0,own:lc.own||0,vol:lc.vol||0,eff:lc.eff||0,
                  lec:lc.lectures||[],mins:lc.sumMin||0,
                  tier:tierOf(st.achieve,st.solved>0)};
        })};
    });
    var items=[].concat.apply([],groups.map(function(g){ return g.items; }));
    MODEL[f]={fam:f,groups:groups,items:items,
      n:items.reduce(function(s,x){ return s+x.st.n; },0),
      play:items.reduce(function(s,x){ return s+x.st.play; },0),
      wt:items.reduce(function(s,x){ return s+x.wt; },0),
      mins:items.reduce(function(s,x){ return s+x.mins; },0),
      lec:items.reduce(function(s,x){ return s+x.lec.length; },0)};
  });
  var ALL={};
  ["n","play","lec","mins"].forEach(function(k){
    ALL[k]=FAMS.reduce(function(s,f){ return s+MODEL[f][k]; },0);
  });

  var level=0, fam=null, grp=null, busy=false;
  /* ★ 시험 범위가 한 묶음(통합사회 1 또는 2) 안에 다 들어가면 **묶음 층을 건너뛴다.**
     고1 내신에서 범위가 통사2 라면 첫 화면이 "통합사회 2" 단추 하나짜리 방이 된다 —
     고를 것이 없는 화면을 한 번 눌러야 단원이 나왔다(2026-09-04 대표님 지적).
     이때는 그 묶음 안으로 들어간 상태로 켜서, 첫 화면이 곧 **단원 셋**이 되게 한다. */
  var 묶음건너뜀 = false;

  function narrow(){ return window.innerWidth<=760; }

  /* ══════ SVG ══════ */
  var NS="http://www.w3.org/2000/svg";
  function el(tag,attrs,parent){
    var e=document.createElementNS(NS,tag);

  }

  function seed(s){ var h=2166136261;
    for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
    return ((h>>>0)%10000)/10000; }
  var rad=function(a){ return a*Math.PI/180; };

  /* ── 자리 잡기 ──
     viewBox 를 컨테이너 폭과 1:1 로 맞춘다. 그래야 창이 좁아져도 글씨가
     같은 크기로 남는다. 대신 반지름을 폭에 따라 줄인다. */
  var LAY={};
  function layout(){
    var st=document.querySelector(".board .stage");
    var W=Math.max(340,Math.round(st?st.clientWidth:1180));
    var k=Math.max(.52,Math.min(1,W/1180));
    var H=Math.round((W<640?600:W<900?860:950)*Math.max(.88,k));   // 폰은 낮게 — 원이 화면을 다 먹지 않게(2026-09-18)
    LAY={W:W,H:H,CX:W/2,CY:H/2,k:k,
         rCore:Math.round((74*k+12)*(W<640?.72:1)),
         rHub:Math.round(196*k+18),
         rChild:Math.round(126*k+16),
         fCore:Math.round(28*k+8),
         fHub:Math.round(13*k+3),
         fName:Math.round(11*k+4),
         fSub:Math.round(9*k+3)};
    return LAY;
  }
  var uid=0;
  /* 별을 뺀 알맹이의 실제 경계에 화면을 맞춘다. 반지름을 눈대중으로 잡으면
     라벨 한 줄이 늘 어딘가로 삐져나간다(2026-08-30). */
  function fitView(layer){
    var svg=svgEl();
    var ink=layer ? layer.querySelector(".ink") : svg.querySelector(".layer .ink");
    if(!ink) return;
    var bb;
    try{ bb=ink.getBBox(); }catch(e){ return; }
    if(!bb||!bb.width) return;
    var pad=Math.round(16*LAY.k)+8;
    var x=bb.x-pad, y=bb.y-pad, w=bb.width+pad*2, h=bb.height+pad*2;
    svg.setAttribute("viewBox",[x.toFixed(0),y.toFixed(0),w.toFixed(0),h.toFixed(0)].join(" "));
  }

  /* 검은 원 + 테두리 + 아래에서 차오르는 채움.

  function orb(parent,x,y,r,col,pct,opt){
    opt=opt||{};
    var g=el("g",{},parent);
    var p=Math.max(0,Math.min(100,pct||0))/100;
    if(!opt.flat)
      el("circle",{class:"nb",cx:x,cy:y,r:r+11,fill:col,
        opacity:((paper()?(p?.2:.1):(p?.28:.14))*glowK()).toFixed(3),

    el("circle",{class:"nb",cx:x,cy:y,r:r,fill:SBG2,"fill-opacity":1},g);
    if(p>=0.12){   /* 12% 미만은 물이 얇은 띠로만 보여 겹침처럼 읽힌다(2026-09-16 대표님) — 글로만 알린다 */
      var id="fill"+(++uid);
      var cp=el("clipPath",{id:id},g);
      el("rect",{x:x-r,y:y+r-2*r*p,width:2*r,height:2*r*p},cp);

           fill:SINK2,"font-size":L.fSub,"font-weight":600,"font-family":cv("--kr")});

        liven(gp,[l1,l2],function(){ showPeek(n,gp); },hidePeek);

        gp.addEventListener("keydown",function(e){

    });
    var av=M.items.length
      ? Math.round(M.items.reduce(function(s,x){ return s+x.st.achieve; },0)/M.items.length)

    coreOrb(g,hue,FAM[f].label||f,"",function(){ if(!busy) goAll(); });

      fill:SINK2,"font-size":Math.round(L.fSub+1),"font-weight":600,

  /* 그려 놓고 보면 이웃 라벨이 겹친다. 좌표 계산으로는 다 못 막으니
     실제 상자를 재서 겹친 만큼 바깥으로 밀어낸다. */
  function unstack(g,cx,cy){
    var gs=[].slice.call(g.querySelectorAll(".lblg"));
    if(gs.length<2) return;
    // 원은 실제 테두리로 잰다. .node 의 상자에는 발광까지 들어가 라벨이 지나치게 멀어진다.
    var circles=gs.map(function(x){
      return {x:+x.dataset.cx, y:+x.dataset.cy, r:+x.dataset.r};
    });
    function boxCircle(b,c,pad){
      var nx=Math.max(b.x,Math.min(c.x,b.x+b.width));
      var ny=Math.max(b.y,Math.min(c.y,b.y+b.height));
      return Math.hypot(c.x-nx,c.y-ny) < c.r+2+(pad||0);
    }
    function box(x){ try{ return x.getBBox(); }catch(e){ return null; } }
    function hit(a,b,pad){
      pad=pad||0;
      return a.x < b.x+b.width+pad && a.x+a.width+pad > b.x &&
             a.y < b.y+b.height+pad && a.y+a.height+pad > b.y;
    }
    var st=gs.map(function(x){
      var b=box(x);
      var ux=(+x.dataset.cx)-cx, uy=(+x.dataset.cy)-cy;
      var m=Math.hypot(ux,uy)||1;
      return {g:x, b:b, ux:ux/m, uy:uy/m, dx:0, dy:0, own:i};
    }).filter(function(x){ return x.b; });
    st.forEach(function(x,i){ x.own=i; });
    for(var pass=0; pass<4; pass++){
      var moved=false;
      for(var i=0;i<st.length;i++){
        var A=st[i], push=false;
        for(var j=0;j<st.length;j++){
          if(i===j) continue;
          if(hit(A.b, st[j].b, 2)){ push=true; break; }
        }
        if(!push) for(var c=0;c<circles.length;c++){
          if(boxCircle(A.b, circles[c], c===A.own ? -6 : 0)){ push=true; break; }   // 제 원은 테두리를 파고들 때만
        }
        if(push){
          var step=9;
          A.dx+=A.ux*step; A.dy+=A.uy*step;
          A.g.setAttribute("transform","translate("+A.dx.toFixed(1)+","+A.dy.toFixed(1)+")");
          A.b=box(A.g); moved=true;
        }
      }
      if(!moved) break;
    }
  }

  var EASE="cubic-bezier(.32,.72,0,1)";
  function svgEl(){ return document.getElementById("orbit"); }
  function swap(drawNext,ox,oy,dir){
    if(busy) return;
    busy=true; hidePeek();
    var svg=svgEl(), out=svg.querySelector(".layer");
    var g=el("g",{class:"layer"},svg);
    drawNext(g);
    var o=ox+"px "+oy+"px";
    var big=dir>0?2.35:.46, small=dir>0?.46:2.35;
    if(out){
      out.style.transformOrigin=o;
      out.style.transition="transform .58s "+EASE+",opacity .34s ease";
      requestAnimationFrame(function(){
        out.style.transform="scale("+big+")"; out.style.opacity="0"; });
    }
    fitView(g);
    g.style.transformOrigin=o;
    g.style.transform="scale("+small+")"; g.style.opacity="0";
    requestAnimationFrame(function(){
      g.style.transition="transform .58s "+EASE+",opacity .4s ease";
      g.style.transform="none"; g.style.opacity="1";
    });
    setTimeout(function(){
      if(out&&out.parentNode) out.parentNode.removeChild(out);
      g.style.transition=""; busy=false;
    },620);
  }

  var peek=document.getElementById("peek"), peekTimer=null;
  function place(g){
    peek.hidden=false; peek.setAttribute("aria-hidden","false");
    var r=g.getBoundingClientRect(), pw=352, ph=peek.offsetHeight||320;
    var x=r.right+18, y=r.top+r.height/2-ph/2;
    if(x+pw>window.innerWidth-14) x=r.left-pw-18;
    if(x<14) x=Math.min(Math.max(14,r.left+r.width/2-pw/2),window.innerWidth-pw-14);
    y=Math.min(Math.max(14,y),window.innerHeight-ph-14);
    peek.style.left=x+"px"; peek.style.top=y+"px";
    requestAnimationFrame(function(){ peek.classList.add("on"); });
  }
  function famPeek(f,g){
    clearTimeout(peekTimer);
    var svg=g.ownerSVGElement; if(svg) svg.classList.add("dim");
    var M=MODEL[f];
    document.getElementById("pkEyebrow").textContent="갈래";
    var tc=document.getElementById("pkTier");
    tc.textContent="들어가기"; tc.style.background=FAM[f].hex; tc.style.color=SBG;
    document.getElementById("pkTitle").textContent=f;
    document.getElementById("pkQ").textContent=FAM[f].sub;
    document.getElementById("pkBody").innerHTML=
      '<div class="pk-stats"><div><b>'+M.lec+'</b><span>강</span></div>'+
      '</div>'+
      '<div class="pk-keys">'+M.groups.map(function(g2){
        return '<span class="pk-key">'+g2.name+'</span>'; }).join("")+'</div>'+
      '<div class="pk-foot">눌러서 들어가기</div>';
    place(g);
  }
  function showPeek(n,g){
    clearTimeout(peekTimer);
    var svg=g.ownerSVGElement; if(svg) svg.classList.add("dim");
    var t=TIER[n.tier], st=n.st;
    document.getElementById("pkEyebrow").textContent=n.root.code+" "+n.root.name;
    var tc=document.getElementById("pkTier");
    tc.textContent=n.tier==="L"?"아직 안 함":t.n;
    tc.style.background=n.tier==="S"?GOLD:tone(n.fam,n.tier);
    tc.style.color=(n.tier==="C"||n.tier==="L")?SBG2:SBG;
    document.getElementById("pkTitle").textContent=n.full;
    document.getElementById("pkQ").textContent=
      (HASV?n.lec.length+"강, ":"")+"지금 풀 수 있는 기출 "+st.play+"문항";
    var ls=n.ref.leaves.map(function(l){ return T.leafStat(l.code); });
    var bars=ls.length?('<div class="pk-bars">'+ls.slice(0,10).map(function(s){
      var tk=tierOf(s.achieve,s.solved>0);
      var h=(6+Math.max(0,Math.min(100,s.achieve))/100*36).toFixed(0);
      return '<span class="sp"><i style="height:'+h+'px;background:'+
        (tk==="S"?GOLD:tone(n.fam,tk))+';opacity:'+(s.solved?1:.4)+'"></i></span>';
    }).join("")+'</div><div class="pk-cap">강별 성취도</div>'):"";
    document.getElementById("pkBody").innerHTML=
      '<div class="pk-stats"><div><b>'+st.achieve+'%</b><span>성취도</span></div></div>'+bars+
      '<div class="pk-keys">'+n.lec.slice(0,5).map(function(x){
        return '<span class="pk-key">'+x.title+'</span>'; }).join("")+'</div>'+
      '<div class="pk-foot">눌러서 강의 목록 열기</div>';
    place(g);
  }
  function hidePeek(){
    peek.classList.remove("on");
    document.querySelectorAll("svg.dim").forEach(function(s){ s.classList.remove("dim"); });
    peekTimer=setTimeout(function(){
      peek.hidden=true; peek.setAttribute("aria-hidden","true"); },180);
  }

  /* ══════ 폰용 목록 ══════ */
  function drawList(){
    var host=document.getElementById("treelist");
    if(level===0){
      host.innerHTML=FAMS.map(function(f){
        var M=MODEL[f];
        return '<div class="grp"><div class="gh">'+
          '<span class="cd" style="color:'+FAM[f].hex+'">'+FAM[f].no+'</span>'+
          '<h3>'+esc(FAM[f].label||f)+'</h3><span class="n">'+(HASV?M.lec+'강, ':'')+'기출 '+M.n.toLocaleString()+'</span></div>'+
          M.groups.map(function(g){
            return '<div class="mrow" data-gofam="'+f+'">'+
              '<span class="bul" style="background:'+FAM[f].hex+';opacity:.7"></span>'+
              '<span class="nm">'+g.name+'</span>'+
              '<span class="pc">중영역 '+g.items.length+'</span></div>';
          }).join("")+'</div>';
      }).join("");
      host.querySelectorAll("[data-gofam]").forEach(function(b){
        b.onclick=function(){ goFam(b.dataset.gofam,LAY.CX,LAY.CY); };
      });
      return;
    }
    var M=MODEL[fam];
    var groups=(level===2&&grp)?[grp]:M.groups;
    host.innerHTML=groups.map(function(g){
      return '<div class="grp"><div class="gh">'+
        '<h3>'+g.name+'</h3><span class="n">중영역 '+g.items.length+'</span></div>'+
        g.items.map(function(x){
          var col=x.tier==="S"?GOLD:tone(fam,x.tier,paper()?14:0);
          return '<div class="mrow'+((T.inScopeMid&&!T.inScopeMid(x.code))?' out':'')+'" data-mid="'+x.code+'">'+
            '<span class="bul" style="background:'+col+';opacity:'+
            (x.tier==="L"?.55:1)+'"></span>'+
            '<span class="nm">'+x.name+'</span>'+
            '<span class="pc">'+x.lec.length+'강, '+
            (x.tier==="L"?"아직 안 함":x.st.achieve+"%")+'</span></div>';
        }).join("")+'</div>';
    }).join("");
    host.querySelectorAll("[data-mid]").forEach(function(b){
      b.onclick=function(){
        var f=M.items.filter(function(x){ return x.code===b.dataset.mid; })[0];
        if(f) openSheet(f);
      };
    });
    // 폰에서 갈래 층에 있으면 대영역을 눌러 한 겹 더 들어간다
    if(narrow()&&level===1){
      host.querySelectorAll(".grp .gh").forEach(function(h,i){
        h.style.cursor="pointer";
        h.onclick=function(){ goGroup(M.groups[i],LAY.CX,LAY.CY); };
      });
    }
  }

  /* ══════ 범례·주석 ══════ */
  function legend(){
    var f=fam||"지리";
    var size='';
    document.getElementById("legend").innerHTML=(level===1
      ? ["S","A","B","C","L"].map(function(k){
          return '<span class="k"><i class="dot" style="background:'+
            (k==="S"?GOLD:tone(f,k))+'"></i>'+TIER[k].n+' — '+TIER[k].label+'</span>';
        }).join("")
      : FAMS.map(function(x){
          return '<span class="k"><i class="dot" style="background:'+FAM[x].hex+'"></i>'+
            esc(FAM[x].label||x)+(HASV?', '+MODEL[x].lec+'강':'')+'</span>';
        }).join(""))+size;
  }
  /* ★ 범위 띠 — 지도가 시험 범위로 줄었을 때 그 까닭을 적는다.
     안 적으면 학생은 단원이 **사라진 줄** 안다. 한 번 눌러 전체를 볼 수 있게 둔다
     (범위 설정 자체는 건드리지 않는다 — 이 화면에서만 잠깐 푼다). */
  function scopeband(){
    var host=document.getElementById("scopeband");
    if(!host) return;
    var 켜짐 = T.scopeOn && T.scopeOn();
    if(!켜짐){ host.hidden=true; return; }
    var 전체 = (T.보이는대영역?T.보이는대영역():T.ROOTS);
    var 안 = 전체.filter(function(r){ return T.inScope(r.code); });
    if(범위풀기){
      host.hidden=false;
      var bb=(T.기본범위지금&&T.기본범위지금())||null;
      host.innerHTML='<span class="ic">전</span><span class="tx">'+
        '<b>전체를 보는 중</b> — 시험 범위 밖 단원도 함께 그렸어요. '+
        '<em>시험 범위는 '+((bb&&bb.name)||"시험")+' 그대로 남아 있어요.</em></span>'+
        '<span class="act"><a href="skilltree.html">범위만 보기</a>'+
        '<a href="settings.html#scope">범위 바꾸기</a></span>';
      return;
    }
    if(안.length===전체.length){ host.hidden=true; return; }   // 줄지 않았다
    var b = (T.기본범위지금 && T.기본범위지금()) || null;
    var 자동 = T.범위자동인가 && T.범위자동인가();
    var 이름 = 안.map(function(r){ return r.name; }).join(", ");
    var 꼬리 = "";
    if(자동 && b){
      꼬리 = " <em>— " + (b.학교||"") + " " + (b.name||"") + " 기준으로 자동으로 잡았어요"
           + (b.근거==="추정" ? " (1학기 범위는 <b>추정</b>이에요)" : "")
           + ". 우리 학교와 다르면 설정에서 고쳐 주세요.</em>";
    }
    host.hidden=false;
    host.innerHTML =
            '<span class="tx"><b>' + (b&&b.name ? b.name : "시험") + ' 범위</b>, ' +
        이름 + ' (' + 전체.length + '단원 중 ' + 안.length + '단원)' + 꼬리 + '</span>' +
      '<span class="act">' +
        (범위풀기
          ? '<a href="skilltree.html">범위로 돌아가기</a>'
          : '<a href="skilltree.html?scope=all">전체 보기</a>') +
        '<a href="settings.html#scope">범위 바꾸기</a></span>';
  }

  /* 추천 띠는 지도를 다 그린 뒤 한 번 그린다 */
  function note(){
    if(AX.단원축){
      var bq=(T.기본범위지금&&T.기본범위지금())||null;
      document.getElementById("note").innerHTML =
        '<b>이번 시험 범위 단원만 그렸습니다</b> — ' +
        FAMS.map(function(f){ return FAM[f].label; }).join(", ") +
        '. 단원을 누르면 그 단원의 목차가 펼쳐집니다.' +
        (bq&&bq.근거==="추정"
          ? ' <b>1학기 범위는 추정</b>이라 학교와 다를 수 있습니다 — 설정에서 고쳐 주세요.'
          : '') +
        '';
      return;
    }
    var why = axisName()==="교과서"
      ? '<b>지금은 교과서 차례로 묶여 있습니다</b> — 통합사회 1·2 의 대단원 순서 그대로라 '+
        '학교 진도와 그대로 맞습니다. ' +
        /* ★ 사상가 원을 안 그리는 학년(고1·고2)에서는 이 문장도 뺀다.
           화면에 없는 것을 설명하면 학생이 못 찾고 헤맨다. */
        (FAMS.indexOf("횡단") >= 0
          ? '사상가는 교과서 대단원이 아니라 단원을 가로지르는 축이라 '+
            '따로 세워 두었습니다(수능에서 크게 나옵니다). '
          : '')
      : '<b>지금은 수능 선택과목으로 묶여 있습니다</b> — 이 내용을 세계지리·정치와법·생활과윤리 '+
        '가운데 어디서 다시 만나는지로 갈랐습니다. 다만 통합사회는 통합 과목이라 깨끗하게 '+
        '안 갈리는 단원이 있습니다(사회 정의와 불평등은 일반사회 55%·윤리 43%). ';
    document.getElementById("note").innerHTML= why +
      '설정에서 묶는 축을 바꿀 수 있습니다.';
  }

  /* ══════ 시작 ══════ */
  function boot(){
    paint();
    var svg=svgEl();
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    defsOf(svg);
    var g=el("g",{class:"layer"},svg);
    if(level===0) drawAll(g);
    else if(level===2&&grp) drawGroup(g,fam,grp);
    else drawFam(g,fam);
    fitView(g);
    head(); drawList(); legend(); note(); scopeband();
  }
  /* 창이 바뀌면 자리를 다시 잡는다 — viewBox 를 폭에 1:1 로 맞추기 때문이다 */
  var reT=null;
  function onResize(){
    clearTimeout(reT);
    reT=setTimeout(function(){
      var st=document.querySelector(".board .stage");
      if(!st||!st.clientWidth||busy) return;
      if(Math.abs(st.clientWidth-(LAY.W||0))<8) return;
      if(level===2&&!narrow()){ level=1; grp=null; }   // 넓어지면 갈래 층으로
      boot(); head();
    },160);
  }
  window.addEventListener("resize",onResize);
  if(window.ResizeObserver){
    var ro=new ResizeObserver(onResize);
    var stg=document.querySelector(".board .stage");
    if(stg) ro.observe(stg);
  }
  /* ★ 단원 축일 때는 첫 층이 이미 단원이라 건너뛸 것이 없다.
     단원 축이 안 잡힌 채(범위가 두 권에 걸치는 등) 묶음이 하나뿐이면 그때만 건너뛴다. */
  if(!AX.단원축 && FAMS.length===1 && T.scopeOn && T.scopeOn() && !범위풀기){
    fam=FAMS[0]; level=1; 묶음건너뜀=true;
  }
  segs();
  var QS=new URLSearchParams(location.search);
  var q=QS.get("area");
  /* ★ ?area=F 로 들어오는 자리. 단원 축에서는 묶음 키가 **대영역 코드**라
     r.fam(통합사회1/2) 을 넣으면 FAM[fam] 이 없어 'hex' 를 못 읽고 죽는다. */
  if(q) 루트들().forEach(function(r){
    if(r.code!==q) return;
    var k = AX.of(r);
    if(FAM[k]){ fam=k; level=1; }
  });
  boot();
  paintPick();
  /* ★ 오늘 오른 곳 — 선생님 층이 하루 시작 때 찍어 둔 이해도와 견준다. 누르면 그 중영역 시트 */
  if(window.COACH) COACH.mountTreeDelta(document.getElementById("deltahost"), function(leafCode, mk){
    var node=null;
    for(var f in MODEL){
      var hit=MODEL[f].items.filter(function(x){ return x.code===mk; })[0];
      if(hit){ node=hit; break; }
    }
    if(!node && L[mk]){
      var lc=L[mk];
      node={code:mk,full:lc.full||lc.name,fam:lc.fam,
            root:{code:lc.root,name:lc.rootName},
            lec:lc.lectures||[],mins:lc.sumMin||0,
            own:lc.own||0,wt:lc.wt||0,eff:lc.eff||0,
            st:T.midStat(mk),tier:"B"};
    }
    if(node) openSheet(node);
  });
  /* 리포트에서 "오늘 강의" 를 누르고 넘어온 경우 — 바로 그 시트를 연다 */
  var wantLec=QS.get("lec");
  if(wantLec) setTimeout(function(){ jumpTo(wantLec); },420);
  document.addEventListener("keydown",function(e){
    if(e.key!=="Escape"||busy||(sheet&&!sheet.hidden)) return;
    if(level===2&&fam) goFam(fam,LAY.CX,LAY.CY);
    else if(level===1 && !묶음건너뜀) goAll();
  });
  window.addEventListener("terra:skin",function(){ boot(); });
})();
</script>
<script>
/* ★ 개발 중(localhost)에는 서비스워커를 **등록하지 않고, 이미 등록된 것은 푼다.**
   js·css 를 캐시 먼저 주는 전략이라 고치고 열면 늘 한 판 늦는다 —
   실제로 확장팩 화면이 열 개 전부 "준비 중" 으로 보여 한참 헤맸다(2026-09-03).
   개발서버는 no-store 인데 서비스워커는 서버 헤더와 무관하게 제 캐시를 준다.
   배포 주소에서는 그대로 등록한다 — 오프라인은 실사용에서 값어치가 있다. */
(function () {
  if (!("serviceWorker" in navigator)) return;
  var 개발 = location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if (개발) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { r.unregister(); });
    }).catch(function () {});
    if (window.caches) caches.keys().then(function (ks) {
      ks.forEach(function (k) { caches.delete(k); });
    }).catch(function () {});
    return;
  }
  addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
})();
</script>
</body>
</html>
