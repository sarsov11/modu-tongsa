<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스킬트리 — 모두의 통사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FAF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="모두의 통사">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/favicon.png">
<link rel="stylesheet" href="css/base.css?v=7bcef92a">
<link rel="stylesheet" href="css/coach.css?v=208a602f">
<link rel="stylesheet" href="css/question.css?v=354698c6">
<script>try{var _s=localStorage.getItem("terra.skin");if(_s===null)_s="paper";if(_s==="night")_s="";if(_s==="diary")_s="jelly";if(_s)document.documentElement.dataset.skin=_s;}catch(e){}</script>
<style>
  .page{max-width:860px;margin:0 auto;padding:0 var(--s3) var(--s6)}
  .hd{padding:var(--s5) 0 var(--s3)}
  .hd h1{font-size:30px;letter-spacing:-.04em;margin:8px 0 6px}
  .hd p{color:var(--ink-3);font-size:16px;margin:0;font-weight:500}

  /* 기술 목록 */
  .sk{display:grid;gap:12px}
  .skc{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:18px 20px;
    border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);cursor:pointer;text-align:left;
    color:var(--ink);font-family:var(--kr);transition:transform .12s,border-color .12s}
  .skc:hover{transform:translateY(-1px);border-color:var(--line-3)}
  .skc .no{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--cta-soft);color:var(--cta);
    font-size:20px;font-weight:900}
  .skc.done .no{background:var(--mint-soft);color:var(--mint-2)}
  .skc b{display:block;font-size:18px;font-weight:900;letter-spacing:-.03em}
  .skc span{display:block;font-size:15px;color:var(--ink-3);margin-top:3px;font-weight:500}
  .skc .st{font-size:15px;font-weight:800;color:var(--ink-3);white-space:nowrap}
  .skc .st em{font-style:normal;font-size:22px;color:var(--ink);font-weight:900;margin-right:2px}

  /* 기술 하나 */
  .back{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--ink-3);margin-bottom:14px;cursor:pointer;
    background:none;border:0;font-family:var(--kr);padding:0}
  .steps{counter-reset:s;display:grid;gap:10px;margin:18px 0 8px}
  .step{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;padding:14px 16px;border:1px solid var(--line);
    border-radius:var(--r2);background:var(--surface)}
  .step i{counter-increment:s;width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;
    font-style:normal;font-weight:900;font-size:17px}
  .step i::before{content:counter(s)}
  .step p{margin:0;font-size:16px;font-weight:500;color:var(--ink);line-height:1.6}
  .sec{margin-top:30px}
  .sec h2{font-size:20px;letter-spacing:-.03em;margin:0 0 4px}
  .sec .sub{font-size:15px;color:var(--ink-3);margin:0 0 12px;font-weight:500}
  .qcard{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);overflow:hidden}
  .qtop{display:flex;align-items:center;gap:10px;padding:13px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .qtop .chip{font-size:13.5px}
  .qtop .srcline{margin-left:auto;font-size:14px;color:var(--ink-3);font-weight:600}
  .qbody{padding:22px 24px 24px}
  .walk{display:grid;gap:8px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line-2)}
  .walk .w{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:15.5px;line-height:1.6;color:var(--ink-2);font-weight:500}
  .walk .w i{width:30px;height:30px;border-radius:9px;background:var(--cta-soft);color:var(--cta);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:15px}
  .ans{margin-top:14px;font-size:16px;font-weight:800;color:var(--ink)}
  .ans b{color:var(--cta)}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:20px}
  .opt{display:flex;gap:13px;align-items:flex-start;padding:14px 17px;border-radius:var(--r1);border:1px solid var(--line-2);
    background:var(--surface-2);color:var(--ink-2);font-family:var(--kr);font-size:16px;font-weight:500;cursor:pointer;text-align:left;line-height:1.55}
  .opt .k{flex:0 0 28px;height:28px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;font-weight:900;color:var(--ink)}
  .opt:hover{border-color:var(--ink-3)}
  .opt[disabled]{cursor:default}
  .opt[data-s="ok"]{border-color:var(--mint);background:var(--mint-soft);color:var(--ink)}
  .opt[data-s="ok"] .k{background:var(--mint);color:#fff}
  .opt[data-s="no"]{border-color:var(--red);background:var(--red-soft)}
  .opt[data-s="no"] .k{background:var(--red);color:#fff}
  .opts.nums{flex-direction:row;flex-wrap:wrap}
  .opts.nums .opt{padding:12px 16px}
  .verdict{margin-top:18px;padding:16px 18px;border-radius:var(--r2);background:var(--surface-2);border:1px solid var(--line)}
  .verdict .vl{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .tag2{padding:4px 11px;border-radius:99px;font-size:14px;font-weight:900}
  .tag2.ok{background:var(--mint);color:#fff}.tag2.no{background:var(--red);color:#fff}
  .verdict p{margin:0;font-size:15.5px;line-height:1.65;color:var(--ink-2);font-weight:500}
  .gorow{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .plist{display:grid;gap:10px;margin-top:12px}
  .pi{display:flex;gap:12px;align-items:center;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);
    cursor:pointer;font-family:var(--kr);color:var(--ink);text-align:left;font-size:15.5px;font-weight:600}
  .pi .k{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-3);font-weight:900}
  .pi.ok .k{background:var(--mint);color:#fff}.pi.no .k{background:var(--red);color:#fff}
  .pi span.t{flex:1}
  .pi small{font-size:13.5px;color:var(--ink-3);font-weight:600}
  .basis{margin-top:22px;font-size:14px;color:var(--ink-3);font-weight:500;line-height:1.6}

  /* 순서도(원 문항 (나) 그림의 구조를 옮겨 그린다) */
  .flow{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;justify-items:center;margin:14px 0 4px;font-weight:700;color:var(--ink)}
  .flow .box{border:1.5px solid var(--ink);padding:8px 14px;border-radius:4px;background:var(--surface);font-size:14.5px;text-align:center}
  .flow .dia{width:120px;height:52px;display:grid;place-items:center;position:relative;font-weight:900;font-size:17px}
  .flow .dia::before{content:"";position:absolute;inset:0;border:1.5px solid var(--ink);transform:scaleX(1.15) rotate(45deg) scale(.68);background:var(--surface);z-index:-1;border-radius:3px}
  .flow .end{border:1.5px solid var(--ink);padding:10px 22px;border-radius:4px 4px 12px 12px;background:var(--surface);font-size:15px}
  .flow .ar{font-size:13px;color:var(--ink-3);font-weight:700;line-height:1.1;display:grid;justify-items:center}
  .flow .ar::after{content:"↓";font-size:18px;color:var(--ink)}
  .flow .ar.side::after{content:"→";}
  .flow .col{display:grid;justify-items:center;gap:2px;align-content:start}
  @media (max-width:520px){ .skc{grid-template-columns:auto 1fr} .skc .st{grid-column:2} }
</style>
</head>
<body>
<div class="page">
  <div class="hd">
    <span class="kicker"><i></i>스킬트리</span>
    <h1>푸는 기술</h1>
    <p>단원과 상관없이 문제를 여는 기술입니다. 기술마다 보는 순서를 익히고, 실제 기출로 따라 한 뒤, 같은 기술을 쓰는 문항을 풉니다.</p>
  </div>
  <div id="host"></div>
</div>

<script src="js/tree.js?v=c7593fc6"></script>
<script src="js/qbank.js?v=6fddd77e"></script>
<script src="js/oxbank.js?v=1884002d"></script>
<script src="js/conceptq.js?v=fc0c09eb"></script>
<script src="js/cards.js?v=1a50b0db"></script>
<script src="js/keyword.js?v=9ead7c20"></script>
<script src="js/kwgrade.js?v=dc3854d5"></script>
<script src="js/judge.js?v=43f690d4"></script>
<script src="js/pool.js?v=4a7d39b1"></script>
<script src="js/drills.js?v=82b6c52c"></script>
<script src="js/trend.js?v=53fd8a90"></script>
<script src="js/store.js?v=0fb25aff"></script>
<script src="js/qrender.js?v=a26db44e"></script>
<script src="js/skills.js?v=691c0181"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supa.config.js?v=e1d10860"></script>
<script src="js/auth.js?v=72d8dbed"></script>
<script src="js/coach.js?v=a47134ba"></script>
<script>
(function(){
  var T=window.TERRA, Q=window.QBANK||{}, SK=window.SKILLS||[];
  T.mountNav && T.mountNav("skills");
  var host=document.getElementById("host");
  var M="①②③④⑤";
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  var X=window.SKILL_ITEMS||{};                 /* 은행에 없는 기출은 skills.js 가 든다 */
  function item(id){ return X[id] ? X[id].q : (T.QOF ? T.QOF[id] : null); }
  function bank(id){ return X[id] ? X[id].d : Q[id]; }
  function usable(id){ var q=item(id), d=bank(id); return !!(q && d && (X[id] || !window.QRENDER || QRENDER.ok(d,q))); }

  /* 진행 — 기술마다 푼 연습 문항 (기록 자체는 T.answer 가 남긴다) */
  var KEY="terra.skills";
  function prog(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
  function mark(sid,qid,ok){ var p=prog(); p[sid]=p[sid]||{}; p[sid][qid]=ok?1:0; try{ localStorage.setItem(KEY,JSON.stringify(p)); }catch(e){} }

  function src(q){ return esc(q.g||"")+" "+esc(q.d||"")+" "+(q.n?q.n+"번":""); }

  function list(){
    var p=prog();
    host.innerHTML='<div class="sk">'+SK.map(function(s,i){
      var pr=s.practice.filter(usable), done=pr.filter(function(id){ return p[s.id] && p[s.id][id]!=null; }).length;
      return '<button class="skc'+(pr.length&&done===pr.length?' done':'')+'" data-id="'+s.id+'">'+
        '<span class="no">'+(i+1)+'</span>'+
        '<span><b>'+esc(s.name)+'</b><span>'+esc(s.one)+'</span></span>'+
        '<span class="st"><em>'+done+'</em>/ '+pr.length+'</span></button>';
    }).join("")+'</div>';
    host.querySelectorAll(".skc").forEach(function(b){ b.onclick=function(){ location.hash=b.dataset.id; }; });
  }

  function flowHtml(f){
    return '<div class="flow">'+
      '<div class="col" style="grid-column:1"><div class="box">'+esc(f.start)+'</div><div class="ar"></div>'+
      '<div class="dia">'+f.a+'</div><div class="ar">'+f.yes+'</div>'+
      '<div class="dia">'+f.b+'</div><div class="ar">'+f.yes+'</div><div class="end">'+esc(f.endL)+'</div></div>'+
      '<div class="col" style="grid-column:2;padding-top:118px"><div class="ar side">'+f.no+'</div>'+
      '<div class="dia">'+f.c+'</div><div class="ar">'+f.yes+'</div><div class="end">'+esc(f.endR)+'</div></div>'+
      '</div>';
  }

  function qHtml(q,d,opts){
    var 몸=window.QRENDER?QRENDER.html(d,q,{}):('<p>'+esc(d.q)+'</p>');
    if(opts.strip) 몸=몸.replace(/<ol class="opts5">[\s\S]*?<\/ol>/,'');
    /* 스킬트리가 직접 든 문항(SKILL_ITEMS)은 글과 그림이 둘 다 필요하다 — 조판기는 글이 충분하면 그림을 빼므로 여기서 붙인다 */
    if(X[q.id] && q.fig && 몸.indexOf('assets/qfig/')<0) 몸+='<figure class="qfig"><img src="assets/qfig/'+esc(String(q.fig).replace(/\.png$/,'.webp'))+'" alt="문항 자료" loading="lazy"><figcaption>자료 원본</figcaption></figure>';
    /* 순서도 문항은 (나) 그림의 낱말이 글로 흩어져 들어온다 — 그림은 아래에 다시 그리므로 그 줄은 뺀다 */
    if(opts.flowText) 몸=몸.replace(esc(opts.flowText),'');
    return '<div class="qcard"><div class="qtop">'+
      '<span class="chip">'+esc(opts.label||"기출")+'</span>'+(q.lb?'<span class="chip">'+esc(q.lb)+'</span>':'')+
      '<span class="srcline">'+src(q)+'</span></div>'+
      '<div class="qbody">'+몸+(opts.extra||"")+'</div></div>';
  }

  function detail(s){
    var p=prog()[s.id]||{};
    var dq=item(s.demo), dd=bank(s.demo);
    var demo='';
    if(dq&&dd){
      demo=qHtml(dq,dd,{label:"따라 하기",strip:true,flowText:s.flow?(dd.d||"").slice((dd.d||"").indexOf("(나)")+3).trim():null,extra:
        (s.flow?flowHtml(s.flow):'')+
        '<div class="walk">'+s.walk.map(function(w,i){ return '<div class="w"><i>'+(i+1)+'</i><span>'+esc(w)+'</span></div>'; }).join("")+'</div>'+
        '<div class="ans">정답 <b>'+M.charAt(dd.a)+'</b> '+esc(dd.o[dd.a]||"")+'</div>'});
    }
    var pr=s.practice.filter(usable);
    host.innerHTML=
      '<button class="back" id="back">← 기술 목록</button>'+
      '<div class="hd" style="padding-top:0"><span class="kicker"><i></i>'+esc(s.tag)+'</span><h1>'+esc(s.name)+'</h1><p>'+esc(s.one)+'</p></div>'+
      '<div class="sec"><h2>보는 순서</h2><p class="sub">이 차례로 봅니다.</p>'+
      '<div class="steps">'+s.steps.map(function(t){ return '<div class="step"><i></i><p>'+esc(t)+'</p></div>'; }).join("")+'</div></div>'+
      '<div class="sec"><h2>기출로 따라 하기</h2><p class="sub">실제 기출 한 문항에서 단계마다 무엇을 봤는지 그대로 적었습니다.</p>'+demo+'</div>'+
      '<div class="sec"><h2>같은 기술로 풀기</h2><p class="sub">'+pr.length+'문항입니다. 하나씩 눌러 풉니다.</p>'+
      '<div class="plist">'+pr.map(function(id,i){
        var q=item(id), st=p[id]==null?"":(p[id]?"ok":"no");
        return '<button class="pi '+st+'" data-q="'+id+'"><span class="k">'+(i+1)+'</span><span class="t">'+esc(q.lb||bank(id).q.slice(0,40))+'</span><small>'+src(q)+'</small></button>';
      }).join("")+'</div><div id="pstage"></div></div>'+
      '<p class="basis">'+esc(s.basis)+'</p>';
    document.getElementById("back").onclick=function(){ location.hash=""; };
    host.querySelectorAll(".pi").forEach(function(b){ b.onclick=function(){ solve(s,b.dataset.q); }; });
    if(window.webpFallback) webpFallback(document);
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function solve(s,id){
    var q=item(id), d=bank(id);
    var st=document.getElementById("pstage");
    st.innerHTML=qHtml(q,d,{label:"풀기",strip:true,extra:
      '<div class="opts'+(q.ff?' nums':'')+'">'+(q.ff?[0,1,2,3,4]:d.o.map(function(_,i){return i;})).map(function(k){
        return '<button class="opt" data-v="'+k+'"><span class="k">'+M.charAt(k)+'</span>'+(q.ff?'':'<span>'+(window.QRENDER?QRENDER.body(d.o[k]):esc(d.o[k]))+'</span>')+'</button>';
      }).join("")+'</div><div id="v"></div>'});
    st.querySelectorAll(".opt").forEach(function(b){ b.onclick=function(){ judge(s,q,d,+b.dataset.v,b); }; });
    if(window.webpFallback) webpFallback(document);
    st.scrollIntoView({behavior:"smooth",block:"start"});
  }
  function judge(s,q,d,pick,btn){
    var r=T.answer?T.answer(q.id,pick):null, ok=r?r.ok:(pick===d.a);
    mark(s.id,q.id,ok);
    document.querySelectorAll("#pstage .opt").forEach(function(b,k){ b.disabled=true; if(k===d.a) b.dataset.s="ok"; else if(b===btn) b.dataset.s="no"; });
    var why=d.x?'<p>'+esc(d.x)+'</p>':'<p>이 문항은 해설이 함께 오지 않았습니다. 보는 순서대로 선지를 하나씩 지워 보세요.</p>';
    document.getElementById("v").innerHTML='<div class="verdict"><div class="vl"><span class="tag2 '+(ok?"ok":"no")+'">'+(ok?"정답":"오답")+'</span>'+
      '<span style="font-size:14.5px;font-weight:800;color:var(--ink-3)">정답 '+M.charAt(d.a)+(ok?'':', 내가 고른 것 '+M.charAt(pick))+'</span></div>'+why+
      '<div class="gorow"><button class="btn" id="pback">목록으로</button></div></div>';
    document.getElementById("pback").onclick=function(){ detail(s); };
    /* 목록의 상태 표시 갱신 */
    host.querySelectorAll(".pi").forEach(function(b){ if(b.dataset.q===q.id){ b.classList.remove("ok","no"); b.classList.add(ok?"ok":"no"); } });
  }

  function route(){
    var id=(location.hash||"").replace("#","");
    var s=SK.filter(function(x){ return x.id===id; })[0];
    if(s) detail(s); else list();
  }
  window.addEventListener("hashchange",route);
  route();
})();
</script>
</body>
</html>
