<style>
  /* ── 처음 오는 학생을 위한 화면 — 한 화면에 질문 하나, 단추 하나 ──

     헤이링은 관심사·성격·통화 시각을 한 화면에 하나씩 묻고, 정한 시각에 먼저 전화를 건다.
     우리도 이름·학년·시험·범위·하루 분·알림 시각을 하나씩 묻고, 끝나면 오늘 할 것 하나를 내민다. */
  html,body{height:100%}
  body{display:flex;flex-direction:column;min-height:100dvh;background:var(--bg)}
  .ob{flex:1;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;
    padding:env(safe-area-inset-top,0) 20px 0}

    font-size:22px;line-height:1;padding:6px 8px 6px 0;cursor:pointer;visibility:hidden}

  .prog{flex:1;display:flex;gap:4px}

    font-family:inherit;cursor:pointer;padding:6px 0}

  .stage{flex:1;display:flex;flex-direction:column;padding:18px 0 110px}

  .skinb i{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 1px rgba(128,128,128,.45)}

  .tiles.two{grid-template-columns:1fr 1fr}

  .mchk{display:grid;padding:4px 14px 10px}

  /* 세 문항 */
  .qwrap{border:1px solid var(--line-2);border-radius:var(--r2);background:var(--surface);padding:18px 18px 16px}
  .qwrap .qn{font-family:var(--kr);font-weight:700;font-size:14.5px;color:var(--ink-4);letter-spacing:-.01em;margin-bottom:8px}

  .qsay{margin-top:12px;font-size:16px;color:var(--ink-2);line-height:1.6}

  .pips i.ok{background:var(--mint)} .pips i.no{background:var(--red)} .pips i.now{background:var(--ink-3)}

  /* 끝 — 오늘 할 것 하나 */

  .todayone{display:block;text-decoration:none;color:inherit;margin-top:18px;padding:18px;border:1px solid var(--cta-line);border-radius:var(--r2);

  .todayone p{font-size:16px;color:var(--ink-3);line-height:1.55;margin:0}
  .todayone .why{font-size:14.5px;color:var(--ink-4);margin-top:6px}
  .summ{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .summ div{padding:11px 13px;border:1px solid var(--line);border-radius:var(--r1);background:var(--surface)}
  .summ b{display:block;font-size:16px;color:var(--ink)}
  .summ span{font-size:14.5px;color:var(--ink-4)}

  /* 아래 단추 하나 */
  .obfoot{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0));

  .obfoot .in{max-width:520px;margin:0 auto;display:flex;gap:10px}

  @media (prefers-reduced-motion: reduce){.stage.in{animation:none}}

  .unitstoggle{margin:12px 0 6px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);
    color:var(--ink-2);font-family:var(--kr);font-size:15px;font-weight:700;cursor:pointer}
  .unitstoggle[aria-expanded="true"]{border-color:var(--cta);color:var(--cta)}
  .midsbox{margin-top:12px;grid-column:1/-1}
  .mgrp{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);margin-bottom:10px}
  .mh{font-size:15.5px;font-weight:900;margin-bottom:8px} .mh span{display:block;font-size:13px;font-weight:500;color:var(--ink-3);margin-top:2px}

  .mrow2.on .m{border-color:var(--cta);background:var(--cta-soft);color:var(--ink)}
  .mrow2 .dp{flex:0 0 auto;padding:0 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);font-family:var(--kr);font-size:13px;font-weight:800;cursor:pointer}
  .mrow2 .dp[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
  .qsrc{font-size:14px;font-weight:700;color:var(--ink-3);margin:-4px 0 10px}
  /* 배치 시험 진행·건너뛰기 */
  .pt{margin:8px 0 14px}
  .ptbar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden} .ptbar i{display:block;height:100%;width:0;background:var(--cta);transition:width .3s}
  .ptrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:14.5px;font-weight:700;color:var(--ink-3)}
  .skipwrap{position:relative}
  .skipbtn{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);font-family:var(--kr);font-size:14px;font-weight:700;cursor:pointer}
  .skipbtn.arm{border-color:var(--red-2);color:var(--red-2)}
  .tip{position:absolute;right:0;bottom:calc(100% + 8px);width:min(300px,78vw);padding:10px 12px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;line-height:1.5;
    opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .15s,transform .15s;z-index:5;text-align:left}
  .tip::after{content:"";position:absolute;right:18px;top:100%;border:6px solid transparent;border-top-color:var(--ink)}
