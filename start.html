<style>
  /* ── 처음 오는 학생을 위한 화면 — 한 화면에 질문 하나, 단추 하나 ──
     (2026-09-06 대표님: "처음 들어가면 세팅창부터 정갈하게. 헤이링의 첫 UX")
     헤이링은 관심사·성격·통화 시각을 한 화면에 하나씩 묻고, 정한 시각에 먼저 전화를 건다.
     우리도 이름·학년·시험·범위·하루 분·알림 시각을 하나씩 묻고, 끝나면 오늘 할 것 하나를 내민다. */
  html,body{height:100%}
  body{display:flex;flex-direction:column;min-height:100dvh;background:var(--bg)}
  .ob{flex:1;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;
    padding:env(safe-area-inset-top,0) 20px 0}
  .obtop{display:flex;align-items:center;gap:12px;padding:16px 0 8px;min-height:52px}
  .obtop .back{appearance:none;border:0;background:transparent;color:var(--ink-3);font:inherit;
    font-size:22px;line-height:1;padding:6px 8px 6px 0;cursor:pointer;visibility:hidden}
  .obtop .back.on{visibility:visible}
  .prog{flex:1;display:flex;gap:4px}
  .prog i{flex:1;height:4px;border-radius:99px;background:var(--line-2)}
  .prog i.on{background:var(--red)}
  .obtop .skip{margin-left:auto;font-size:13px;color:var(--ink-4);background:none;border:0;
    font-family:inherit;cursor:pointer;padding:6px 0}
  .obtop .skip:hover{color:var(--ink-2)}

  .stage{flex:1;display:flex;flex-direction:column;padding:18px 0 110px}
  .stage .eb{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--ink-4);text-transform:uppercase}
  .stage h1{font-size:clamp(24px,6vw,30px);letter-spacing:-.04em;margin:10px 0 8px;line-height:1.3;color:var(--ink)}
  .stage h1 em{font-style:normal;color:var(--red-2)}
  .stage .lede{font-size:15px;color:var(--ink-3);line-height:1.65;margin:0 0 22px}

  .tiles{display:grid;gap:10px}
  .tile{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1.5px solid var(--line-2);
    border-radius:var(--r2);background:var(--surface);color:var(--ink);font:inherit;text-align:left;
    cursor:pointer;transition:border-color .15s,transform .15s}
  .tile:hover{border-color:var(--line-3)}
  .tile[aria-pressed="true"]{border-color:var(--red);background:linear-gradient(180deg,var(--red-soft),transparent 80%),var(--surface)}
  .tile .ic{flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
    background:var(--surface-3);font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink-2)}
  .tile[aria-pressed="true"] .ic{background:var(--red);color:#fff}
  .tile b{display:block;font-size:16.5px;letter-spacing:-.02em}
  .tile span{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
  .tile .tag{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--red-2);font-weight:700;flex:0 0 auto}
  .tiles.two{grid-template-columns:1fr 1fr}
  .tiles.two .tile{flex-direction:column;align-items:flex-start;gap:6px;padding:16px}
  .tiles.two .tile b{font-size:22px;font-family:var(--mono);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chips button{font:inherit;font-size:13px;padding:8px 13px;border-radius:99px;border:1px solid var(--line-2);
    background:var(--surface);color:var(--ink-2);cursor:pointer}
  .chips button[aria-pressed="true"]{border-color:var(--red);color:var(--ink);background:var(--red-soft)}
  .units{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .units .bk{grid-column:1/-1;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-4);margin-top:8px}
  .units .u{padding:12px 13px;border:1.5px solid var(--line-2);border-radius:var(--r1);background:var(--surface);
    font:inherit;font-size:13.5px;text-align:left;color:var(--ink-2);cursor:pointer;line-height:1.35}
  .units .u b{font-family:var(--mono);font-size:11px;color:var(--ink-4);display:block;margin-bottom:2px}
  .units .u[aria-pressed="true"]{border-color:var(--red);color:var(--ink);background:var(--red-soft)}

  .field{display:flex;flex-direction:column;gap:8px}
  .field input{font:inherit;font-size:20px;padding:16px 18px;border-radius:var(--r2);border:1.5px solid var(--line-2);
    background:var(--surface);color:var(--ink);width:100%;letter-spacing:-.01em}
  .field input:focus{outline:none;border-color:var(--red)}
  .field input[type=date],.field input[type=time]{font-family:var(--mono);font-size:22px}
  .note{font-size:13px;color:var(--ink-4);line-height:1.6;margin-top:14px}
  .note b{color:var(--ink-3)}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;
    border:1.5px solid var(--line-2);border-radius:var(--r2);background:var(--surface);margin-top:12px}
  .toggle b{font-size:15px;color:var(--ink)}
  .toggle span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .sw{appearance:none;width:52px;height:30px;border-radius:99px;background:var(--line-2);position:relative;
    border:0;cursor:pointer;flex:0 0 auto;transition:background .15s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
  .sw[aria-checked="true"]{background:var(--mint)}
  .sw[aria-checked="true"]::after{left:25px}

  /* 세 문항 */
  .qwrap{border:1px solid var(--line-2);border-radius:var(--r2);background:var(--surface);padding:18px 18px 16px}
  .qwrap .qn{font-family:var(--mono);font-size:11.5px;color:var(--ink-4);letter-spacing:.1em;margin-bottom:8px}
  .qwrap .qbody{font-size:15.5px;line-height:1.7;color:var(--ink)}
  .opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r1);
    border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);cursor:pointer;
    font-family:inherit;font-size:14.5px;line-height:1.55;text-align:left;transition:.14s}
  .opt .k{flex:0 0 23px;height:23px;border-radius:7px;background:var(--surface-3);display:grid;place-items:center;
    font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-3)}
  .opt[data-s="ok"]{border-color:var(--mint);background:rgba(47,224,206,.10);color:var(--ink)}
  .opt[data-s="ok"] .k{background:var(--mint);color:#06110F}
  .opt[data-s="no"]{border-color:var(--red);background:var(--red-soft)}
  .opt[data-s="no"] .k{background:var(--red);color:#fff}
  .opt[disabled]{cursor:default}
  .qsay{margin-top:12px;font-size:14px;color:var(--ink-2);line-height:1.6}
  .qsay.good{color:var(--mint)}
  .pips{display:flex;gap:5px;margin-bottom:12px}
  .pips i{flex:1;height:4px;border-radius:99px;background:var(--line-2)}
  .pips i.ok{background:var(--mint)} .pips i.no{background:var(--red)} .pips i.now{background:var(--ink-3)}

  /* 끝 — 오늘 할 것 하나 */
  .done .big{font-family:var(--mono);font-size:44px;font-weight:600;color:var(--ink);letter-spacing:-.05em;line-height:1;margin:6px 0 10px}
  .todayone{display:block;text-decoration:none;color:inherit;margin-top:18px;padding:18px;border:1px solid var(--red-line);border-radius:var(--r2);
    background:linear-gradient(180deg,var(--red-soft),transparent 70%),var(--surface)}
  .todayone .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--red-2);text-transform:uppercase}
  .todayone h3{font-size:19px;margin:6px 0 4px;letter-spacing:-.03em;color:var(--ink)}
  .todayone p{font-size:14px;color:var(--ink-3);line-height:1.55;margin:0}
  .todayone .why{font-size:12.5px;color:var(--ink-4);margin-top:6px}
  .summ{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .summ div{padding:11px 13px;border:1px solid var(--line);border-radius:var(--r1);background:var(--surface)}
  .summ b{display:block;font-size:14px;color:var(--ink)}
  .summ span{font-size:12px;color:var(--ink-4)}

  /* 아래 단추 하나 */
  .obfoot{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0));
    background:linear-gradient(180deg,transparent,var(--bg) 30%)}
  .obfoot .in{max-width:520px;margin:0 auto;display:flex;gap:10px}
  .obfoot .btn{flex:1;font-size:17px;padding:17px 22px;border-radius:14px}
  .obfoot .btn[disabled]{opacity:.45;pointer-events:none}
  .obfoot .btn.ghost{flex:0 0 auto}
  .stage.in{animation:obin .32s cubic-bezier(.32,.72,0,1)}
  @keyframes obin{0%{opacity:0;transform:translateX(14px)}100%{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.stage.in{animation:none}}
</style>
</head>

<script>
(function(){
  var T=window.TERRA, Q=window.QBANK||{}, N=window.TERRA_NOTIFY;
  var S=T.state();
  function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function el(id){ return document.getElementById(id); }
  function bat(w){ w=String(w||""); var c=w.charCodeAt(w.length-1);
    return (c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28)!==0:/[013678lmnr]$/i.test(w); }

  /* 화면에 나가는 말 — 전부 여기. 존댓말, 판단 없음 */
  var MSG={
    introH:"매일 <em>15분</em>,<br>오늘 할 것 하나만 알려 드려요.",
    introP:"몇 가지만 정하면 바로 시작해요. 1분이면 돼요.",
    nameH:"뭐라고 부를까요?", nameP:"화면에서 이 이름으로 불러요.",
    gradeH:"지금 몇 학년이에요?", gradeP:"학년에 따라 배우는 과목과 겨누는 시험이 달라요.",
    examH:"다음 시험은 언제예요?", examP:"날짜를 넣으면 열흘 전부터는 매일 모의고사로 바뀌어요.",
    scopeH:"이번 시험 범위를 골라 주세요.", scopeP:"학교마다 달라서 직접 골라요. 나중에 설정에서 바꿀 수 있어요.",
    goalH:"하루에 얼마나 할까요?", goalP:"끝이 보이는 만큼만 정해요. 매일 하는 게 제일 중요해요.",
    alarmH:"몇 시에 알려 드릴까요?", alarmP:"정한 시각에 오늘 할 것을 먼저 알려 드려요.",
    checkH:"지금 어디쯤인지<br>세 문항으로 볼게요.", checkP:"틀려도 괜찮아요. 어디서 시작할지 정하는 데만 써요.",
    doneH:"준비됐어요.", doneP:"오늘 할 것은 이거예요. 누르면 바로 시작해요."
  };

  /* ── 답 모음 ── */
  var A={ name:(S.student&&S.student.name)||"", grade:(S.student&&S.student.grade)||"고1",
          examId:null, examDate:"", scope:null, goal:15, alarm:"21:00", alarmOn:false, check:[] };
  var steps=["intro","name","grade","exam","scope","goal","alarm","check","done"];
  var i=0;

  function 진행(){
    el("prog").innerHTML=steps.slice(1,-1).map(function(_,k){ return '<i class="'+(k<i?"on":"")+'"></i>'; }).join("");
    el("back").classList.toggle("on", i>0 && i<steps.length-1);
    el("skip").style.visibility=(i>0 && i<steps.length-1)?"visible":"hidden";
  }
  function 단추(label, ok, extra){
    el("foot").innerHTML=(extra||"")+'<button class="btn" id="next"'+(ok===false?' disabled':'')+'>'+esc(label)+'</button>';
    el("next").onclick=다음;
  }
  function 다음(){ 저장(steps[i]); i=Math.min(steps.length-1,i+1); 그리기(); }
  el("back").onclick=function(){ i=Math.max(0,i-1); 그리기(); };
  el("skip").onclick=function(){ i=Math.min(steps.length-1,i+1); 그리기(); };

  /* 답을 저장소에 적는다 — 화면마다 바로 적어야 중간에 나가도 남는다 */
  function 저장(step){
    if(step==="name"){ var v=(el("nm")||{}).value; if(v&&v.trim()){ A.name=v.trim(); S.student.name=A.name; T.flush(); } }
    if(step==="grade"){ T.setGrade(A.grade); }
    if(step==="exam" && A.examId && A.examDate){ T.setExam(A.examId,{date:A.examDate}); }
    if(step==="scope" && A.scope && A.scope.length){ T.setScope(A.scope.slice()); }
    if(step==="goal"){ T.setGoalMin(A.goal); }
    if(step==="alarm" && N){ N.setAt(A.alarm); if(A.alarmOn){ try{ N.enable(); }catch(e){} } }
  }

  function 머리(eb,h,p){
    return (eb?'<span class="eb">'+esc(eb)+'</span>':'')+'<h1>'+h+'</h1>'+(p?'<p class="lede">'+p+'</p>':'');
  }
  function 눌림(host, sel, on){
    host.querySelectorAll(sel).forEach(function(b){ b.setAttribute("aria-pressed", on(b)?"true":"false"); });
  }

  /* ── 화면들 ── */
  var 화면={
    intro:function(st){
      st.innerHTML='<div style="flex:1;display:flex;flex-direction:column;justify-content:center">'+
        '<span class="eb">모두의 통사</span>'+
        '<h1 style="font-size:clamp(28px,7vw,36px)">'+MSG.introH+'</h1>'+
        '<p class="lede">'+esc(MSG.introP)+'</p></div>';
      단추("시작하기");
    },
    name:function(st){
      st.innerHTML=머리("1 / 7",esc(MSG.nameH),esc(MSG.nameP))+
        '<div class="field"><input id="nm" type="text" maxlength="12" placeholder="이름" value="'+esc(A.name)+'" autocomplete="off"></div>';
      var inp=el("nm"); inp.focus();
      inp.oninput=function(){ el("next").disabled=!inp.value.trim(); };
      inp.onkeydown=function(e){ if(e.key==="Enter"&&inp.value.trim()) 다음(); };
      단추("다음", !!A.name);
    },
    grade:function(st){
      var G=T.GRADES;
      st.innerHTML=머리("2 / 7",esc(MSG.gradeH),esc(MSG.gradeP))+
        '<div class="tiles">'+["고1","고2","고3"].map(function(g){
          var x=G[g]||{};
          /* 학년마다 공부 방식 이름 — REMIND · REWIND · REWIRE */
          return '<button class="tile" data-g="'+g+'" aria-pressed="'+(A.grade===g)+'"><span class="ic">'+g+'</span>'+
            '<span><b><span class="re">'+esc(x.re||"")+'</span> '+esc(x.reKo||x.subject||g)+'</b><span>'+esc(x.reSay||x.focus||"")+'</span></span></button>';
        }).join("")+'</div>';
      st.querySelectorAll(".tile").forEach(function(b){ b.onclick=function(){ A.grade=b.dataset.g; T.setGrade(A.grade); 눌림(st,".tile",function(x){return x.dataset.g===A.grade;}); }; });
      단추("다음");
    },
    exam:function(st){
      var list=T.exams()||[];
      if(!A.examId){ var nx=T.nextExam?T.nextExam():null; A.examId=nx?nx.exam.id:(list[0]||{}).id; }
      var cur=list.filter(function(e){return e.id===A.examId;})[0]||list[0]||{};
      if(!A.examDate) A.examDate=cur.date||"";
      st.innerHTML=머리("3 / 7",esc(MSG.examH),esc(MSG.examP))+
        '<div class="chips">'+list.map(function(e){
          return '<button data-ex="'+e.id+'" aria-pressed="'+(e.id===A.examId)+'">'+esc(e.name)+'</button>'; }).join("")+'</div>'+
        '<div class="field"><input id="dt" type="date" value="'+esc(A.examDate)+'"></div>'+
        '<p class="note" id="dnote"></p>';
      function note(){ var d=A.examDate?T.dday(A.examDate):null;
        el("dnote").innerHTML=d?'<b>'+esc(cur.name)+'</b> '+esc(d.label)+' — '+(d.days<=10?"열흘 안이라 매일 모의고사부터 해요.":"그전까지는 하루 15분씩 약한 곳을 메워요."):"날짜를 모르면 건너뛰어도 돼요."; }
      note();
      st.querySelectorAll(".chips button").forEach(function(b){ b.onclick=function(){
        A.examId=b.dataset.ex; cur=list.filter(function(e){return e.id===A.examId;})[0]; A.examDate=cur.date||""; el("dt").value=A.examDate;
        눌림(st,".chips button",function(x){return x.dataset.ex===A.examId;}); note(); }; });
      el("dt").onchange=function(){ A.examDate=el("dt").value; note(); };
      단추("다음");
    },
    scope:function(st){
      if(A.grade==="고3"){ i++; return 그리기(); }        // 고3은 범위가 없다 — 수능 전 범위
      var B=T.기본범위||{}, roots=T.ROOTS.filter(function(r){ return /^[A-J]$/.test(r.code); });
      if(!A.scope){ var sc=T.scope?T.scope():null; A.scope=(sc&&sc.length)?sc.slice():(B.s2mid?B.s2mid.roots.slice():[]); }
      /* ★ 고2 REWIND 는 고1 통합사회 **전 범위**를 되감는다 — 내신 범위로 좁히지 않는다 */
      if(A.grade==="고2" && !A.scope고2){ A.scope=roots.map(function(r){return r.code;}); A.scope고2=1; }
      var presets=["s1mid","s1fin","s2mid","s2fin"].filter(function(k){return B[k];});
      function same(a,b){ return a.slice().sort().join()===b.slice().sort().join(); }
      st.innerHTML=머리("4 / 7",esc(MSG.scopeH),esc(MSG.scopeP))+
        '<div class="chips">'+presets.map(function(k){ var b=B[k];
          return '<button data-p="'+k+'" aria-pressed="'+same(A.scope,b.roots)+'">'+esc(b.name+" · "+b.단원)+'</button>'; }).join("")+'</div>'+
        '<div class="units">'+["통합사회 1","통합사회 2"].map(function(bk,z){
          return '<span class="bk">'+bk+'</span>'+roots.filter(function(r){ return z===0?/^[A-E]$/.test(r.code):/^[F-J]$/.test(r.code); }).map(function(r,k){
