<html lang="ko">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&family=Gaegu:wght@300;400;700&family=Gowun+Dodum&family=Jua&display=swap">

<meta name="theme-color" content="#08090B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="모두의 통사">

<link rel="icon" href="icons/favicon.png">

<script>try{var _s=localStorage.getItem("terra.skin");if(_s===null||_s==="")_s="paper";if(_s==="night")_s="";if(_s==="diary")_s="jelly";if(_s)document.documentElement.dataset.skin=_s;}catch(e){}</script>
<style>
  .page{max-width:820px;margin:0 auto;padding:0 var(--s3) var(--s6)}
  .hd{padding:var(--s5) 0 var(--s3)}
  .hd .eb{font-family:var(--kr);font-weight:700;font-size:14.5px;letter-spacing:-.01em;color:var(--ink-4);
    }
  .hd h1{font-size:28px;letter-spacing:-.04em;margin:8px 0 5px}
  .hd p{color:var(--ink-3);font-size:15.5px;margin:0}

  .prog{display:flex;gap:5px;margin:var(--s3) 0 var(--s2)}
  .prog i{flex:1;height:4px;border-radius:99px;background:var(--surface-3)}
  .prog i.ok{background:var(--mint)}
  .prog i.no{background:var(--red)}
  .prog i.now{background:var(--ink-4)}

  /* ── 지식 카드 — 장황하지 않게. 두세 줄이면 충분하다 ── */
  .card{border:1px solid var(--line-2);border-radius:var(--r3);background:var(--surface);
    padding:26px 28px;margin-bottom:var(--s2);position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--fam-geo)}
  .card[data-k="조문"]::before{background:var(--fam-soc)}
  .card[data-k="사상가"]::before{background:var(--fam-eth)}
  .card .badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--kr);
    font-size:14.5px;font-weight:700;letter-spacing:-.01em;padding:4px 9px;border-radius:5px;
    border:1px solid var(--line-2);color:var(--ink-3)}
  .card h2{font-size:21px;margin:12px 0 14px;letter-spacing:-.03em}
  .card ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  .card li{display:flex;gap:11px;align-items:flex-start;font-size:16px;line-height:1.7;
    color:var(--ink)}
  .card li i{flex:0 0 auto;width:6px;height:6px;border-radius:50%;margin-top:11px;
    background:var(--red)}
  .card .src{margin-top:16px;padding-top:13px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:14.5px;color:var(--ink-4);font-weight:800}
  .card .act{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}

  /* ── 바로 확인 ── */
  .qz{border:1px solid var(--line-2);border-radius:var(--r3);background:var(--surface);
    padding:24px 26px;margin-bottom:var(--s2)}
  .qz .lab{font-family:var(--kr);font-weight:700;font-size:14.5px;letter-spacing:-.01em;color:var(--ink-4);
    }
  .qz .stem{font-size:18px;font-weight:700;line-height:1.65;margin:12px 0 20px;
    color:var(--ink);letter-spacing:-.02em}
  .ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ox button{font-family:inherit;font-size:24px;font-weight:800;padding:20px;
    border-radius:var(--r2);border:1px solid var(--line-2);background:var(--surface-2);
    color:var(--ink-2);cursor:pointer;transition:.15s}
  .ox button:hover{border-color:var(--line-3);color:var(--ink)}
  .ox button[disabled]{opacity:.45;pointer-events:none}

  .verdict{border-radius:var(--r2);padding:18px 20px;margin-top:16px;
    border:1px solid var(--line-2);background:var(--surface-2)}
  .verdict.good{border-color:rgba(47,224,206,.4);background:rgba(47,224,206,.07)}
  .verdict.bad{border-color:var(--red-line);background:var(--red-soft)}
  .verdict.warn{border-color:rgba(240,150,40,.45);background:rgba(240,150,40,.09)}
  .verdict .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .verdict .mark{font-size:16px;font-weight:800;color:var(--ink)}
  .verdict .kind{font-family:var(--kr);font-weight:700;font-size:14.5px;letter-spacing:-.01em;
    padding:3px 8px;border-radius:5px;border:1px solid var(--line-2);color:var(--ink-3)}
  .verdict .say{margin:10px 0 0;font-size:16px;color:var(--ink-2);line-height:1.65}
  .verdict .act{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap}

  .done{border:1px solid var(--line-2);border-radius:var(--r3);background:var(--surface);
    padding:30px 28px;text-align:center}
  .done h2{font-size:24px;margin-bottom:8px;letter-spacing:-.03em}
  .done p{color:var(--ink-3);font-size:15.5px;margin-bottom:8px}
  .done .ubar{max-width:400px;margin:18px auto 22px}
  .done .ubar .lab{display:flex;justify-content:space-between;font-size:14.5px;
    color:var(--ink-4);margin-bottom:5px}
  .done .ubar .lab b{color:var(--ink-2);font-family:var(--mono);font-weight:800}
  .done .act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  @media(max-width:520px){
    .page{padding:0 14px var(--s5)}
    .card,.qz{padding:20px 18px}
    .card h2{font-size:19px}
    .card li{font-size:16px}
  }
  /* ── 카드 끝: 이해 확인 → 기출 (대표님 2026-09-12) ───────────── */
  .ask{border:1px solid var(--line-2);border-radius:var(--r2);background:var(--bg-2);
    padding:22px 20px;margin-top:var(--s4);text-align:center}
  .ask h3{margin:0 0 6px;font-size:19px;letter-spacing:-.02em}
  .ask p{margin:0 0 16px;font-size:15.5px;color:var(--ink-3);line-height:1.6}
  .ask .yes{display:block;width:100%;padding:16px;border:0;border-radius:var(--r3);
    background:var(--mint);color:#06231C;font-weight:800;font-size:16px;cursor:pointer}
  .ask .no{display:block;width:100%;margin-top:8px;padding:12px;border:1px solid var(--line-2);
    border-radius:var(--r3);background:transparent;color:var(--ink-2);font-size:15.5px;cursor:pointer}
  .ask .fall{font-size:14.5px;color:var(--ink-3);margin-top:10px}
  .hot{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;font-size:.45em;vertical-align:middle;
    background:var(--red,#e5484d);color:#fff;font-weight:700;letter-spacing:0}
  /* 카드 2판 블록 */
  .card .csub{margin:-4px 0 12px;font-size:15.5px;font-weight:700;color:var(--ink-3)}
  .card .cp{margin:0 0 12px;font-size:16.5px;line-height:1.75;color:var(--ink);font-weight:500}
  .card .cp b{font-weight:900;color:var(--ink)}
  .card .ctt{font-size:14.5px;font-weight:800;color:var(--ink-3);margin:14px 0 6px}
  .card .ctab{overflow-x:auto} .card .ctab table{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.5}
  .card .ctab th,.card .ctab td{border:1px solid var(--line-2);padding:8px 9px;text-align:left;vertical-align:top;color:var(--ink)}
  .card .ctab th{background:var(--surface-2);font-weight:800;white-space:nowrap}
  .card .ctree .root{padding:10px 14px;border:1.5px solid var(--cta);border-radius:10px;background:var(--cta-soft);font-weight:800;font-size:15px}
  .card .ctree ul{list-style:none;margin:8px 0 0 14px;padding:0;border-left:2px solid var(--line-2)}
  .card .ctree li{padding:6px 0 6px 14px;font-size:15px;line-height:1.55} .card .ctree li b{display:block;font-weight:900}
  .card .cflow ol{margin:0;padding:0;list-style:none;counter-reset:f}
  .card .cflow li{counter-increment:f;position:relative;padding:9px 12px 9px 40px;margin-bottom:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:15px;line-height:1.5}
  .card .cflow li::before{content:counter(f);position:absolute;left:10px;top:9px;width:22px;height:22px;border-radius:7px;background:var(--ink);color:var(--bg);font-weight:900;font-size:13px;display:grid;place-items:center}
  .card .ctrap{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--red-soft);border:1px solid var(--red-line)}
  .card .ctrap .ctt{margin:0 0 6px;color:var(--red-2)} .card .ctrap ul{margin:0;padding-left:18px} .card .ctrap li{font-size:15px;line-height:1.6;color:var(--ink);margin-bottom:4px}
  .card .cnote{font-size:14.5px;color:var(--ink-3);margin:8px 0 0}
</style>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <div class="hd">
    <span class="eb" id="eb"></span>
    <h1 id="ttl">개념 읽기</h1>
    <p id="lede">읽고 바로 확인해요.</p>
  </div>
  <div class="prog" id="prog"></div>
  <div id="stage"></div>
</div>

<script src="js/tree.js?v=c7593fc6"></script>
<script src="js/qbank.js?v=f6d1a6a6"></script>
<script src="js/oxbank.js?v=1884002d"></script>

<script src="js/conceptq.js?v=fc0c09eb"></script>
<script src="js/cards.js?v=5f7c4002"></script>
<script src="js/keyword.js?v=9ead7c20"></script>
<script src="js/kwgrade.js?v=dc3854d5"></script>

<script>
(function(){
  var T=window.TERRA, J=window.JUDGE;
  var CARDS=window.CARDS||{}, BANK=window.OXBANK||[];
  T.mountNav && T.mountNav("card");

  /* 리프 이름 끝의 ★ 는 «빈출» 딱지로 — ★ 만으로는 뜻이 안 보인다 (2026-09-13) */
  function 이름꼴(n){ n=String(n||""); var hot=/\s*★\s*$/.test(n); n=n.replace(/\s*★\s*$/,"");
    return esc(n)+(hot?' <span class="hot">빈출</span>':''); }
  function esc(s){ return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function el(id){ return document.getElementById(id); }

  /* OX 를 id 로 빨리 찾는다 */
  var OXBY={}; BANK.forEach(function(x){ OXBY[x.id]=x; });

  /* ── 어느 리프의 카드인가 ────────────────────────────
     주소로 받거나, 없으면 **오늘 할 것**을 그대로 쓴다.
     화면마다 다른 것을 권하면 안 되므로 store 의 오늘의리프를 부른다. */
  var QS=new URLSearchParams(location.search);
  var leaf=QS.get("leaf");
  if(!leaf || !CARDS[leaf]){
    var 후보=(T.오늘의리프?T.오늘의리프({전부:true}):[]).filter(function(c){
      return CARDS[c.code] && CARDS[c.code].cards.length;
    });
    leaf = 후보.length ? 후보[0].code : Object.keys(CARDS)[0];
  }
  var 묶음 = CARDS[leaf];

  if(!묶음){
    el("stage").innerHTML='<div class="done"><h2>이 단원은 읽을 개념이 없어요</h2>'+
      '<p>이 단원은 문제로 먼저 익히는 편이 빨라요.</p>'+
      '<div class="act"><a class="btn" href="study.html">문제 풀러 가기</a>'+
      '<a class="btn ghost" href="skilltree.html">개념트리</a></div></div>';
    return;
  }

  var 장들 = 묶음.cards.slice(0,8);   /* 원고 카드는 5~7장 */
  var i=0, 결과=[];
  /* ── 카드 → **핵심 개념어 쓰기** 1~2문항 → 기출 (2026-09-13) ─────────
     방금 읽은 카드의 개념어를 직접 써 본다. 문항은 교과서 정의·카드 문장에서만(개념어만들기.py).
     푸는 동안 카드와 리프 이름을 **화면에서 치운다** — 둘 다 답을 알려 준다. */
  var 카드글 = 장들.map(function(c){ return (c.lines||[]).concat((c.blocks||[]).map(블록글)).join(" "); }).join(" ");
  var 개념어 = (window.KWASK ? KWASK.리프에서(T, leaf, 2, 카드글) : []);
  var k=0, 개념어결과=[];
  if(window.COACH) COACH.begin({kind:"card"});   // 리프를 안 넘긴다 — 카드는 이해도를 안 움직인다

  el("eb").textContent = (T.BY[leaf]&&T.BY[leaf].mid.root.name||"")+", "+묶음.mid;   // 단원 코드(F)는 안 보인다
  el("ttl").innerHTML = 이름꼴(묶음.name);
  el("lede").textContent = "개념 "+장들.length+"개를 읽고 바로 확인 문제를 풀어요. 다 맞히면 기출로 넘어가요.";

  function 진행(){
    el("prog").innerHTML = 장들.map(function(_,n){
      var r=결과[n];
      return '<i class="'+(r?(r.ok?"ok":"no"):(n===i?"now":""))+'"></i>';
    }).join("") + 개념어.map(function(_,n){
      var r=개념어결과[n];
      return '<i class="'+(r?(r.ok?"ok":"no"):(i>=장들.length&&n===k?"now":""))+'"></i>';
    }).join("");
  }

  /* ── 카드 2판(개념 원고) 블록 — p 문단 · table · tree · flow · trap · note ── */
  function 굵게(t){ return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
  function 블록글(b){ if(!b) return ""; if(b.t==="p") return b.text||""; if(b.t==="table") return (b.head||[]).concat.apply([], (b.rows||[])).join(" "); if(b.t==="tree") return [b.root].concat((b.branches||[]).map(function(x){return x.join(" ");})).join(" "); if(b.t==="flow") return (b.steps||[]).join(" "); if(b.t==="trap") return (b.items||[]).join(" "); return b.text||""; }
  function 블록HTML(b){
    if(b.t==="p") return '<p class="cp">'+굵게(b.text)+'</p>';
    if(b.t==="table") return '<div class="ctab">'+(b.title?'<div class="ctt">'+굵게(b.title)+'</div>':'')+'<table>'+(b.head&&b.head.length?'<thead><tr>'+b.head.map(function(h){return '<th>'+굵게(h)+'</th>';}).join("")+'</tr></thead>':'')+
      '<tbody>'+(b.rows||[]).map(function(r){ return '<tr>'+r.map(function(x){return '<td>'+굵게(x)+'</td>';}).join("")+'</tr>'; }).join("")+'</tbody></table></div>';
    if(b.t==="tree") return '<div class="ctree">'+(b.title?'<div class="ctt">'+굵게(b.title)+'</div>':'')+'<div class="root">'+굵게(b.root)+'</div><ul>'+(b.branches||[]).map(function(x){ return '<li><b>'+굵게(x[0])+'</b><span>'+굵게(x[1]||"")+'</span></li>'; }).join("")+'</ul></div>';
    if(b.t==="flow") return '<div class="cflow">'+(b.title?'<div class="ctt">'+굵게(b.title)+'</div>':'')+'<ol>'+(b.steps||[]).map(function(x){ return '<li>'+굵게(x)+'</li>'; }).join("")+'</ol></div>';
    if(b.t==="trap") return '<div class="ctrap"><div class="ctt">시험이 비트는 자리</div><ul>'+(b.items||[]).map(function(x){ return '<li>'+굵게(x)+'</li>'; }).join("")+'</ul></div>';
    if(b.t==="note") return '<p class="cnote">'+(b.title?'<b>'+굵게(b.title)+'</b> ':'')+굵게(b.text)+'</p>';
    return '';
  }
  function 카드그리기(){
    진행();
    if(i>=장들.length) return 개념어로();
    var c=장들[i];
    var 몸 = c.blocks
      ? (c.sub?'<p class="csub">'+굵게(c.sub)+'</p>':'')+c.blocks.map(블록HTML).join("")
      : '<ul>'+(c.lines||[]).map(function(t){ return '<li><i></i><span>'+esc(t)+'</span></li>'; }).join("")+'</ul>';
    el("stage").innerHTML =
      '<div class="card" data-k="'+esc(c.k)+'">'+
        '<span class="badge">'+esc(c.k)+'</span>'+
        '<h2>'+esc(c.title)+'</h2>'+
        몸+
        (c.src?'<p class="src">'+esc(c.src)+'</p>':'')+
        '<div class="act"><button class="btn" id="ok">읽었어요, 확인 →</button>'+
          (i>0?'<button class="btn ghost" id="back">앞 개념</button>':'')+
        '</div>'+
      '</div>';
    el("ok").onclick=확인;
    if(el("back")) el("back").onclick=function(){ i=Math.max(0,i-1); 카드그리기(); };
    window.scrollTo({top:0,behavior:"smooth"});
  }

  var 시작시각=0, 지금문항=null;
  function 확인(){
    var c=장들[i];
    var ids=(c.check||[]).filter(function(id){ return OXBY[id]; });
    if(!ids.length){                      // 확인 문항이 없으면 그냥 넘긴다
      결과[i]={ok:true, skip:true}; i++; return 카드그리기();
    }
    지금문항 = OXBY[ids[0]];
    시작시각 = Date.now();
    el("stage").insertAdjacentHTML("beforeend",
      '<div class="qz" id="qz">'+
        '<span class="lab">바로 확인</span>'+
        '<p class="stem">'+esc(지금문항.t)+'</p>'+
        '<div class="ox"><button data-v="1">O</button><button data-v="0">X</button></div>'+
      '</div>');
    document.querySelectorAll("#qz .ox button").forEach(function(b){
      b.onclick=function(){ 답하기(b.dataset.v==="1"); };
    });
    el("qz").scrollIntoView({behavior:"smooth",block:"center"});
  }

  function 답하기(고른){
    var x=지금문항, ok=(!!x.a===고른);
    var ms=Date.now()-시작시각;
    document.querySelectorAll("#qz .ox button").forEach(function(b){ b.disabled=true; });

    /* 기록 — ★ 확인 문항은 OX 문장(id "B1.1_1")이지 문항은행 문항이 아니다.
       T.answer(x.id, …) 는 QOF 에 없어 **조용히 null 을 돌려주고 아무것도 안 남겼다**(2026-09-05 실측).
       개념 체크(ox.html)와 같은 꼴로 훈련 기록(k:"x", t:"card")에 남긴다 —
       오늘 분·훈련 수에 들어가고 선생님 띠가 반응한다. 이해도는 문항으로만 찬다(대표님 원칙). */
    T.drill && T.drill("card", ok);
    T.save && T.save();

    var st=T.leafStat?T.leafStat(leaf):null;
    var v=J.판정({
      ok:ok, conf:"sure", ms:ms, attempt:1, qid:x.id,
      mastery:(st&&st.solved)?(st.correct/st.solved):null,
      streak: T.연속오답 ? T.연속오답(leaf) : 0
    });
    결과[i]={ok:ok, kind:v.kind};
    진행();

    el("qz").insertAdjacentHTML("beforeend",
      '<div class="verdict '+v.tone+'">'+
        '<div class="top"><span class="mark">'+(ok?"○ 맞았어요":"✕ 아니에요")+'</span>'+
          '<span class="kind">'+esc(v.label||v.kind)+'</span></div>'+
        '<p class="say">'+esc(v.say)+'</p>'+
        (!ok ? '<p class="say" style="margin-top:8px"><b>개념으로 돌아가 한 번 더 읽어요.</b> '+
               '방금 읽은 것과 어긋난 자리예요.</p>' : '')+
        '<div class="act">'+
          (!ok?'<button class="btn ghost" id="again">개념 다시 읽기</button>':'')+
          '<button class="btn" id="next">'+
            (i+1>=장들.length?"끝내기":"다음 개념 →")+'</button>'+
        '</div>'+
      '</div>');
    if(el("again")) el("again").onclick=function(){ 카드그리기(); };
    el("next").onclick=function(){ i++; 카드그리기(); };
  }

  var 머리 = { eb:"", ttl:"", lede:"" };
  function 개념어로(){
    if(k>=개념어.length) return 끝();
    if(k===0){
      머리 = { eb:el("eb").textContent, ttl:el("ttl").innerHTML, lede:el("lede").textContent };
    }
    진행();
    el("eb").textContent = "개념어 쓰기";
    el("ttl").textContent = "핵심 개념어 쓰기";
    el("lede").textContent = "방금 읽은 개념어를 직접 써요. 맞히든 틀리든 정답과 근거가 바로 나와요.";
    KWASK.render(el("stage"), 개념어[k], {
      idx:k+1, total:개념어.length,
      next:(k+1>=개념어.length ? "끝내기" : "다음 개념어 →"),
      onDone:function(r){
        개념어결과[k]=r;
        /* ★ 판정이 「하나 더」 라고 했으면 **실제로 하나 더** 낸다(같은 리프, 아직 안 낸 것).
           말만 하고 안 하면 그 말을 안 믿게 된다 — ox.html 의 끼우기와 같은 원칙. 없으면 지어내지 않는다. */
        if((r.next==="same"||r.next==="similar"||r.next==="easier") && 개념어.length<3){
          var 낸 = {}; 개념어.forEach(function(z){ 낸[z.id]=1; });
          var 남은 = KWASK.리프에서(T, leaf, 30, 카드글).filter(function(z){ return !낸[z.id]; });
          var 같은말 = 남은.filter(function(z){ return KWGRADE.norm(z.a)===KWGRADE.norm(개념어[k].a); });
          var 더 = 같은말[0] || 남은[0];      // 같은 개념어를 다른 문장으로 먼저, 없으면 같은 리프의 다른 개념어
          if(더) 개념어.push(더);
        }
        진행();
        var go=document.getElementById("kwgo");
        if(go) go.textContent = (k+1>=개념어.length ? "끝내기" : "다음 개념어 →");
      },
      onNext:function(){ k++; 개념어로(); window.scrollTo({top:0,behavior:"smooth"}); }
    });
    window.scrollTo({top:0,behavior:"smooth"});
  }

  /* 그 리프에 기출 선지 재료가 있는가 — 없으면 문제풀이로 물러선다 */
  var 있나 = !!((window.CONCEPTQ||{})[leaf] || []).length;

  function 끝(){
    var 맞=결과.filter(function(r){ return r&&r.ok; }).length;
    var 어맞=개념어결과.filter(function(r){ return r&&r.ok; }).length;
    if(머리.ttl){ el("eb").textContent=머리.eb; el("ttl").innerHTML=머리.ttl; el("lede").textContent=머리.lede; }
    var u=T.이해도?T.이해도(leaf):0;
    /* 카드는 이해도를 안 움직인다(문항으로만 찬다) — 결산에 이해도 막대를 안 넣는다 */
    if(window.COACH) COACH.wrap({got:맞+어맞, total:장들.length+개념어결과.length, kind:"card",
      more:{label:(있나?"기출 풀기":"문제 풀기"), onclick:function(){ location.href=(있나?("ox.html?leaf="+encodeURIComponent(leaf)):("study.html?leaf="+leaf)); }}});
    el("stage").innerHTML=
      '<div class="done">'+
        '<h2>개념을 다 읽었어요</h2>'+
        '<p>'+맞+' / '+장들.length+' 맞혔어요.'+
          (개념어결과.length ? ' 개념어 쓰기 '+어맞+' / '+개념어결과.length+'.' : '')+'</p>'+
        '<div class="ubar"><div class="lab"><span>이해도</span><b>'+u+' / 100</b></div>'+
          '<span class="track"><i style="width:'+u+'%;background:'+
          (u>=80?"var(--mint)":"var(--lv2)")+'"></i></span></div>'+
        '<p>'+(u>=80
          ? "여기는 잡혔어요. 문제로 굳히면 끝납니다."
          : "이제 문제로 확인해요. 맞힐수록 이해도가 올라가요.")+'</p>'+
        /* ★ 고르게 하지 않는다 — 묻고, 답하면, 바로 띄운다 (대표님 2026-09-12) */
        '<div class="ask" id="ask">'+
          '<h3>여기까지 이해됐나요?</h3>'+
          '<p>이해했다면 이 개념이 나온 <b>기출</b>을 풀어 봐요.</p>'+
          '<button type="button" class="yes" id="yes">네, 이해했어요</button>'+
          '<button type="button" class="no" id="re">아직이에요. 개념 다시 읽기</button>'+
          (있나 ? '' : '<p class="fall">이 범위는 기출 재료가 모자라 문제풀이로 갑니다.</p>')+
        '</div>'+
      '</div>';
    var 갈곳 = 있나 ? ("ox.html?leaf="+encodeURIComponent(leaf)) : ("study.html?leaf="+leaf);
    el("yes").onclick=function(){
      var a=el("ask");
      a.innerHTML='<h3>기출 10문제예요.</h3>'+
        '<p>문제마다 <b>방금 배운 개념이 들어간 선지 하나</b>에 형광펜을 칠해 뒀어요.</p>'+
        '<button type="button" class="yes" id="go">기출 풀기 →</button>';
      el("go").onclick=function(){ location.href=갈곳; };
      el("go").focus();
      a.scrollIntoView({block:"center",behavior:"smooth"});
    };
    el("re").onclick=function(){ i=0; 결과=[]; k=0; 개념어결과=[]; 카드그리기(); window.scrollTo({top:0,behavior:"smooth"}); };
    window.scrollTo({top:0,behavior:"smooth"});
  }

  카드그리기();
})();
</script>
<script>
/* 개발 중(localhost)에는 서비스워커를 등록하지 않고, 이미 등록된 것은 푼다 */
(function(){
  var 로컬=/^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(location.hostname);
  if(!("serviceWorker" in navigator)) return;
  if(로컬){
    navigator.serviceWorker.getRegistrations&&navigator.serviceWorker.getRegistrations()
      .then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
    return;
  }
  navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
