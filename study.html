<script>try{var _s=localStorage.getItem("terra.skin");if(_s===null||_s==="")_s="paper";if(_s==="night")_s="";if(_s==="diary")_s="jelly";if(_s)document.documentElement.dataset.skin=_s;}catch(e){}</script>
<style>
  .wrapx{max-width:1360px;margin:0 auto;padding:0 var(--s3) var(--s6)}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s3);
    align-items:start;margin-top:var(--s3)}

  /* ── 문항 ── */
  .qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
    overflow:hidden}
  .qtop{display:flex;align-items:center;gap:12px;padding:15px 22px;flex-wrap:wrap;
    border-bottom:1px solid var(--line)}
  .qtop .no{font-family:var(--mono);font-size:15px;color:var(--ink-4);font-weight:800}
  .qtop .srcline{font-family:var(--mono);font-size:14.5px;color:var(--ink-4);margin-left:auto;font-weight:800}
  .qbody{padding:24px 26px 26px}
  .stem{font-size:18px;font-weight:700;color:var(--ink);line-height:1.62;
    letter-spacing:-.025em;margin-bottom:18px}
  .data{position:relative;border-radius:var(--r1);padding:20px 22px;margin-bottom:16px;
    background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--mint);
    font-size:16px;line-height:1.92;color:var(--ink-2)}
  .boki{border-radius:var(--r1);padding:16px 20px;margin-bottom:16px;
    background:var(--surface-2);border:1px dashed var(--line-2);
    font-size:15.5px;line-height:1.85;color:var(--ink-2)}
  .boki:before{content:"보 기";display:block;font-family:var(--kr);font-weight:700;font-size:14.5px;
    letter-spacing:-.01em;color:var(--ink-4);margin-bottom:8px}
  /* 표·지도는 원본이 있어야 읽힌다.
     어두운 스킨에서는 **반전**해서 검은 바탕에 흰 글씨로 만든다 —
     흑백 인쇄물이라 반전만으로 화면과 한 몸이 된다.
     (전에는 mix-blend-mode:multiply 를 썼는데, 그건 흰 바탕을 지우는 게 아니라
      글자까지 어둡게 만들어 검은 화면에서 아무것도 안 보이게 했다.) */
  .figure{border-radius:var(--r1);overflow:hidden;border:1px solid var(--line-2);
    margin:0 -26px 12px;background:var(--surface-2);padding:0;position:relative}
  @media(max-width:640px){ .figure{margin:0 -16px 12px;border-radius:0;border-left:0;border-right:0} }
  .figure img{display:block;width:100%;height:auto;
    filter:invert(1) contrast(1.06) brightness(.97)}
  :root[data-skin="note"] .figure img,
  :root[data-skin="jelly"] .figure img,
  :root[data-skin="white"] .figure img{filter:none}
  :root[data-skin="note"] .figure,
  :root[data-skin="jelly"] .figure,
  :root[data-skin="white"] .figure{background:#fff}
  .figure figcaption{display:flex;align-items:center;gap:10px}
  .figure .zoom{margin-left:auto;appearance:none;flex:0 0 auto;
    border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
    border-radius:8px;font-size:14.5px;padding:6px 12px;cursor:pointer;
    font-family:var(--mono);font-weight:800}
  .figure .zoom:hover{border-color:var(--red);color:var(--ink)}
  /* 크게 보기 */
  .lens{position:fixed;inset:0;z-index:120;background:rgba(4,6,10,.96);
    display:none;overflow:auto;padding:56px 10px 20px;
    -webkit-overflow-scrolling:touch;touch-action:pinch-zoom pan-x pan-y}
  .lens.on{display:block}
  /* 원본 크기로 둔다 — 화면 폭에 맞추면 카드와 같은 크기라 크게 볼 까닭이 없다 */
  .lens img{display:block;margin:0 auto;width:auto;max-width:none;height:auto;
    filter:invert(1) contrast(1.06);border-radius:10px}
  .lens .hint2{position:fixed;left:0;right:0;bottom:0;text-align:center;
    font-family:var(--mono);font-size:14.5px;color:var(--ink-4);
    padding:10px;background:linear-gradient(transparent,rgba(4,6,10,.9) 40%);font-weight:800}
  :root[data-skin="note"] .lens img,
  :root[data-skin="jelly"] .lens img,
  :root[data-skin="white"] .lens img{filter:none;background:#fff}
  .lens .x{position:absolute;top:14px;right:16px;appearance:none;border:0;
    background:var(--surface);color:var(--ink);border-radius:10px;
    font-size:16px;padding:9px 14px;cursor:pointer}
  .figcap{font-size:15px;color:var(--ink-4);margin:0 0 6px;font-family:var(--mono);font-weight:800}

  /* ── 자료 표 ── */
  .qtab{margin:0 0 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    border:1px solid var(--line-2);border-radius:var(--r1);background:var(--surface)}
  .qtab table{border-collapse:collapse;width:100%;min-width:max-content;
    font-size:16px;line-height:1.5}
  .qtab th,.qtab td{border:1px solid var(--line-2);padding:9px 13px;
    text-align:center;white-space:nowrap;color:var(--ink-2)}
  .qtab th{background:var(--surface-2);color:var(--ink);font-weight:700}
  .qtab tr:first-child td{background:var(--surface-2);color:var(--ink);font-weight:700}
  /* 첫 열이 항목 이름이면 왼쪽으로 */
  .qtab td:first-child,.qtab th:first-child{text-align:left;
    background:var(--surface-2);color:var(--ink);font-weight:600}
  .qtab + .qtab{margin-top:-6px}
  @media(max-width:640px){
    .qtab table{font-size:15px}
    .qtab th,.qtab td{padding:7px 10px}
  }
  .opts.nums{flex-direction:row;flex-wrap:wrap;gap:10px}
  .opts.nums .opt{flex:1;min-width:78px;justify-content:center;padding:16px 10px}
  .opts.nums .opt .k{width:30px;height:30px;flex:0 0 30px;font-size:16px}
  .figure figcaption{font-family:var(--mono);font-size:14.5px;color:var(--ink-4);
    padding:7px 12px;background:var(--surface-2);border-top:1px solid var(--line);font-weight:800}
  .datafold{margin-bottom:16px}
  .datafold summary{cursor:pointer;font-family:var(--mono);font-size:14.5px;color:var(--ink-4);
    padding:8px 0;list-style:none;display:flex;align-items:center;gap:7px;font-weight:800}
  .datafold summary:before{content:"+";font-size:16px;color:var(--ink-3)}
  .datafold[open] summary:before{content:"–"}
  .datafold summary:hover{color:var(--ink-3)}
  .datafold .data{margin-bottom:0}

  .opts{display:flex;flex-direction:column;gap:9px;margin-top:20px}
  .opt{display:flex;gap:13px;align-items:flex-start;padding:14px 17px;border-radius:var(--r1);
    border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);cursor:pointer;
    font-family:inherit;font-size:15.5px;line-height:1.6;text-align:left;transition:.14s}
  .opt:hover:not([disabled]){border-color:var(--line-3);color:var(--ink)}
  .opt .k{flex:0 0 24px;height:24px;border-radius:7px;background:var(--surface-3);
    display:grid;place-items:center;font-family:var(--mono);font-size:14.5px;font-weight:800;
    color:var(--ink-3)}
  .opt[data-s="ok"]{border-color:var(--mint);background:rgba(47,224,206,.10);color:var(--ink)}
  .opt[data-s="ok"] .k{background:var(--mint);color:#06110F}
  .opt[data-s="no"]{border-color:var(--red);background:var(--red-soft)}
  .opt[data-s="no"] .k{background:var(--red);color:#fff}
  .opt[disabled]{cursor:default}

  .verdict{margin-top:20px;border-radius:var(--r1);border:1px solid var(--line);
    background:var(--surface-2);padding:18px 20px}
  .verdict .vl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .verdict .tag2{font-family:var(--mono);font-size:14.5px;font-weight:800;padding:4px 11px;
    border-radius:6px}
  .verdict .tag2.ok{background:var(--mint);color:#06110F}
  .verdict .tag2.no{background:var(--red);color:#fff}
  .verdict p{font-size:15.5px;line-height:1.78;color:var(--ink-2)}
  /* ── 왜 틀렸나 ──
     정답만 알려 주면 학생은 제 답이 왜 아닌지를 스스로 찾아 읽어야 한다.
     고른 선지의 설명을 맨 앞에 둔다. */
  .whyrow{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;
    border-radius:var(--r1);margin-bottom:9px;font-size:16px;line-height:1.7}
  .whyrow .no{flex:0 0 24px;height:24px;border-radius:7px;display:grid;place-items:center;
    font-family:var(--mono);font-size:14.5px;font-weight:800}
  .whyrow .tt{flex:1;min-width:0}
  .whyrow .tt b{display:block;font-size:14.5px;margin-bottom:3px;letter-spacing:.02em}
  .whyrow.mine{background:var(--red-soft);border:1px solid var(--red-line)}
  .whyrow.mine .no{background:var(--red);color:#fff}
  .whyrow.mine .tt b{color:var(--red-2)}
  .whyrow.right{background:rgba(47,224,206,.09);border:1px solid rgba(47,224,206,.32)}
  .whyrow.right .no{background:var(--mint);color:#06110F}
  .whyrow.right .tt b{color:var(--mint)}
  .whyrow .tt span{color:var(--ink-2)}
  .whymore{margin-top:4px}
  .whymore summary{cursor:pointer;font-family:var(--mono);font-size:14.5px;color:var(--ink-4);
    padding:7px 0;list-style:none;display:flex;align-items:center;gap:7px;font-weight:800}
  .whymore summary:before{content:"+";font-size:16px}
  .whymore[open] summary:before{content:"–"}
  .whymore summary:hover{color:var(--ink-3)}
  .whymore .whyrow{background:var(--surface-2);border:1px solid var(--line)}
  .whymore .whyrow .no{background:var(--surface-3);color:var(--ink-3)}

  .verdict .src{display:block;margin-top:12px;font-family:var(--mono);font-size:14.5px;
    color:var(--ink-4);font-weight:800}
  .gorow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
  .gorow .hint{font-family:var(--mono);font-size:14.5px;color:var(--ink-4);font-weight:800}

  /* ── 진행 ── */
  .prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px;
    border-bottom:1px solid var(--line);background:var(--surface-2)}
  .pips{display:flex;gap:4px;flex-wrap:wrap}
  .pips i{width:20px;height:5px;border-radius:3px;background:var(--line-2);display:block}
  .pips i.ok{background:var(--mint)} .pips i.no{background:var(--red)}
  .pips i.now{background:var(--ink-3)}
  .prog .sc{font-family:var(--mono);font-size:15px;color:var(--ink-3);font-weight:800}
  .prog .sc b{color:var(--ink);font-size:16px}

  /* ── 사이드 ── */
  .side{display:flex;flex-direction:column;gap:var(--s2)}
  .side .card .bd{padding:16px 18px}
  .lf{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--surface-2);
    font-size:15.5px;cursor:pointer;border-radius:9px;border:1px solid transparent;
    transition:.14s;margin-bottom:5px}
  .lf:hover{border-color:var(--line-2)}
  .lf.on{border-color:var(--red-line);background:var(--red-soft)}
  .lf .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:var(--lv1)}
  .lf .nm{flex:1;min-width:0;color:var(--ink-2);font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .lf .n{font-family:var(--mono);font-size:14.5px;color:var(--ink-4);font-weight:800}

  /* ── 고르는 화면 ── */
  .pickwrap{margin-top:var(--s3)}
  .pickgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .pk{border:1px solid var(--line);border-radius:var(--r2);padding:18px 20px;
    background:var(--surface);cursor:pointer;transition:.15s;text-align:left;
    font-family:inherit;display:block;width:100%}
  .pk:hover{border-color:var(--line-3);transform:translateY(-2px)}
  .pk .eb{font-family:var(--kr);font-weight:700;font-size:14.5px;letter-spacing:-.01em;color:var(--ink-4)}
  .pk h3{font-size:16.5px;margin:7px 0 9px;letter-spacing:-.03em}
  .pk .meta{font-family:var(--mono);font-size:14.5px;color:var(--ink-3);font-weight:800}
  .pk .track{margin-top:11px}
  .empty{padding:60px 20px;text-align:center;color:var(--ink-3)}

  @media(max-width:1080px){.cols{grid-template-columns:1fr}
    .side{flex-direction:row;flex-wrap:wrap}.side .card{flex:1;min-width:260px}}
  @media(max-width:640px){
    .wrapx{padding:0 14px var(--s5)}
    .qbody{padding:18px 16px 20px}.qtop{padding:13px 16px}.prog{padding:12px 16px}
    .stem{font-size:16.5px}.opt{font-size:16px;padding:13px 14px}
    .data{padding:16px 16px;font-size:16px}
    .side{flex-direction:column}}

  /* ── 오늘 할 것 (2026-09-04) — 고르는 시간을 없앤다 ── */
  .todaywrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.85fr);
    gap:var(--s3);align-items:start;margin-top:var(--s3)}
  @media(max-width:900px){.todaywrap{grid-template-columns:1fr}}
  .today{border:1px solid var(--line-2);border-radius:var(--r3);background:var(--surface);
    padding:26px 28px;position:relative;overflow:hidden}
  .today::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--red)}
  .today .eb{font-family:var(--kr);font-weight:700;font-size:14.5px;letter-spacing:-.01em;
    color:var(--ink-4);}
  .today h2{font-size:clamp(24px,3.2vw,34px);margin:9px 0 10px;letter-spacing:-.045em;
    line-height:1.2}
  .today .why{font-size:16px;color:var(--ink-2);line-height:1.65;max-width:52ch}
  .today .facts{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0 6px;
    font-family:var(--mono);font-size:15px;color:var(--ink-3);font-weight:800}
  .today .facts b{color:var(--ink);font-weight:600}
  .today .ubar{margin:14px 0 20px;max-width:420px}
  .today .ubar .lab{display:flex;justify-content:space-between;font-size:14.5px;
    color:var(--ink-4);margin-bottom:5px}
  .today .ubar .lab b{color:var(--ink-2);font-family:var(--mono);font-weight:800}
  .today .go{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .today .go .btn{font-size:16px;padding:14px 26px}

  .side{display:flex;flex-direction:column;gap:12px}
  .side .more{width:100%;font-family:inherit;font-size:15.5px;font-weight:700;
    padding:14px 16px;border-radius:var(--r2);border:1px solid var(--line-2);
    background:var(--surface-2);color:var(--ink-2);cursor:pointer;text-align:left;
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .side .more:hover{color:var(--ink);border-color:var(--line-3)}
  .side .more i{font-style:normal;color:var(--ink-4);font-size:15px}
  .rep{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);
    padding:16px 18px}
  .rep h3{font-size:15px;color:var(--ink-4);font-family:var(--kr);letter-spacing:-.01em;
    margin-bottom:11px;font-weight:700}
  .rep ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .rep li{display:flex;gap:9px;align-items:flex-start;font-size:15.5px;color:var(--ink-2);
    line-height:1.55}
  .rep li i{flex:0 0 auto;width:7px;height:7px;border-radius:50%;margin-top:6px;
    background:var(--ink-4)}
  .rep li.good i{background:#2FE0CE}
  .rep li.bad  i{background:var(--red)}
  .rep li b{color:var(--ink)}
  .rep .note{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
    font-size:14.5px;color:var(--ink-4);line-height:1.6}
</style>

<script>
(function(){
  var T=TERRA, Q=window.QBANK||{};
  T.mountNav("study.html");
  var P=new URLSearchParams(location.search);
  var leafCode=P.get("leaf")||"", wrongOnly=(P.get("mode")==="wrong");
  var leaf=leafCode?T.BY[leafCode]:null;
  var list=[], i=0, marks=[], picked=null, done=false;

  function esc(t){ return String(t==null?"":t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  /* 풀 수 있는 문항 = 은행에 글이 들어와 있는 것 */
  /* WebP 가 아직 안 만들어진 그림은 JPEG 로 되돌아간다 */
  function webpFallback(host){
    (host||document).querySelectorAll('img[src$=".webp"]').forEach(function(im){
      if(im.dataset.fb) return;
      im.dataset.fb="1";
      im.addEventListener("error",function(){
        if(im.dataset.done) return;
        im.dataset.done="1";
        im.src=im.src.replace(/\.webp$/,".jpg");
      });
    });
  }
  function playable(l){
    return (l.play||[]).filter(function(q){ return Q[q.id]; });
  }
  function buildList(){
    var all=playable(leaf);
    if(wrongOnly){
      var S=T.state();
      all=all.filter(function(q){ var a=S.ans[q.id]; return a && !a.ok; });
    }
    /* ★ 학년이 겨누는 시험이 다르다.
       전에는 **정렬**만 했더니 20문항 중 앞 몇 개만 통합사회고 나머지가
       선택과목이었다(고1 화면의 81%). 이제 갈래로 나눈다. */
    var S2=T.state(), grade=(S2.student&&S2.student.grade)||"고1";
    /* ★ 텍스트로 못 내는 문항은 빼고 시작한다.
       크롭 이미지를 붙이지 않기로 했으므로, 글이 온전하지 않으면
       화면에 올려도 못 푼다. 실제로 났다 — 선지가 "① ㄱ, ㄴ" 인데
       보기 상자가 통째로 없어 ㄱ·ㄴ 이 무슨 말인지 알 수 없었다. */
    if(window.QRENDER){
      var 되는것=all.filter(function(q){ return QRENDER.ok(Q[q.id], q); });
      if(되는것.length) all=되는것;      // 하나도 안 남으면 어쩔 수 없이 그대로
    }

  /* 고른 선지의 설명을 맨 앞에, 정답 설명을 그다음에.

  function whyHtml(d, pick, ok){

    var out='';

        '<span>'+esc(d.w[String(pick+1)])+'</span></span></div>';
    var why=d.c||d.w[String(d.a+1)]||"";
    if(why)
      out+='<div class="whyrow right"><span class="no">'+M.charAt(d.a)+'</span>'+
        '<span class="tt"><b>'+(ok?"이래서 맞았어요":"이게 정답인 이유")+'</b>'+
        '<span>'+esc(why)+'</span></span></div>';

      out+='<div class="whyrow right"><span class="no">'+M.charAt(d.a)+'</span>'+

        '</span></div>';
    var rest=Object.keys(d.w).filter(function(k){
      return (+k-1)!==d.a && (ok || (+k-1)!==pick); });
    if(rest.length)
      out+='<details class="whymore"><summary>나머지 선지도 보기</summary>'+
        rest.sort().map(function(k){
          return '<div class="whyrow"><span class="no">'+M.charAt(+k-1)+'</span>'+
            '<span class="tt"><span>'+esc(d.w[k])+'</span></span></div>';
        }).join("")+'</details>';
    return out;

  function judge(q,d,vpick,btn){
    var r=T.answer(q.id,vpick), ok=r?r.ok:(vpick===d.a);
    marks.push(ok);
    document.querySelectorAll(".opt").forEach(function(b,k){
      b.disabled=true;
      if(k===d.a){ b.dataset.s="ok"; } else if(b===btn) b.dataset.s="no";
    });
    progress(); session();
    var last=(i+1>=list.length);
    document.getElementById("v").innerHTML=
      '<div class="verdict"><div class="vl">'+
      '<span class="tag2 '+(ok?"ok":"no")+'">'+(ok?"정답":"오답")+'</span>'+
      '<span class="mono" style="font-size:13px;color:var(--ink-3)">정답 '+
      "①②③④⑤".charAt(d.a)+(ok?'':', 내가 고른 것 '+"①②③④⑤".charAt(vpick))+'</span></div>'+
      whyHtml(d,vpick,ok)+
      '<span class="src">'+esc(q.g||"")+' '+esc(q.d||"")+' '+(q.n||"")+'번, '+
      esc(q.lb||"")+'</span></div>'+
      '<div class="gorow"><button class="btn" id="next">'+(last?"결과 보기":"다음 문제")+'</button>'+
      '<span class="hint">'+(i+1)+' / '+list.length+' 째</span></div>';
    document.getElementById("next").onclick=function(){ i++; render(); };
  }

  function finish(){
    done=true; progress(); session();
    var got=marks.filter(Boolean).length;
    var missed=list.filter(function(q,k){ return marks[k]===false; });
    document.getElementById("stage").innerHTML=
      '<div class="qbody" style="text-align:center;padding:52px 20px 46px">'+
      '<div style="font-family:var(--mono);font-size:64px;font-weight:600;color:var(--ink);'+
      'letter-spacing:-.05em;line-height:1">'+got+
      '<span style="color:var(--ink-4);font-size:34px"> / '+list.length+'</span></div>'+
      '<p style="margin-top:12px;color:var(--ink-3);font-size:15px">'+
      (got===list.length?"전부 맞혔습니다.":
       missed.length<=2?"거의 다 왔습니다. 놓친 것만 다시 보세요.":
       "틀린 것을 모아 두었습니다. 바로 다시 갈 수 있습니다.")+'</p>'+
      '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px">'+
      (missed.length?'<button class="btn" id="retry">틀린 '+missed.length+'개만 다시</button>':'')+
      '<button class="btn '+(missed.length?"ghost":"")+'" id="more">이 단원 더 풀기</button>'+
      '<a class="btn ghost" href="study.html">다른 단원</a>'+
      '<a class="btn ghost" href="index.html">학습 홈</a></div></div>';
    function retry(){ list=missed; i=0; marks=[]; done=false;
      if(window.COACH) COACH.begin({leaf:leaf.code, kind:"retry"}); render(); }
    function more(){ buildList(); render(); }
    var rt=document.getElementById("retry");
    if(rt) rt.onclick=retry;
    document.getElementById("more").onclick=more;
    /* ★ 결산 — 짠. 맞은 수·이해도 변화·오늘 누적을 한 화면에 */
    if(window.COACH) COACH.wrap({got:got, total:list.length, leaf:leaf.code, kind:"q",
      retry: missed.length ? {label:"틀린 "+missed.length+"개만 다시", onclick:retry} : null,
      more: {label:"이 단원 더 풀기", onclick:more}});
  }

  /* ══════ 시작 ══════ */
  if(!leaf){ renderPick(); }
  else{
    buildList();
    if(!list.length){
      shell();
      document.getElementById("stage").innerHTML=
        '<div class="empty"><p style="font-size:16px;color:var(--ink-2)">'+
        (wrongOnly?"이 단원에서 틀린 문항이 없습니다.":"이 단원은 아직 글로 풀 수 있는 문항이 없습니다.")+
        '</p><p style="margin-top:8px;font-size:14px">도표나 지도가 있어야 읽히는 문항이라 '+
        '크롭 작업이 끝나야 올라옵니다.</p>'+
        '<div style="margin-top:22px"><a class="btn" href="study.html">다른 단원 고르기</a></div></div>';
    }else{
      shell(); render();
    }
  }
  window.addEventListener("terra:skin", function(){});
})();
</script>
<script>
/* ★ 개발 중(localhost)에는 서비스워커를 **등록하지 않고, 이미 등록된 것은 푼다.**
   js·css 를 캐시 먼저 주는 전략이라 고치고 열면 늘 한 판 늦는다 —
   실제로 확장팩 화면이 열 개 전부 "준비 중" 으로 보여 한참 헤맸다(2026-09-03).
   개발서버는 no-store 인데 서비스워커는 서버 헤더와 무관하게 제 캐시를 준다.
   배포 주소에서는 그대로 등록한다 — 오프라인은 실사용에서 값어치가 있다. */
(function () {
  if (!("serviceWorker" in navigator)) return;
  var 개발 = location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if (개발) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { r.unregister(); });
    }).catch(function () {});
    if (window.caches) caches.keys().then(function (ks) {
      ks.forEach(function (k) { caches.delete(k); });
    }).catch(function () {});
    return;
  }
  addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
})();
</script>
