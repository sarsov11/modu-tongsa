<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내신 Killer Drill — 모두의 통사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FAF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="모두의 통사">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/favicon.png">
<link rel="stylesheet" href="css/base.css?v=873fa070">
<link rel="stylesheet" href="css/coach.css?v=57f0f96e">
<link rel="stylesheet" href="css/question.css?v=8db784a8">
<script>try{var _s=localStorage.getItem("terra.skin");if(_s===null||_s==="")_s="jelly";if(_s==="night")_s="";if(_s==="diary")_s="jelly";if(_s)document.documentElement.dataset.skin=_s;}catch(e){}</script>
<style>
  .page{max-width:860px;margin:0 auto;padding:0 var(--s3) var(--s6)}
  .hd{padding:var(--s5) 0 var(--s3)}
  .hd h1{font-size:30px;letter-spacing:-.04em;margin:8px 0 6px}
  .hd p{color:var(--ink-3);font-size:16px;margin:0;font-weight:500}
  .hd .scope{margin-top:12px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);font-size:15px;font-weight:600;color:var(--ink-2)}
  .hd .scope b{color:var(--ink)}
  .hd .scope a{margin-left:8px;font-weight:800;color:var(--cta)}
  .grp{margin-top:26px}
  .grp h2{font-size:18px;letter-spacing:-.03em;margin:0 0 4px}
  .grp .sub{font-size:14.5px;color:var(--ink-3);margin:0 0 10px;font-weight:500}
  .pt{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);margin-bottom:10px}
  .pt .nm{font-size:17px;font-weight:900;letter-spacing:-.02em;color:var(--ink)}
  .pt .why{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .pt .why span{font-size:13px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
  .pt .why span.deep{border-color:var(--amber);color:var(--amber)}
  .pt .why span.hard{border-color:var(--red-line);color:var(--red-2)}
  .pt .why span.low{border-color:var(--line-3);color:var(--ink-3)}
  .pt .ask{margin-top:6px;font-size:14px;color:var(--ink-3);font-weight:500}
  .pt .st{font-size:14px;font-weight:800;color:var(--ink-3);text-align:right}
  .pt .st em{font-style:normal;display:block;font-size:24px;font-weight:900;color:var(--ink);letter-spacing:-.03em}
  .pt .btn{white-space:nowrap}
  .empty{padding:24px 20px;border:1px dashed var(--line-2);border-radius:var(--r2);color:var(--ink-3);font-size:15.5px;font-weight:500}
  /* 풀기 */
  .stage{margin-top:14px}
  .qcard{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);overflow:hidden}
  .qtop{display:flex;align-items:center;gap:10px;padding:13px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .qtop .chip{font-size:13.5px}
  .qtop .srcline{margin-left:auto;font-size:14px;color:var(--ink-3);font-weight:600}
  .qbody{padding:22px 24px 24px}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:20px}
  .opt{display:flex;gap:13px;align-items:flex-start;padding:14px 17px;border-radius:var(--r1);border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);font-family:var(--kr);font-size:16px;font-weight:500;cursor:pointer;text-align:left;line-height:1.55}
  .opt .k{flex:0 0 28px;height:28px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;font-weight:900;color:var(--ink)}
  .opt[disabled]{cursor:default}
  .opt[data-s="ok"]{border-color:var(--mint);background:var(--mint-soft);color:var(--ink)} .opt[data-s="ok"] .k{background:var(--mint);color:#fff}
  .opt[data-s="no"]{border-color:var(--red);background:var(--red-soft)} .opt[data-s="no"] .k{background:var(--red);color:#fff}
  .opts.nums{flex-direction:row;flex-wrap:wrap} .opts.nums .opt{padding:12px 16px}
  .verdict{margin-top:18px;padding:16px 18px;border-radius:var(--r2);background:var(--surface-2);border:1px solid var(--line)}
  .verdict .vl{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .tag2{padding:4px 11px;border-radius:99px;font-size:14px;font-weight:900} .tag2.ok{background:var(--mint);color:#fff} .tag2.no{background:var(--red);color:#fff}
  .verdict p{margin:0;font-size:15.5px;line-height:1.65;color:var(--ink-2);font-weight:500}
  .gorow{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .gorow .hint{font-size:14px;font-weight:700;color:var(--ink-3)}
  .fin{padding:26px 20px;text-align:center;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface)}
  .fin b{display:block;font-size:40px;font-weight:900;letter-spacing:-.04em;color:var(--ink)} .fin b small{font-size:20px;color:var(--ink-3)}
  .fin p{margin:8px 0 16px;font-size:15.5px;color:var(--ink-2);font-weight:500}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--ink-3);margin-bottom:14px;cursor:pointer;background:none;border:0;font-family:var(--kr);padding:0}
  @media (max-width:520px){ .pt{grid-template-columns:1fr} .pt .st{text-align:left} .pt .st em{display:inline;margin-right:4px} }
</style>
</head>
<body>
<div class="page">
  <div class="hd">
    <span class="kicker"><i></i>Killer Drill</span>
    <h1>내신 Killer Drill</h1>
    <p>이번 시험 범위에서 헷갈리는 문항만 집중 연습할 수 있어요.</p>
    <div class="scope" id="scope"></div>
  </div>
  <div id="host"></div>
</div>

<script src="js/tree.js?v=8696fd11"></script>
<script src="js/qbank.js?v=074be56e"></script>
<script src="js/oxbank.js?v=1884002d"></script>
<script src="js/cardox.js?v=0e6d325d"></script>
<script src="js/conceptq.js?v=9577894d"></script>
<script src="js/cards.js?v=f1dd1e75"></script>
<script src="js/keyword.js?v=810eff32"></script>
<script src="js/kwgrade.js?v=dc3854d5"></script>
<script src="js/judge.js?v=43f690d4"></script>
<script src="js/pool.js?v=b9bb4baa"></script>
<script src="js/drills.js?v=9d14bfc8"></script>
<script src="js/trend.js?v=53fd8a90"></script>
<script src="js/store.js?v=dfb93453"></script>
<script src="js/qrender.js?v=baf2df9c"></script>
<script src="js/naeshin.js?v=98cce591"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supa.config.js?v=e1d10860"></script>
<script src="js/auth.js?v=72d8dbed"></script>
<script src="js/coach.js?v=41172bcc"></script>
<script>
(function(){
  var T=window.TERRA, Q=window.QBANK||{}, M="①②③④⑤";
  T.mountNav && T.mountNav("drill");
  var host=document.getElementById("host");
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function src(q){ return esc(QRENDER.출처(q))+(q.p?", "+q.p+"점":""); }

  /* 머리 — 시험·범위 */
  (function(){
    var nx=T.nextExam?T.nextExam():null, el=document.getElementById("scope");
    if(!T.scopeOn()){ el.innerHTML='시험 범위를 정하면 그 범위만 연습해요.<a href="settings.html">범위 정하기</a>'; return; }
    el.innerHTML=(nx?'<b>'+esc(nx.exam.name)+' '+esc(nx.label)+'</b>, ':'')+'범위 <b>'+esc(T.scopeName())+'</b><a href="settings.html">범위 고치기</a>';
  })();

  var P=window.NAESHIN?NAESHIN.포인트들():[];
  function list(){
    if(!P.length){ host.innerHTML='<div class="empty">이 범위에는 아직 연습할 문항이 없어요.</div>'; return; }
    var byMid={}, order=[];
    P.forEach(function(x){ var k=x.mid.code; if(!byMid[k]){ byMid[k]=[]; order.push(k); } byMid[k].push(x); });
    host.innerHTML=order.map(function(k){
      var xs=byMid[k], m=xs[0].mid, r=xs[0].root;
      return '<div class="grp"><h2>'+esc(r.name)+', '+esc(m.name)+'</h2>'+
        xs.map(function(x){
          var why='';
          if(x.st.solved) why+='<span class="low">내 정답률 '+(x.st.pct==null?"—":x.st.pct+"%")+'</span>'; else why+='<span class="low">아직 안 풀었어요</span>';
          return '<div class="pt"><div><div class="nm">'+esc(x.leaf.name)+'</div><div class="why">'+why+'</div>'+
'</div>'+
            '<div><button class="btn" data-leaf="'+x.leaf.code+'">'+x.풀거리.length+'문제 풀기</button></div></div>';
        }).join("")+'</div>';
    }).join("");
    host.querySelectorAll("[data-leaf]").forEach(function(b){ b.onclick=function(){ solve(b.dataset.leaf); }; });
  }

  function solve(leafCode){
    var x=P.filter(function(p){ return p.leaf.code===leafCode; })[0]; if(!x) return;
    var list_=x.풀거리.slice(), i=0, marks=[];
    function render(){
      if(i>=list_.length) return finish();
      var q=list_[i], d=Q[q.id];
      var 몸=window.QRENDER?QRENDER.html(d,q,{}):('<p>'+esc(d.q)+'</p>');
      몸=몸.replace(/<ol class="opts5">[\s\S]*?<\/ol>/,'');
      host.innerHTML='<button class="back" id="back">← 목록</button>'+
        '<div class="grp" style="margin-top:0"><h2>'+esc(x.leaf.name)+'</h2><p class="sub">'+(i+1)+' / '+list_.length+'</p></div>'+
        '<div class="stage"><div class="qcard"><div class="qtop"><span class="chip">'+'기출'+'</span>'+'<span class="srcline">'+src(q)+'</span></div>'+
        '<div class="qbody">'+몸+'<div class="opts'+(q.ff?' nums':'')+'">'+(q.ff?[0,1,2,3,4]:d.o.map(function(_,k){return k;})).map(function(k){
          return '<button class="opt" data-v="'+k+'"><span class="k">'+M.charAt(k)+'</span>'+(q.ff?'':'<span>'+(window.QRENDER?QRENDER.body(d.o[k]):esc(d.o[k]))+'</span>')+'</button>';
        }).join("")+'</div><div id="v"></div></div></div></div>';
      document.getElementById("back").onclick=list;
      host.querySelectorAll(".opt").forEach(function(b){ b.onclick=function(){ judge(q,d,+b.dataset.v,b); }; });
      if(window.webpFallback) webpFallback(document);
      window.scrollTo({top:0,behavior:"smooth"});
    }
    function judge(q,d,pick,btn){
      var r=T.answer?T.answer(q.id,pick):null, ok=r?r.ok:(pick===d.a); marks.push(ok);
      host.querySelectorAll(".opt").forEach(function(b,k){ b.disabled=true; if(k===d.a){ b.dataset.s="ok"; } else if(b===btn) b.dataset.s="no"; });
      var why=d.x?'<p>'+esc(d.x)+'</p>':'<p>이 문항은 해설이 함께 오지 않았습니다.</p>';
      document.getElementById("v").innerHTML='<div class="verdict"><div class="vl"><span class="tag2 '+(ok?"ok":"no")+'">'+(ok?"정답":"오답")+'</span>'+
        '<span style="font-size:14.5px;font-weight:800;color:var(--ink-3)">정답 '+M.charAt(d.a)+(ok?'':', 내가 고른 것 '+M.charAt(pick))+'</span></div>'+why+
        '<div class="gorow"><button class="btn" id="next">'+(i+1>=list_.length?"결과 보기":"다음 문제")+'</button><span class="hint">'+(i+1)+' / '+list_.length+'</span></div></div>';
      document.getElementById("next").onclick=function(){ i++; render(); };
      document.getElementById("v").scrollIntoView({behavior:"smooth",block:"center"});
    }
    function finish(){
      var got=marks.filter(Boolean).length;
      host.innerHTML='<button class="back" id="back">← 목록</button><div class="fin"><b>'+got+'<small> / '+list_.length+'</small></b>'+
        '<p>'+(got===list_.length?"이 자리는 다 맞혔습니다.":"틀린 문항은 오늘 복습에 들어갑니다.")+'</p>'+
        '<button class="btn" id="again">다른 자리 보기</button></div>';
      document.getElementById("back").onclick=list; document.getElementById("again").onclick=function(){ P=NAESHIN.포인트들(); list(); };
      window.scrollTo({top:0,behavior:"smooth"});
    }
    render();
  }
  list();
})();
</script>
</body>
</html>
